'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── Input ──────────────────────────────────────────────────────────────────
const keys = {};
const mouse = { x: 400, y: 300, down: false, clicked: false };
canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = (e.clientX - r.left)*(canvas.width/r.width); mouse.y = (e.clientY - r.top)*(canvas.height/r.height); });
canvas.addEventListener('mousedown', () => { if(typeof SFX!=='undefined')SFX.ensure(); mouse.down = true; mouse.clicked = true; });
canvas.addEventListener('mouseup', () => { mouse.down = false; });
document.addEventListener('keydown', e => { if(typeof SFX!=='undefined')SFX.ensure(); keys[e.key.toLowerCase()] = true; if ('pP'.includes(e.key) || e.key === 'Escape') togglePause(); if((e.key==='i'||e.key==='I'||e.key==='ш'||e.key==='Ш')&&state==='play')showInv=!showInv;
  if(e.key==='m'||e.key==='M'||e.key==='ь'||e.key==='Ь'){ if(typeof SFX!=='undefined')SFX.toggle(); }
  if(DEV&&state==='play'){ if(e.key==='-')devXp=Math.max(2,devXp-2); else if(e.key==='=')devXp+=2; else if(e.key==='[')devDrop=Math.max(1,devDrop-1); else if(e.key===']')devDrop+=1; XP_RATE=devXp; }
  e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ── Звук (Web Audio, синтез, негромкий; без ассетов) ─────────────────────────
const SFX = (function(){
  let ctx=null, master=null, comp=null, enabled=true, started=false; const last={};
  function init(){ if(started)return; started=true; try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; ctx=new AC(); comp=ctx.createDynamicsCompressor(); master=ctx.createGain(); master.gain.value=0.4; comp.connect(master); master.connect(ctx.destination); enabled=!(typeof meta!=='undefined'&&meta&&meta.muted); }catch(e){ ctx=null; } }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  function gate(k,ms){ const n=(typeof performance!=='undefined')?performance.now():Date.now(); if(last[k]&&n-last[k]<ms)return false; last[k]=n; return true; }
  function env(node,t,vol,dur){ const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); node.connect(g); g.connect(comp); }
  function tone(type,f1,f2,vol,dur,lp){ if(!ctx||!enabled)return; const t=ctx.currentTime; const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f1,t); if(f2!=null)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur); let n=o; if(lp){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(f);n=f;} env(n,t,vol,dur); o.start(t); o.stop(t+dur+0.03); }
  function noise(vol,dur,lp){ if(!ctx||!enabled)return; const t=ctx.currentTime,len=Math.max(1,Math.floor(ctx.sampleRate*dur)); const b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||1000; s.connect(f); env(f,t,vol,dur); s.start(t); s.stop(t+dur+0.02); }
  function chord(fs,vol,dur){ fs.forEach((f,i)=>setTimeout(()=>tone('sine',f,f,vol,dur,4000),i*70)); }
  const map={
    swing:()=>{ if(gate('swing',55))noise(0.04,0.09,1500); },
    shot:()=>{ if(gate('shot',40))tone('sine',680,300,0.04,0.08,3000); },
    hit:()=>{ if(gate('hit',45))noise(0.03,0.05,1000); },
    crit:()=>{ if(gate('crit',55))tone('triangle',880,1300,0.055,0.13,5000); },
    enemyDie:()=>{ if(gate('die',55))tone('triangle',240,90,0.05,0.13,2000); },
    hurt:()=>{ if(gate('hurt',110))tone('sine',200,90,0.09,0.18,1200); },
    q:()=>tone('triangle',520,760,0.055,0.16,3500),
    e:()=>tone('sine',440,660,0.055,0.18,3000),
    r:()=>tone('sawtooth',180,520,0.04,0.22,1400),
    x:()=>{ tone('sine',150,90,0.07,0.34,800); noise(0.045,0.24,520); },
    levelup:()=>chord([523,659,784,1047],0.055,0.3),
    pickup:()=>tone('triangle',880,1320,0.045,0.1,4000),
    gold:()=>{ if(gate('gold',60))tone('square',1200,1600,0.028,0.07,5000); },
    wave:()=>chord([392,494,587],0.05,0.25),
    boss:()=>{ tone('sawtooth',110,70,0.07,0.6,600); tone('sine',55,42,0.06,0.7,300); },
    explosion:()=>{ if(gate('expl',55)){ noise(0.065,0.22,700); tone('sine',120,50,0.055,0.25,400); } },
    ui:()=>{ if(gate('ui',40))tone('sine',520,520,0.04,0.05,3000); }
  };
  return { init, resume, ensure(){ init(); resume(); }, play(n){ if(!enabled||!ctx)return; const f=map[n]; if(f)f(); },
    toggle(){ enabled=!enabled; if(typeof meta!=='undefined'&&meta){ meta.muted=!enabled; if(typeof saveSave==='function')saveSave(); } if(enabled)resume(); return enabled; }, isOn(){ return enabled; } };
})();

// ── Мобильное управление (тач): джойстик движения + прицел/огонь + кнопки умений ──
const TOUCH = { enabled:(('ontouchstart' in window)||(navigator.maxTouchPoints>0)), active:false, idMap:{},
  move:{active:false,ox:0,oy:0,nx:0,ny:0,mag:0}, aim:{active:false,ox:0,oy:0,nx:0,ny:0,mag:0,fire:false}, btn:{q:false,e:false,r:false,x:false} };
const TOUCH_BTN={ r:{x:700,y:462,rad:27,col:'#cc3399'}, q:{x:756,y:432,rad:27,col:'#3399ff'}, e:{x:756,y:492,rad:27,col:'#33cccc'}, x:{x:700,y:522,rad:31,col:'#aa44ff'} };
function _txy(t){ const r=canvas.getBoundingClientRect(); return { x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height) }; }
function _abilAt(x,y){ for(const k in TOUCH_BTN){ const b=TOUCH_BTN[k]; if(Math.hypot(x-b.x,y-b.y)<=b.rad+8) return k; } return null; }
function _joy(j,p){ const R=58; let vx=p.x-j.ox, vy=p.y-j.oy, m=Math.hypot(vx,vy); if(m>R){ vx=vx/m*R; vy=vy/m*R; m=R; } j.nx=vx/R; j.ny=vy/R; j.mag=m/R; }
canvas.addEventListener('touchstart', e=>{ if(typeof SFX!=='undefined')SFX.ensure(); TOUCH.active=true;
  if(state!=='play'){ const p=_txy(e.changedTouches[0]); mouse.x=p.x; mouse.y=p.y; return; }   // в меню — пусть сработает синтетический click
  for(const t of e.changedTouches){ const p=_txy(t); const ab=_abilAt(p.x,p.y);
    if(ab){ TOUCH.btn[ab]=true; TOUCH.idMap[t.identifier]=ab; }
    else if(p.x<400){ TOUCH.move.active=true; TOUCH.move.ox=p.x; TOUCH.move.oy=p.y; _joy(TOUCH.move,p); TOUCH.idMap[t.identifier]='move'; }
    else { TOUCH.aim.active=true; TOUCH.aim.ox=p.x; TOUCH.aim.oy=p.y; _joy(TOUCH.aim,p); TOUCH.aim.fire=true; TOUCH.idMap[t.identifier]='aim'; } }
  e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', e=>{ if(state!=='play')return; for(const t of e.changedTouches){ const role=TOUCH.idMap[t.identifier]; if(!role)continue; const p=_txy(t); if(role==='move')_joy(TOUCH.move,p); else if(role==='aim'){ _joy(TOUCH.aim,p); TOUCH.aim.fire=TOUCH.aim.mag>0.25; } } e.preventDefault(); }, {passive:false});
function _touchEnd(e){ for(const t of e.changedTouches){ const role=TOUCH.idMap[t.identifier]; if(!role)continue; if(role==='move'){ TOUCH.move.active=false; TOUCH.move.nx=TOUCH.move.ny=TOUCH.move.mag=0; } else if(role==='aim'){ TOUCH.aim.active=false; TOUCH.aim.fire=false; TOUCH.aim.nx=TOUCH.aim.ny=TOUCH.aim.mag=0; } else TOUCH.btn[role]=false; delete TOUCH.idMap[t.identifier]; } }
canvas.addEventListener('touchend', e=>{ _touchEnd(e); if(state==='play')e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchcancel', _touchEnd);

// ── Util ───────────────────────────────────────────────────────────────────
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const normA = a => { while (a > Math.PI) a -= Math.PI*2; while (a < -Math.PI) a += Math.PI*2; return a; };
function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' '); let line = '';
  for (const w of words) { const t = line + w + ' '; if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line.trim(), cx, y); y += lh; line = w + ' '; } else line = t; }
  if (line.trim()) ctx.fillText(line.trim(), cx, y);
}

// ── Particle ───────────────────────────────────────────────────────────────
class Particle {
  constructor(x, y, vx, vy, color, life, size = 3) { Object.assign(this, { x, y, vx, vy, color, life, maxLife: life, size }); }
  update(dt) { this.x += this.vx*dt; this.y += this.vy*dt; this.vx *= 0.93; this.vy *= 0.93; this.life -= dt; }
  draw() { ctx.globalAlpha = clamp(this.life/this.maxLife, 0, 1); ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; }
}

class Ring {
  constructor(x, y, color, maxR = 165) { this.x=x; this.y=y; this.r=10; this.maxR=maxR; this.life=0.7; this.maxLife=0.7; this.color=color; }
  update(dt) { this.r += (this.maxR-10)/this.maxLife*dt; this.life -= dt; }
  draw() { ctx.globalAlpha = clamp(this.life/this.maxLife,0,1)*0.85; ctx.strokeStyle=this.color; ctx.lineWidth=4; ctx.shadowColor=this.color; ctx.shadowBlur=14; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0; ctx.globalAlpha=1; }
}

// ── Projectile ─────────────────────────────────────────────────────────────
class Proj {
  constructor(x, y, angle, spd, dmg, color, size, isEnemy=false, pierce=0, explode=false, explodeR=70, doubleExplode=false) {
    this.x=x; this.y=y; this.vx=Math.cos(angle)*spd; this.vy=Math.sin(angle)*spd;
    this.dmg=dmg; this.color=color; this.size=size;
    this.isEnemy=isEnemy; this.dead=false; this.pierce=pierce; this.explode=explode; this.explodeR=explodeR; this.doubleExplode=doubleExplode;
    this.hit=new Set(); this.trail=[];
    this.sticky=false; this.stuck=false; this.stuckTimer=0; this.stuckAngle=0;
    this.fireTrail=false; this.bouncy=false; this.bounceCount=0; this.homing=false;
    this.maxDist=0; this.traveled=0;   // F4: детонация по пройденной дистанции (метеоры волшебника)
    this.slowDur=0;                    // замедление при взрыве (апгрейд Метеора)
    this.src='atk';                    // Идея 1: источник урона (для kills_by_*)
    if(!isEnemy) track('projectiles_fired');
  }
  update(dt, parts=[]) {
    if(this.stuck){this.stuckTimer-=dt;if(this.stuckTimer<=0)this.dead=true;return;}
    this.trail.push({x:this.x,y:this.y}); if(this.trail.length>9) this.trail.shift();
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    // Лучник: самонаведение — мягко доворачиваем к ближайшему врагу
    if(this.homing&&!this.isEnemy&&typeof enemies!=='undefined'&&enemies.length){
      let best=null,bd=1e9; for(const e of enemies){if(e.dead)continue;const dd=(e.x-this.x)*(e.x-this.x)+(e.y-this.y)*(e.y-this.y);if(dd<bd){bd=dd;best=e;}}
      if(best&&bd<360*360){const sp=Math.hypot(this.vx,this.vy),ca=Math.atan2(this.vy,this.vx);let da=Math.atan2(best.y-this.y,best.x-this.x)-ca;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;const na=ca+clamp(da,-0.13,0.13);this.vx=Math.cos(na)*sp;this.vy=Math.sin(na)*sp;}
    }
    const L=22,T=22,R=worldW-22,B=worldH-22;   // F5: границы стен мира
    // F4: детонация по пройденной дистанции (метеоры волшебника)
    if(this.maxDist>0){
      this.traveled+=Math.hypot(this.vx,this.vy)*dt;
      if(this.traveled>=this.maxDist){
        if(this.explode){explodeAt(this.x,this.y,this.dmg*0.7,parts,this.explodeR,this.slowDur,this.src);rings.push(new Ring(this.x,this.y,'#ff6600',this.explodeR*0.6));}
        this.dead=true;return;
      }
    }
    // sticky-стрела (лучник без bouncy)
    if(this.sticky&&!this.isEnemy&&(this.x<=L||this.x>=R||this.y<=T||this.y>=B)){
      this.stuck=true;this.stuckTimer=5;this.stuckAngle=Math.atan2(this.vy,this.vx);
      this.x=clamp(this.x,L,R);this.y=clamp(this.y,T,B);return;
    }
    // F4: bouncy — максимум 2 отскока, на 3-м контакте со стеной стрела застревает
    if(this.bouncy&&!this.isEnemy){
      const atWall=this.x<=L||this.x>=R||this.y<=T||this.y>=B;
      if(atWall){
        if(this.bounceCount>=2){
          this.stuck=true;this.stuckTimer=5;this.stuckAngle=Math.atan2(this.vy,this.vx);
          this.x=clamp(this.x,L,R);this.y=clamp(this.y,T,B);return;
        }
        this.bounceCount++; track('arrows_bounced');
        if(this.x<=L){this.vx=Math.abs(this.vx);this.x=L+1;}
        else if(this.x>=R){this.vx=-Math.abs(this.vx);this.x=R-1;}
        if(this.y<=T){this.vy=Math.abs(this.vy);this.y=T+1;}
        else if(this.y>=B){this.vy=-Math.abs(this.vy);this.y=B-1;}
      }
    }
    // взрыв огненного шара волшебника о стену
    if(this.explode&&!this.isEnemy&&(this.x<=L||this.x>=R||this.y<=T||this.y>=B)){
      this.x=clamp(this.x,L,R);this.y=clamp(this.y,T,B);
      explodeAt(this.x,this.y,this.dmg*0.7,parts,this.explodeR,this.slowDur,this.src);
      rings.push(new Ring(this.x,this.y,'#ff6600',this.explodeR*0.6));
      this.dead=true;return;
    }
    if(this.x<0||this.x>worldW||this.y<0||this.y>worldH) this.dead=true;
  }
  draw() {
    if(this.stuck){
      const fade=clamp(this.stuckTimer/5,0,1),sa=this.stuckAngle,len=13;
      ctx.globalAlpha=fade;ctx.shadowColor=this.color;ctx.shadowBlur=8;
      ctx.strokeStyle=this.color;ctx.lineWidth=2.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(this.x-Math.cos(sa)*len,this.y-Math.sin(sa)*len);ctx.lineTo(this.x,this.y);ctx.stroke();
      const tx=this.x-Math.cos(sa)*len,ty=this.y-Math.sin(sa)*len;
      ctx.strokeStyle='rgba(180,255,140,0.7)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+Math.cos(sa+0.5)*5,ty+Math.sin(sa+0.5)*5);ctx.moveTo(tx,ty);ctx.lineTo(tx+Math.cos(sa-0.5)*5,ty+Math.sin(sa-0.5)*5);ctx.stroke();
      ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.lineCap='butt';return;
    }
    if(this.fireTrail){
      const ftc=['#ff2200','#ff6600','#ffbb00'];
      for(let i=0;i<this.trail.length;i++){const f=i/this.trail.length;ctx.globalAlpha=f*0.7;ctx.fillStyle=ftc[Math.floor(f*ftc.length)];ctx.shadowColor='#ff4400';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(this.trail[i].x,this.trail[i].y,this.size*1.4*f,0,Math.PI*2);ctx.fill();}
    } else {
      for(let i=0;i<this.trail.length;i++){const f=i/this.trail.length;ctx.globalAlpha=f*0.35;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.trail[i].x,this.trail[i].y,this.size*f,0,Math.PI*2);ctx.fill();}
    }
    ctx.globalAlpha=1; ctx.shadowColor=this.color; ctx.shadowBlur=12; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  }
}

// ── BladeWave ──────────────────────────────────────────────────────────────
class BladeWave {
  constructor(x,y,angle,dmg,hitR=38){
    this.x=x;this.y=y;this.angle=angle;
    this.vx=Math.cos(angle)*480;this.vy=Math.sin(angle)*480;
    this.src='q';
    this.dmg=dmg;this.hitR=hitR;this.dead=false;this.hit=new Set();
    this.life=0.55;this.maxLife=0.55;this.trail=[];
  }
  update(dt){
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>8)this.trail.shift();
    this.x+=this.vx*dt;this.y+=this.vy*dt;
    this.life-=dt;
    if(this.x<-80||this.x>worldW+80||this.y<-80||this.y>worldH+80||this.life<=0)this.dead=true;  // #6: границы мира, а не экрана (Q-волна не умирала мгновенно в открытом мире)
  }
  draw(){
    const sp=1.05,a=this.angle;
    for(let i=0;i<this.trail.length;i++){const f=i/this.trail.length;ctx.globalAlpha=f*0.15;ctx.strokeStyle='#88ddff';ctx.lineWidth=14;ctx.lineCap='round';ctx.beginPath();ctx.arc(this.trail[i].x,this.trail[i].y,this.hitR,a-sp,a+sp);ctx.stroke();}
    const al=this.life/this.maxLife;
    ctx.globalAlpha=al;ctx.shadowColor='#aaeeff';ctx.shadowBlur=22;
    ctx.strokeStyle='#cceeff';ctx.lineWidth=11;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(this.x,this.y,this.hitR,a-sp,a+sp);ctx.stroke();
    ctx.strokeStyle='#ffffff';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(this.x,this.y,this.hitR-7,a-sp+0.1,a+sp-0.1);ctx.stroke();
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.lineCap='butt';
  }
}

// #2: кривая опыта — равномерная прокачка (нет гипер-быстрого старта при толпах в аркаде/опенворлде).
// XP_RATE масштабируется dev-режимом. xpForLevel(L) = опыт для перехода с уровня L на L+1.
let XP_RATE=1;
function xpForLevel(lvl){ return Math.round(50 + 38*Math.pow(lvl,1.25)); }
// #4: dev/prod-режим. PROD = обычный баланс. DEV = быстрый опыт + высокий шанс лута/редкостей + горячие клавиши тюнинга.
let DEV=false, devXp=10, devDrop=8;
function devDropChance(){ return DEV ? Math.min(0.6, DROP_CHANCE*devDrop) : PROD_DROP; }
function devLuck(pl){ return DEV ? 6 : (pl?pl.luck:0); }

    this.rFuryMult=6; this.furyRadius=130; this.furyArc=1.22; this.furyStun=0; this.furyShock=0; // мечник: Яростный удар (R) — урон +50%, радиус ↑
    // Идея 1: поля мета-перков

    this.bossDmgM=0; this.hpRegen=0; this.dodge=0; this.dashDist=1; this.invMult=0; this.onHitFreeze=0; this.onHitBurn=0; this.chillT=0; this.stunT=0; this.voidT=0;

  heal(n) { const b=this.hp; this.hp = Math.min(this.maxHp, this.hp+n); if(this.hp>b)track('healing_done',Math.round(this.hp-b)); }
  gainXp(n) {
    this.xp += n*(1+this.xpMult)*XP_RATE;
    while (this.xp >= this.xpNext) {
      this.xp -= this.xpNext; this.level++;
      trackMax('max_level',this.level); trackMax('maxlevel_'+this.classId,this.level);

      triggerLevelup();
    }
  }
  _dmg(base) { return base * this.dmgM; }

  update(dt) {
    let dx=0, dy=0;
    if(keys['w']||keys['arrowup'])    dy-=1;
    if(keys['s']||keys['arrowdown'])  dy+=1;
    if(keys['a']||keys['arrowleft'])  dx-=1;
    if(keys['d']||keys['arrowright']) dx+=1;
    let len=Math.hypot(dx,dy); if(len>0){dx/=len;dy/=len;}
    if(typeof TOUCH!=='undefined'&&TOUCH.active&&TOUCH.move.active){ dx=TOUCH.move.nx; dy=TOUCH.move.ny; len=Math.hypot(dx,dy); }   // мобильный стик движения (аналоговый)
    if(this.chillT>0)this.chillT-=dt; if(this.stunT>0)this.stunT-=dt;
    const espd=this.stunT>0?0:(this.chillT>0?this.spd*0.5:this.spd);   // стан (Голем-Владыка) / заморозка (Ледяной Владыка)
    this.x=clamp(this.x+dx*espd*dt, this.r+20, worldW-20-this.r);
    this.y=clamp(this.y+dy*espd*dt, this.r+20, worldH-20-this.r);
    if(len>0)track('distance_traveled',espd*dt);
    if(typeof TOUCH!=='undefined'&&TOUCH.active){
      if(TOUCH.aim.active&&TOUCH.aim.mag>0.001){ this.angle=Math.atan2(TOUCH.aim.ny,TOUCH.aim.nx); }   // ручной прицел правым стиком
      else { let bt=null,bd=1e9; for(const en of enemies){ if(en.dead)continue; const dd=dist(this,en); if(dd<bd){bd=dd;bt=en;} } if(bt)this.angle=Math.atan2(bt.y-this.y,bt.x-this.x); }   // авто-прицел на ближайшего
    } else { this.angle=Math.atan2((mouse.y+camY)-this.y, (mouse.x+camX)-this.x); }  // F5: мышь в мировых координатах
    if(this.atkTimer>0)this.atkTimer-=dt; if(this.qTimer>0)this.qTimer-=dt;
    if(this.eTimer>0)this.eTimer-=dt; if(this.rTimer>0)this.rTimer-=dt; if(this.invTimer>0)this.invTimer-=dt;
    if(this.xTimer>0)this.xTimer-=dt;
    if(this.swingTimer>0)this.swingTimer-=dt;
    if(this.passiveGlow>0)this.passiveGlow-=dt;
    this.xpDisplay+=(this.xp-this.xpDisplay)*Math.min(1,dt*8);   // #3: плавное заполнение шкалы опыта
    if(this.voidT>0)this.voidT-=dt;

class Enemy {
  constructor(typeId, x, y, hpMult=1, dmgScale=1) {

    this.specTimer=1.2+Math.random()*2.2;                      // таймер спецспособностей
    this.chState='idle'; this.chT=0; this.chVx=0; this.chVy=0; // состояние рывка (носорог)
    this.born=(typeof performance!=='undefined')?performance.now():0; this.summoned=false; // Идея 1: трекинг
    this.bA=2.5+Math.random()*2; this.bB=4+Math.random()*2; this.bC=8; this.bD=20; this.eShield=0; this.boltT=0; this.didSplit=false; this.invuln=false; // боссы (идея 5)
    this.face=Math.random()*Math.PI*2; this.swingT=0; this.reflectCd=0; this.baseSpd=this.spd; this.baseDmg=this.dmg; this.mirrorCol=(typeof player!=='undefined'&&player&&player.c)?player.c.color:'#dd66dd'; this.stunT=0;   // элиты + оглушение
  }
  hit(dmg, parts, src='atk', crit=false) {
    if(this.invuln){ for(let i=0;i<3;i++)parts.push(new Particle(this.x,this.y,(Math.random()-.5)*100,(Math.random()-.5)*100,'#aaffcc',0.3,2)); return; }   // Лич: щит-неуязвимость

      if(player.bossDmgM>0&&(this.t.boss||this.typeId==='cursed'))dmg*=1+player.bossDmgM;
      if(player.onHitBurn>0&&Math.random()<player.onHitBurn)dmg*=1.5;
      if(player.onHitFreeze>0&&Math.random()<player.onHitFreeze)this.slow=Math.max(this.slow,1.2);
      if(player.arrowPoison>0){this.poison=Math.max(this.poison, player.c.dmg*player.dmgM*player.arrowPoison);this.poisonT=3;}  // лучник: яд при попадании
      if(this.t.frontshield){ const fa=Math.atan2(player.y-this.y,player.x-this.x); if(Math.abs(normA(fa-this.face))<Math.PI/2){ dmg*=0.18; for(let i=0;i<3;i++)parts.push(new Particle(this.x+Math.cos(this.face)*this.r,this.y+Math.sin(this.face)*this.r,(Math.random()-.5)*90,(Math.random()-.5)*90,'#ccccff',0.3,2)); } }   // Осквернённый рыцарь: блок по фронту
      if(this.t.reflect&&dist(this,player)>92&&this.reflectCd<=0){ this.reflectCd=0.45; player.takeDamage(Math.round(dmg*0.3)); for(let i=0;i<4;i++)parts.push(new Particle(this.x,this.y,(Math.random()-.5)*150,(Math.random()-.5)*150,'#88ddff',0.3,2)); }   // Кристаллический голем: отражает дальний урон
      if(player.voidT>0) dmg*=0.6;   // Аватар Бездны: герой в зоне тьмы бьёт слабее
    }
    let isCrit = (crit===true);
    if(crit==='roll' && typeof player!=='undefined' && player && Math.random()<(player.c.critChance+player.critBonus)) isCrit=true;
    if(isCrit && crit!==true){ dmg*=2.5; track('crit_hits'); }   // умения тоже могут крит.
    if(this.eShield>0){ const ab=Math.min(this.eShield,dmg); this.eShield-=ab; dmg-=ab; for(let i=0;i<3;i++)parts.push(new Particle(this.x,this.y,(Math.random()-.5)*120,(Math.random()-.5)*120,'#88ccff',0.3,2)); if(dmg<=0)return; }   // Голем-Владыка: щит поглощает урон
    this.hp-=dmg; this.flash=0.14;
    track('total_dmg_dealt', Math.floor(dmg)); if(typeof runStats!=='undefined'&&runStats)runStats.dmg=(runStats.dmg||0)+Math.floor(dmg);
    if(typeof floats!=='undefined' && (src==='q'||src==='e'||src==='r'||src==='x'||src==='passive'||isCrit)){ floats.push(new FloatText(this.x+(Math.random()-.5)*10,this.y-12,(isCrit?'✦':'')+Math.round(dmg),isCrit?'#ffffff':'#ffd060',isCrit?16:11)); }   // #2: цифры урона умений (+крит)
    if(typeof SFX!=='undefined'){ if(isCrit)SFX.play('crit'); else SFX.play('hit'); }
    for(let i=0;i<5;i++) parts.push(new Particle(this.x,this.y,(Math.random()-.5)*180,(Math.random()-.5)*180,'#ffaaaa',0.35,2));
    if(this.hp<=0){this.hp=0;this.dead=true;for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,s=110+Math.random()*160;parts.push(new Particle(this.x,this.y,Math.cos(a)*s,Math.sin(a)*s,this.t.color,0.8,3+Math.random()*3));}
      // Идея 1: трекинг убийства

      if(typeof runStats!=='undefined'&&runStats){ runStats.kills=(runStats.kills||0)+1; if(this.t.boss)runStats.bossKills=(runStats.bossKills||0)+1; }   // #3: счётчики забега
      if(typeof SFX!=='undefined')SFX.play('enemyDie');
      if(typeof player!=='undefined'&&player){ track('kills_as_'+player.classId); if(player.shieldHp>0)track('kills_while_shielded'); }
      if(this.slow>0) track('kills_on_frozen');
      if(this.summoned) track('summoner_minions_killed');
      if(this.t.splitter&&this.gen>=1) track('splitter_spawn_kills');
      if(src==='q'||src==='e'||src==='r'||src==='x'||src==='passive') track('kills_by_'+src);
      if(this.typeId==='troll'&&this.born&&performance.now()-this.born<30000) track('troll_fast_kills');
      if(this.typeId==='cursed'&&runStats){ runStats.cursed=(runStats.cursed||0)+1; trackMax('cursed_in_one_run',runStats.cursed); }
      if(runStats){ runStats.killsSinceDmg=(runStats.killsSinceDmg||0)+1; trackMax('nohit_kill_streak',runStats.killsSinceDmg); }
      comboKill();
      // Идея 2: дроп лута (18.7% на каждый из 4 слотов)
      if(this.t.boss&&typeof addGold==='function'){addGold(120,this.x,this.y);addShake(12);hitStopFor(0.1);track('kills_boss');
        if(typeof drops!=='undefined'&&drops.length<60){const sk=slotKeys()[Math.floor(Math.random()*slotKeys().length)];const ri=rollRarityBoss();const it={slot:sk,rarity:ri,affixes:genAffixes(sk,ri,Math.max(wave,1)),ilvl:Math.max(wave,1),sharpen:0};it.score=itemScore(it);drops.push(new Drop(this.x,this.y,it));}}   // идея 5: награда босса (золото+лут, Божественный ~1.5%)
      else if(this.typeId==='cursed'&&typeof addGold==='function'){addGold(40,this.x,this.y);addShake(10);hitStopFor(0.08);}   // Идея 3: золото за элиту
      if(typeof player!=='undefined'&&player&&drops.length<60){for(const sk of slotKeys()){if(Math.random()<devDropChance())drops.push(new Drop(this.x+(Math.random()-.5)*22,this.y+(Math.random()-.5)*22,rollItem(sk,Math.max(wave,1),devLuck(player))));}}
      // Чумной носитель: облако заразы при смерти
      if(this.t.plague&&typeof groundFX!=='undefined'){groundFX.push({x:this.x,y:this.y,r:90,life:5,max:5,kind:'poison'});rings.push(new Ring(this.x,this.y,'#88cc33',90));}
      // Взрывун: взрыв по игроку при смерти
      if(this.t.bomber){rings.push(new Ring(this.x,this.y,'#ff6600',95));if(typeof player!=='undefined'&&player&&dist(this,player)<95)player.takeDamage(Math.round(this.dmg*1.8));for(let i=0;i<20;i++){const a=Math.random()*Math.PI*2,s=120+Math.random()*160;parts.push(new Particle(this.x,this.y,Math.cos(a)*s,Math.sin(a)*s,'#ff7711',0.7,4));}}
      // Слизень: деление на 3 при смерти (один раз)
      if(this.t.splitter&&this.gen<1&&enemies.length<240){for(let k=0;k<3;k++){const a=Math.random()*Math.PI*2;const c=new Enemy('splitter',this.x+Math.cos(a)*16,this.y+Math.sin(a)*16,1,1);c.gen=1;c.r=Math.round(ET.splitter.r*0.6);c.hp=c.maxHp=Math.round(ET.splitter.hp*0.4);c.xp=10;c.dmg=Math.max(4,Math.round(this.dmg*0.6));c.roam=this.roam;c.aggroR=this.aggroR;enemies.push(c);}}
    }
  }
  update(dt, player, projs, parts) {
    if(this.dead) return;
    if(this.stunT>0){ this.stunT-=dt; if(this.flash>0)this.flash-=dt; this.wobble+=dt*3; return; }   // оглушён (взрыв щита мечника) — не двигается/не атакует
    this.wobble+=dt*3;
    const curSpd=this.slow>0?this.spd*0.33:this.spd;
    if(this.slow>0) this.slow=Math.max(0,this.slow-dt);
    if(this.poisonT>0){this.poisonT-=dt;this.hp-=this.poison*dt;if(Math.random()<0.25)parts.push(new Particle(this.x,this.y-this.r*0.4,(Math.random()-.5)*40,-26,'#7ad13a',0.45,2));if(this.hp<=0){this.hp=0;this.dead=true;}}  // лучник: тик яда
    const dx=player.x-this.x,dy=player.y-this.y,d=Math.hypot(dx,dy);
    const aggro=!this.roam||d<this.aggroR;   // F5: пока игрок далеко — монстр бродит по карте
    this.specTimer-=dt;

      else if(this.typeId==='charger'){const a=(typeof player!=='undefined'&&player)?Math.atan2(player.y-this.y,player.x-this.x):0;ctx.fillStyle='#552200';ctx.beginPath();ctx.moveTo(this.x+Math.cos(a)*(this.r+12),this.y+Math.sin(a)*(this.r+12));ctx.lineTo(this.x+Math.cos(a+0.4)*this.r,this.y+Math.sin(a+0.4)*this.r);ctx.lineTo(this.x+Math.cos(a-0.4)*this.r,this.y+Math.sin(a-0.4)*this.r);ctx.closePath();ctx.fill();}
      else if(this.typeId==='splitter'){ctx.fillStyle='#338833';ctx.beginPath();ctx.arc(this.x-5,this.y-3,4,0,Math.PI*2);ctx.arc(this.x+5,this.y+2,3,0,Math.PI*2);ctx.fill();}
      else if(this.typeId==='summoner'){ctx.fillStyle='#dd99ff';ctx.font='bold 15px Segoe UI';ctx.textAlign='center';ctx.fillText('✦',this.x,this.y+5);ctx.textAlign='left';}
      else if(this.typeId==='bomber'){const pp=Math.sin(Date.now()/110)*0.5+0.5;ctx.fillStyle=`rgba(255,${90+pp*120|0},0,0.95)`;ctx.beginPath();ctx.arc(this.x,this.y-this.r-3,3.5,0,Math.PI*2);ctx.fill();}
      else if(this.typeId==='healer'){ctx.fillStyle='#ccffee';ctx.fillRect(this.x-2,this.y-7,4,14);ctx.fillRect(this.x-7,this.y-2,14,4);}

      else if(this.typeId==='spitter'){ctx.fillStyle='#334411';ctx.beginPath();ctx.arc(this.x,this.y+3,5,0,Math.PI,false);ctx.fill();}

    }
    if(this.t.charger&&this.chState==='windup'&&typeof player!=='undefined'&&player){const a=Math.atan2(player.y-this.y,player.x-this.x);ctx.strokeStyle='rgba(255,80,0,0.7)';ctx.lineWidth=3;ctx.setLineDash([9,7]);ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x+Math.cos(a)*280,this.y+Math.sin(a)*280);ctx.stroke();ctx.setLineDash([]);}
    ctx.shadowBlur=0; ctx.fillStyle=this.slow>0?'#aaddff':'#ff2200';
    ctx.beginPath();ctx.arc(this.x-5,this.y-5,2.5,0,Math.PI*2);ctx.arc(this.x+5,this.y-5,2.5,0,Math.PI*2);ctx.fill();
    if(E_MARK[this.typeId]){ctx.font='12px Segoe UI';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=3;ctx.fillText(E_MARK[this.typeId],this.x,this.y-this.r-8);ctx.shadowBlur=0;ctx.textAlign='left';}   // Задача 3: маркер роли
    if(this.hp<this.maxHp){const bw=this.r*2.6,bx=this.x-bw/2,by=this.y-this.r-10;ctx.fillStyle='#440000';ctx.fillRect(bx,by,bw,4);ctx.fillStyle='#cc2200';ctx.fillRect(bx,by,bw*(this.hp/this.maxHp),4);}
  }
}

// ── Waves ──────────────────────────────────────────────────────────────────
const ELITES=['corruptknight','plaguebearer','berserker','mirror','voidavatar','crystalgolem','reaper'];   // элиты (ХП уровня Проклятого)
function buildWave(n) {
  if(n%10===0){return [{id:'golemlord',cnt:1},{id:'goblin',cnt:Math.floor(n*.4)},{id:'skeleton',cnt:Math.floor(n*.3)},...(n>=20?[{id:'cursed',cnt:1}]:[])];}   // мега-босс Голем-Владыка на каждой 10-й волне (только 1)
  if(n%5===0){const BOSSES=['troll','lich','titan','frostlord'];const bid=BOSSES[Math.floor(n/5-1)%4];return [{id:bid,cnt:1},{id:'goblin',cnt:n},{id:'skeleton',cnt:Math.floor(n/2)},...(n>=15?[{id:'golem',cnt:1}]:[]),...(n>=20?[{id:'cursed',cnt:1}]:[])];}
  if(n===1) return [{id:'goblin',cnt:5}];
  if(n<=3)  return [{id:'goblin',cnt:3+n*2},...(n>=3?[{id:'splitter',cnt:2}]:[])];
  if(n<=5)  return [{id:'goblin',cnt:2+n},{id:'skeleton',cnt:n-1},{id:'banshee',cnt:2},...(n>=4?[{id:'bomber',cnt:2},{id:'charger',cnt:1}]:[])];
  if(n<=8)  return [{id:'goblin',cnt:3+Math.floor(n*.4)},{id:'skeleton',cnt:Math.floor(n*.5)},{id:'darkmage',cnt:Math.floor(n*.25)},{id:'banshee',cnt:2},{id:'wraith',cnt:1},{id:'charger',cnt:2},{id:'spitter',cnt:1}];
  return [{id:'goblin',cnt:2+Math.floor(n*.3)},{id:'skeleton',cnt:Math.floor(n*.35)},{id:'darkmage',cnt:Math.floor(n*.2)},{id:'banshee',cnt:Math.floor(n*.15)},{id:'wraith',cnt:Math.floor(n*.12)},{id:'charger',cnt:Math.floor(n*.12)},{id:'splitter',cnt:Math.floor(n*.12)},{id:'bomber',cnt:Math.floor(n*.1)},{id:'spitter',cnt:Math.floor(n*.1)},{id:'healer',cnt:1},{id:'phantom',cnt:Math.floor(n*.08)},...(n>=12?[{id:'golem',cnt:Math.floor(n*.1)},{id:'summoner',cnt:1}]:[]),...(n>=9?[{id:ELITES[n%7],cnt:1}]:[]),...(n>=16?[{id:ELITES[(n+3)%7],cnt:1}]:[])];   // 1 элита с 9-й волны, 2-я с 16-й
}
const SP=[{x:55,y:50},{x:745,y:50},{x:55,y:550},{x:745,y:550},{x:400,y:38},{x:400,y:562},{x:38,y:300},{x:762,y:300}];
function spawnWave(n){const hpMult=1+0.08*(n-1);const dmgScale=Math.pow(1.032,n-1);const list=[];let si=0;buildWave(n).forEach(d=>{for(let i=0;i<d.cnt;i++){const s=SP[si%SP.length];list.push(new Enemy(d.id,s.x+(Math.random()-.5)*38,s.y+(Math.random()-.5)*38,hpMult,dmgScale));si++;}});return list;}

// ── F5: спавн в открытом мире — монстры роумят по карте, угроза растёт со временем ──
function pickOwEnemy(){
  const w=wave,pool=[['goblin',5],['skeleton',w>=2?4:2]];
  if(w>=2)pool.push(['splitter',3],['bomber',2]);
  if(w>=3)pool.push(['banshee',3],['darkmage',2],['charger',2]);
  if(w>=4)pool.push(['wraith',2],['golem',2],['spitter',2]);
  if(w>=5)pool.push(['cursed',1],['phantom',2],['healer',1]);     // F7: Проклятые с 5-й волны угрозы
  if(w>=6)pool.push(['troll',1],['summoner',1]);
  if(w>=5)pool.push(['corruptknight',1],['plaguebearer',1],['berserker',1],['mirror',1],['voidavatar',1],['crystalgolem',1],['reaper',1]);   // элиты-роумеры (редко)
  if(w>=8)pool.push(['lich',1],['titan',1],['frostlord',1]);   // боссы-роумеры на высокой угрозе (редко)
  const total=pool.reduce((s,p)=>s+p[1],0);let r=Math.random()*total;
  for(const[id,wt]of pool){r-=wt;if(r<=0)return id;}
  return 'goblin';
}
function spawnRoamer(){
  // item4: спавн в кольце 480–800px вокруг героя (сразу за краем экрана), не по всей карте
  const a=Math.random()*Math.PI*2, rd=480+Math.random()*320;
  const x=clamp(player.x+Math.cos(a)*rd,40,worldW-40), y=clamp(player.y+Math.sin(a)*rd,40,worldH-40);
  const hpMult=1+0.08*(wave-1),dmgScale=Math.pow(1.032,wave-1);
  const e=new Enemy(pickOwEnemy(),x,y,hpMult,dmgScale);
  e.roam=true;e.wx=x;e.wy=y;
  enemies.push(e);
}
function owSpawnTick(dt){
  owThreatT+=dt;
  if(owThreatT>=22){owThreatT=0;wave++;trackMax('max_threat_ow',wave);if(wave===15)track('ow_threat_peaks');addGold(10+wave*5);announce={show:true,timer:2.2,text:`⚠ Угроза возросла (ур. ${wave})`,sub:'Врагов больше, и они сильнее'};
    if(wave%7===0&&!enemies.some(e=>e.typeId==='golemlord')){const a=Math.random()*Math.PI*2,rd=560;const gx=clamp(player.x+Math.cos(a)*rd,40,worldW-40),gy=clamp(player.y+Math.sin(a)*rd,40,worldH-40);const gl=new Enemy('golemlord',gx,gy,1+0.08*(wave-1),Math.pow(1.032,wave-1));gl.roam=true;gl.wx=gx;gl.wy=gy;enemies.push(gl);announce={show:true,timer:2.6,text:'👑 ГОЛЕМ-ВЛАДЫКА ПРОБУДИЛСЯ',sub:'Адский главарь вышел на охоту'};if(typeof SFX!=='undefined')SFX.play('boss');}   // мега-босс на угрозе 7/14/21… (только 1 на карте)
  }
  const cap=Math.min(210,42+wave*12);   // item5: ×3 монстров в открытом мире
  owSpawnT-=dt;
  if(owSpawnT<=0&&enemies.length<cap){
    owSpawnT=Math.max(0.5,2.0-wave*0.1);
    const batch=(1+Math.floor(Math.random()*2)+Math.floor(wave/4))*3;
    for(let i=0;i<batch&&enemies.length<cap;i++)spawnRoamer();
  }
}

function drawTorch(x,y){

    ctx.fillStyle='#cfd3e0';ctx.font='11px Segoe UI';wrapText(g.desc,332,y+22,442,14);
  });
  ctx.restore();
  btn(20,560,120,34,'← Меню','#262244','#4455aa');
}

    ctx.shadowColor=cl.color;ctx.shadowBlur=22;ctx.fillStyle=cl.color;ctx.beginPath();ctx.arc(c.x+92,183,44,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.beginPath();ctx.arc(c.x+92,183,44,0,Math.PI*2);ctx.fill();

      ctx.fillStyle='#1a1830';ctx.fillRect(c.x+14,sy+3,120,7);ctx.fillStyle=cl.color;ctx.fillRect(c.x+14,sy+3,120*(s.v/s.m),7);
    });
    ctx.fillStyle='#ffcc88';ctx.font='bold 11px Segoe UI';ctx.textAlign='left';ctx.fillText(`Q: ${cl.qName} (Lv2)`,c.x+14,358);
    ctx.fillStyle='#88ccff';ctx.fillText(`E: ${cl.eName} (Lv5)`,c.x+14,373);
    ctx.fillStyle='#ff88cc';ctx.fillText(`R: ${cl.rName}`,c.x+14,388);
    ctx.fillStyle='#cc88ff';ctx.fillText(`X: ${cl.xName} (Lv10)`,c.x+14,403);
    cl.desc.forEach((line,i)=>{ctx.fillStyle='#9999bb';ctx.font='11px Segoe UI';ctx.fillText(line,c.x+14,420+i*15);});
    if(hov){ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 13px Segoe UI';ctx.textAlign='center';ctx.fillText('▶ Выбрать',c.x+92,443);}
    ctx.textAlign='left';
  });
  btn(20,552,130,38,'← Меню','#262244','#4455aa');
}

function drawLevelup(){
  gameDraw();
  ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,800,600);
  ctx.shadowColor='#ffcc00';ctx.shadowBlur=22;ctx.fillStyle='#ffcc00';ctx.font='bold 34px Segoe UI';ctx.textAlign='center';ctx.fillText(`Уровень ${player.level}!`,400,78);ctx.shadowBlur=0;
  ctx.fillStyle='#ccaaff';ctx.font='17px Segoe UI';ctx.fillText(levelupQueue>0?`ПКМ — выбрать улучшение  (ещё ${levelupQueue})`:'ПКМ — выбрать улучшение',400,112);ctx.textAlign='left';
  pendingUpgrades.forEach((u,i)=>{
    const cx=105+i*200,cy=148,cw=185,ch=288;

    ctx.strokeStyle=hov?'#ffcc44':'#4433aa';ctx.lineWidth=hov?2.5:1.5;if(hov){ctx.shadowColor='#ffcc44';ctx.shadowBlur=16;}ctx.strokeRect(cx,cy,cw,ch);ctx.shadowBlur=0;
    ctx.font='42px Segoe UI';ctx.textAlign='center';ctx.fillStyle='#ffcc44';ctx.fillText(u.icon,cx+cw/2,cy+66);
    ctx.fillStyle='#ffffff';ctx.font='bold 14px Segoe UI';ctx.fillText(u.name,cx+cw/2,cy+98);
    const tc=u.tier===1?'#888888':u.tier===2?'#ffaa44':'#ff44aa';ctx.fillStyle=tc;ctx.font='bold 9px Segoe UI';ctx.textAlign='right';ctx.fillText(`T${u.tier}`,cx+cw-8,cy+14);ctx.textAlign='center';
    ctx.fillStyle='#aaaacc';ctx.font='12px Segoe UI';wrapText(u.desc,cx+cw/2,cy+124,cw-22,17);
    if(hov){ctx.fillStyle='rgba(255,204,0,0.92)';ctx.font='bold 14px Segoe UI';ctx.fillText('▶ ПКМ',cx+cw/2,cy+ch-16);}
    ctx.textAlign='left';
  });
}

function drawGameOver(){
  ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,800,600);
  ctx.shadowColor='#ff2200';ctx.shadowBlur=35;ctx.fillStyle='#ff4422';ctx.font='bold 74px Segoe UI';ctx.textAlign='center';ctx.fillText('GAME OVER',400,230);ctx.shadowBlur=0;
  ctx.fillStyle='#ffcc44';ctx.font='bold 22px Segoe UI';ctx.fillText(`Волна: ${wave}  ·  Уровень: ${player.level}  ·  Очки: ${score}`,400,285);
  ctx.fillStyle='#aaaacc';ctx.font='17px Segoe UI';ctx.fillText('Мир Авало пал во тьму...',400,325);
  const t=Date.now()/1000;ctx.globalAlpha=Math.sin(t*3)*0.12+0.88;
  btn(280,380,230,55,'↺ Играть снова','#3d1f55','#8844bb');btn(522,380,168,55,'☰ Меню','#1f2545','#4455aa');
  ctx.globalAlpha=1;ctx.textAlign='left';ctx.shadowBlur=0;
}

// ── Game draw ──────────────────────────────────────────────────────────────
function gameDraw(){
  const _sa=!paused&&!showInv&&shake>0.3, _sx=_sa?(Math.random()-0.5)*shake:0, _sy=_sa?(Math.random()-0.5)*shake:0;
  ctx.save(); ctx.translate(_sx,_sy);   // Задача 2: screen shake
  ctx.save();
  if(gameMode==='openworld')ctx.translate(-camX,-camY);   // F5: камера
  drawBg();frostZones.forEach(z=>{ctx.globalAlpha=clamp(z.life*0.28,0,0.45);ctx.fillStyle='#66bbe8';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#aaddff';ctx.globalAlpha=clamp(z.life*0.4,0,0.7);ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;});groundFX.forEach(z=>{const a=clamp(z.life/z.max,0,1);if(z.kind==='poison'){ctx.globalAlpha=a*0.5;ctx.fillStyle='#5aa83a';}else{ctx.globalAlpha=a*0.55;ctx.fillStyle='#3a1a5a';}ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=a*0.7;ctx.strokeStyle=z.kind==='poison'?'#aaff66':'#bb66ff';ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;});rings.forEach(r=>r.draw());orbs.forEach(o=>o.draw());drops.forEach(d=>d.draw());
  bladeWaves.forEach(bw=>bw.draw());projs.forEach(p=>p.draw());parts.forEach(p=>p.draw());
  enemies.forEach(e=>e.draw());player.draw();floats.forEach(f=>f.draw());
  ctx.restore();
  drawHUD();
  if(typeof TOUCH!=='undefined'&&TOUCH.active)drawTouchUI();
  if(gameMode==='dungeon'&&dungeonFade>0){ctx.fillStyle=`rgba(0,0,0,${dungeonFade})`;ctx.fillRect(0,0,800,600);}
  if(paused){ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(0,0,800,600);ctx.fillStyle='#fff';ctx.font='bold 52px Segoe UI';ctx.textAlign='center';ctx.fillText('ПАУЗА',400,285);ctx.fillStyle='#9999cc';ctx.font='18px Segoe UI';ctx.fillText('P / Escape — продолжить',400,335);ctx.textAlign='left';}
  if(showInv)drawInventory();
  ctx.restore();   // конец screen shake
}

// ── Game update ────────────────────────────────────────────────────────────
function gameUpdate(dt){
  if(paused||showInv) return;   // инвентарь (I) ставит игру на паузу
  if(shake>0)shake=Math.max(0,shake-dt*45);
  if(hitStop>0){hitStop-=dt;return;}   // Задача 2: hit-stop (микропауза удара)
  torchT+=dt;
  track('playtime',dt); if(gameMode==='openworld')track('playtime_ow',dt); if(player)track('playtime_'+player.classId,dt); if(runStats)runStats.time+=dt;
  saveTimer-=dt; if(saveTimer<=0){saveTimer=5;saveSave();}
  if(gameMode==='openworld'){camX=clamp(player.x-400,0,worldW-800);camY=clamp(player.y-300,0,worldH-600);}  // F5: камера за героем
  player.update(dt);
  if(player.stunT<=0){   // оглушение Голем-Владыки блокирует атаки и способности
    const _t=(typeof TOUCH!=='undefined'&&TOUCH.active);
    if(mouse.clicked||mouse.down||_t) player.attack(projs,parts);   // мобайл — автоогонь
    if(keys['q']||(_t&&TOUCH.btn.q)) player.qAbility(projs,parts);
    if(keys['e']||(_t&&TOUCH.btn.e)) player.eAbility(projs,parts);
    if(keys['r']||(_t&&TOUCH.btn.r)) player.rAbility(projs,parts);
    if(keys['x']||(_t&&TOUCH.btn.x)) player.xAbility(projs,parts);
  }
  mouse.clicked=false;
  if(frostZones.length){ frostZones.forEach(z=>z.life-=dt); frostZones=frostZones.filter(z=>z.life>0); for(const z of frostZones){ if(dist(z,player)<z.r){ player.chillT=0.3; break; } } }
  if(groundFX.length){ groundFX.forEach(z=>z.life-=dt); groundFX=groundFX.filter(z=>z.life>0); let inP=false,inV=false; for(const z of groundFX){ if(dist(z,player)<z.r){ if(z.kind==='poison')inP=true; else if(z.kind==='void')inV=true; } } if(inV)player.voidT=0.25; if(inP){ player._psnT=(player._psnT||0)-dt; if(player._psnT<=0){ player._psnT=0.5; player.takeDamage(10); } } }   // ядовитые лужи (DoT) + зона тьмы
  enemies.forEach(e=>e.update(dt,player,projs,parts));
  projs.forEach(p=>{
    p.update(dt, parts); if(p.dead) return;
    if(!p.isEnemy && !p.stuck){
      enemies.forEach(e=>{
        if(e.dead||p.hit.has(e)) return;
        if(dist(p,e)<e.r+p.size){
          const d=p.dmg; const _pc=(p.isCrit===true)?true:((p.src==='q'||p.src==='r'||p.src==='x'||p.src==='passive')?'roll':false); e.hit(d,parts,p.src,_pc); score+=Math.floor(d);
          if(player.lifesteal>0) player.heal(Math.floor(d*player.lifesteal));
          if(p.isCrit){rings.push(new Ring(p.x,p.y,'#ffffff',38));addShake(1.2);if(e.dead){track('crit_kills');hitStopFor(0.05);}for(let ci=0;ci<10;ci++){const ca=Math.random()*Math.PI*2;parts.push(new Particle(p.x,p.y,Math.cos(ca)*220,Math.sin(ca)*220,'#ffffff',0.45,4));}}
          if(p.explode){explodeAt(p.x,p.y,d*0.5,parts,p.explodeR,p.slowDur,p.src);if(p.doubleExplode)explodeAt(p.x,p.y,d,parts,p.explodeR,p.slowDur,p.src);}
          if(p.pierce>0){p.pierce--;p.hit.add(e);}else p.dead=true;
        }
      });
    } else {
      if(dist(p,player)<player.r+p.size){player.takeDamage(p.dmg);p.dead=true;for(let i=0;i<8;i++)parts.push(new Particle(player.x,player.y,(Math.random()-.5)*200,(Math.random()-.5)*200,'#ff4444',0.5,3));}
    }
  });
  bladeWaves.forEach(bw=>{bw.update(dt);if(bw.dead)return;enemies.forEach(e=>{if(e.dead||bw.hit.has(e))return;if(dist(bw,e)<bw.hitR+e.r){const d=bw.dmg;e.hit(d,parts,bw.src,'roll');score+=Math.floor(d);if(player.lifesteal>0)player.heal(Math.floor(d*player.lifesteal));bw.hit.add(e);}});});
  enemies.forEach(e=>{if(e.dead&&e.xp>0){floats.push(new FloatText(e.x,e.y-e.r-6,'+'+e.xp+' xp','#ffe14d',e.xp>=80?16:12));player.gainXp(e.xp);e.xp=0;if(Math.random()<0.26)orbs.push(new HealthOrb(e.x,e.y));}});
  orbs.forEach(o=>o.update(dt,player));drops.forEach(d=>d.update(dt,player));parts.forEach(p=>p.update(dt));rings.forEach(r=>r.update(dt));floats.forEach(f=>f.update(dt));
  enemies=enemies.filter(e=>!e.dead);projs=projs.filter(p=>!p.dead);parts=parts.filter(p=>p.life>0);orbs=orbs.filter(o=>!o.dead);drops=drops.filter(d=>!d.dead);rings=rings.filter(r=>r.life>0);bladeWaves=bladeWaves.filter(bw=>!bw.dead);floats=floats.filter(f=>!f.dead);
  if(announce.show){announce.timer-=dt;if(announce.timer<=0)announce.show=false;}
  if(achToasts.length){for(const tt of achToasts)tt.t-=dt;achToasts=achToasts.filter(tt=>tt.t>0);}
  if(gameMode==='arcade'){
    if(!wavePending&&enemies.length===0){wavePending=true;waveDelay=3;if(wave%5===0)announce={show:true,timer:2.5,text:`Волна ${wave} завершена!`,sub:`+${wave*50} очков`};score+=wave*50;addGold((8+wave*4)*(wave%5===0?3:1));
      if(runStats){ if(!runStats.dmgThisWave){runStats.noHitWaves=(runStats.noHitWaves||0)+1;trackMax('nohit_wave_streak',runStats.noHitWaves);} else runStats.noHitWaves=0; runStats.dmgThisWave=false; }
      if(wave%5===0)track('boss_waves_cleared');
    }
    if(wavePending){waveDelay-=dt;if(waveDelay<=0)nextWave();}
  } else if(gameMode==='openworld'){
    owSpawnTick(dt);
  } else if(dungeonRooms.length){
    const rm=dungeonRooms[currentRoomId];
    if(!rm.cleared&&enemies.length===0){
      rm.cleared=true;
      if(rm.specs.length>0){score+=100*(rm.hpMult|0);addGold(15+Math.round(20*rm.hpMult));track('dungeon_rooms_cleared');for(let i=0;i<2;i++)orbs.push(new HealthOrb(360+i*80,300));}
      if(rm.type==='boss'){track('dungeon_victories');endRun();state='victory';return;}
      if(rm.type!=='start')announce={show:true,timer:2,text:'Комната зачищена!',sub:'Двери открыты'};
    }
    if(rm.cleared&&dungeonFadeDir===0){
      rm.doors.forEach(door=>{if(dist(player,getDoorCenter(door.dir))<36)enterDungeonRoom(door.to,door.dir);});
    }
    if(dungeonFadeDir!==0){
      dungeonFade=clamp(dungeonFade+dungeonFadeDir*2.5*dt,0,1);
      if(dungeonFade>=1&&dungeonFadeDir===1){
        currentRoomId=dungeonNextRoom;const nr=dungeonRooms[currentRoomId];
        enemies=[];projs=[];bladeWaves=[];
        if(!nr.visited){nr.visited=true;spawnRoomEnemies(nr);}
        const ep={east:{x:60,y:300},west:{x:740,y:300},north:{x:400,y:550},south:{x:400,y:50}};
        const opp={east:'west',west:'east',north:'south',south:'north'};
        const pos=ep[opp[dungeonFromDir]];player.x=pos.x;player.y=pos.y;
        if(!nr.cleared&&nr.specs.length>0)announce={show:true,timer:2,text:'Новая комната',sub:'Враги атакуют!'};   // #1: убран всплывающий анонс BOSS ROOM
        dungeonFadeDir=-1;
      }
      if(dungeonFade<=0&&dungeonFadeDir===-1)dungeonFadeDir=0;
    }
  }
  if(player.dead){endRun();state='gameover';}
}

// ── Loop ───────────────────────────────────────────────────────────────────
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,0.05);lastT=ts;
  ctx.clearRect(0,0,800,600);
  if     (state==='menu')     drawMenu();
  else if(state==='achievements') drawAchievements();
  else if(state==='forge')    drawForge();
  else if(state==='bestiary') drawBestiary();
  else if(state==='select')   drawSelect();
  else if(state==='play')     {gameUpdate(dt);gameDraw();}
  else if(state==='levelup')  drawLevelup();
  else if(state==='gameover') {gameDraw();drawGameOver();}
  else if(state==='victory')  {gameDraw();drawVictory();}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
