<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>AVALO — Action RPG</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #050508; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100vw; height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; user-select: none; }
/* #5: канвас масштабируется на весь экран сайта с сохранением 4:3 (внутреннее разрешение 800×600) */
canvas { display: block; border: 2px solid #2a2535; box-shadow: 0 0 40px rgba(100,50,200,0.3); width: min(85vw, 113vh); height: auto; aspect-ratio: 4 / 3; }
#ctrl { color: #666; font-size: clamp(9px, 1.4vh, 13px); margin-top: 8px; letter-spacing: 0.4px; text-align: center; }
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<div id="ctrl">WASD — движение &nbsp;|&nbsp; ЛКМ — атака &nbsp;|&nbsp; Q / E / R — умения &nbsp;|&nbsp; X — X-способность (Lv10) &nbsp;|&nbsp; P — пауза &nbsp;|&nbsp; M — звук &nbsp;|&nbsp; 📱 тач: левый стик — движение, правый — прицел/огонь, кнопки умений справа</div>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── Input ──────────────────────────────────────────────────────────────────
const keys = {};
const mouse = { x: 400, y: 300, down: false, clicked: false };
canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = (e.clientX - r.left)*(canvas.width/r.width); mouse.y = (e.clientY - r.top)*(canvas.height/r.height); });
canvas.addEventListener('mousedown', () => { if(typeof SFX!=='undefined')SFX.ensure(); if(typeof MUSIC!=='undefined')MUSIC.ensure(); mouse.down = true; mouse.clicked = true; });
canvas.addEventListener('mouseup', () => { mouse.down = false; });
document.addEventListener('keydown', e => { if(typeof SFX!=='undefined')SFX.ensure(); if(typeof MUSIC!=='undefined')MUSIC.ensure(); keys[e.key.toLowerCase()] = true; if ('pP'.includes(e.key) || e.key === 'Escape') togglePause(); if((e.key==='i'||e.key==='I'||e.key==='ш'||e.key==='Ш')&&state==='play')showInv=!showInv;
  if(e.key==='m'||e.key==='M'||e.key==='ь'||e.key==='Ь'){ if(typeof SFX!=='undefined')SFX.toggle(); }
  if(DEV&&state==='play'){ if(e.key==='-')devXp=Math.max(2,devXp-2); else if(e.key==='=')devXp+=2; else if(e.key==='[')devDrop=Math.max(1,devDrop-1); else if(e.key===']')devDrop+=1; XP_RATE=devXp; }
  if(gameMode==='testroom'&&state==='play'){   // 🧪 горячие клавиши тренировки
    if(e.key==='k'||e.key==='K'||e.key==='л'||e.key==='Л'){ state='select'; }   // сменить класс/архетип
    else if(e.key==='l'||e.key==='L'||e.key==='д'||e.key==='Д'){ player.level++; player.maxHp+=5; player.hp=Math.min(player.maxHp,player.hp+5); player.xpNext=xpForLevel(player.level); triggerLevelup(); }   // +1 уровень → карточка апгрейда
    else if(e.key==='u'||e.key==='U'||e.key==='г'||e.key==='Г'){   // взять ВСЕ апгрейды разом
      let n=0;
      if(player.arch){ ARCH_UPGRADE_POOL.forEach(u=>{u.apply(player);n++;}); }
      else { let av; while((av=SKILL_TREES[player.classId].filter(u=>!player.takenSkills.has(u.id)&&(!u.req||player.takenSkills.has(u.req)))).length){ av.forEach(u=>{u.apply(player);player.takenSkills.add(u.id);n++;}); } }
      achToasts.push({txt:'🧪 Применено апгрейдов: '+n,perk:player.arch?'полный сет пула (×1)':'всё дерево класса',t:3,col:'#88dd88'}); if(achToasts.length>5)achToasts.shift();
    }
    else if(e.key==='Tab'){ trInfo=!trInfo; }   // инфо-панель умений
  }
  e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ── Звук (Web Audio, синтез, негромкий; без ассетов) ─────────────────────────
const SFX = (function(){
  let ctx=null, master=null, comp=null, enabled=true, started=false; const last={};
  function init(){ if(started)return; started=true; try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; ctx=new AC(); comp=ctx.createDynamicsCompressor(); master=ctx.createGain(); master.gain.value=0.4; comp.connect(master); master.connect(ctx.destination); enabled=!(typeof meta!=='undefined'&&meta&&meta.muted); }catch(e){ ctx=null; } }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  function gate(k,ms){ const n=(typeof performance!=='undefined')?performance.now():Date.now(); if(last[k]&&n-last[k]<ms)return false; last[k]=n; return true; }
  function env(node,t,vol,dur){ const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); node.connect(g); g.connect(comp); }
  function tone(type,f1,f2,vol,dur,lp){ if(!ctx||!enabled)return; const t=ctx.currentTime; const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f1,t); if(f2!=null)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur); let n=o; if(lp){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(f);n=f;} env(n,t,vol,dur); o.start(t); o.stop(t+dur+0.03); }
  function noise(vol,dur,lp){ if(!ctx||!enabled)return; const t=ctx.currentTime,len=Math.max(1,Math.floor(ctx.sampleRate*dur)); const b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||1000; s.connect(f); env(f,t,vol,dur); s.start(t); s.stop(t+dur+0.02); }
  function chord(fs,vol,dur){ fs.forEach((f,i)=>setTimeout(()=>tone('sine',f,f,vol,dur,4000),i*70)); }
  const map={
    swing:()=>{ if(gate('swing',55))noise(0.04,0.09,1500); },
    shot:()=>{ if(gate('shot',40))tone('sine',680,300,0.04,0.08,3000); },
    hit:()=>{ if(gate('hit',45))noise(0.03,0.05,1000); },
    crit:()=>{ if(gate('crit',55))tone('triangle',880,1300,0.055,0.13,5000); },
    enemyDie:()=>{ if(gate('die',55))tone('triangle',240,90,0.05,0.13,2000); },
    hurt:()=>{ if(gate('hurt',110))tone('sine',200,90,0.09,0.18,1200); },
    q:()=>tone('triangle',520,760,0.055,0.16,3500),
    e:()=>tone('sine',440,660,0.055,0.18,3000),
    r:()=>tone('sawtooth',180,520,0.04,0.22,1400),
    x:()=>{ tone('sine',150,90,0.07,0.34,800); noise(0.045,0.24,520); },
    levelup:()=>chord([523,659,784,1047],0.055,0.3),
    pickup:()=>tone('triangle',880,1320,0.045,0.1,4000),
    gold:()=>{ if(gate('gold',60))tone('square',1200,1600,0.028,0.07,5000); },
    wave:()=>chord([392,494,587],0.05,0.25),
    boss:()=>{ tone('sawtooth',110,70,0.07,0.6,600); tone('sine',55,42,0.06,0.7,300); },
    explosion:()=>{ if(gate('expl',55)){ noise(0.065,0.22,700); tone('sine',120,50,0.055,0.25,400); } },
    ui:()=>{ if(gate('ui',40))tone('sine',520,520,0.04,0.05,3000); }
  };
  return { init, resume, ensure(){ init(); resume(); }, play(n){ if(!enabled||!ctx)return; const f=map[n]; if(f)f(); },
    getCtx(){return ctx;}, getComp(){return comp;}, getMaster(){return master;},   // музыка переиспользует тот же граф
    toggle(){ enabled=!enabled; if(typeof meta!=='undefined'&&meta){ meta.muted=!enabled; if(typeof saveSave==='function')saveSave(); } if(enabled)resume(); if(typeof MUSIC!=='undefined')MUSIC.setEnabled(enabled); return enabled; }, isOn(){ return enabled; } };
})();

// ── Музыка (адаптивная, процедурная Web Audio; переиспользует граф SFX; без ассетов) ──
const MUSIC=(function(){
  let ctx=null,comp=null,master=null,mg=null,bedLP=null,delay=null,dlp=null,dfb=null,cave=null,caveG=null;
  let started=false,muted=false,running=false,schedTimer=null;
  const AEO=[0,2,3,5,7,8,10], PHR=[0,1,3,5,7,8,10]; let SCALE=AEO; const ROOT=73.42;   // D2
  // прогрессии: [rootDeg, thirdDeg, fifthDeg] по тактам
  const PROG_AEO=[[0,2,4],[5,0,2],[2,4,6],[6,1,3]];   // Dm – VI – III – VII
  const PROG_PHR=[[0,2,4],[1,3,5],[0,2,4],[4,6,1]];   // Dm – bII – Dm – v (dread)
  let prog=PROG_AEO, victoryBar3=false;
  let state='menu', bpm=64, bpmTarget=64, targetMix=0.12;
  let nextT=0, step=0, beat=0, bar=0;
  let lowHp=false, hbNext=0, hbInt=1.0, duck=1;
  const drone=[], pad=[], choir=[];
  // целевые громкости слоёв по состояниям (ch = ангельский хор)
  const MIX={ menu:{dr:.05,pad:.04,arp:0,lead:.08,kick:0,hat:0,ch:.045,lp:600},
              calm:{dr:.06,pad:.07,arp:.04,lead:.05,kick:0,hat:0,ch:.025,lp:1100},
              combat:{dr:.09,pad:.085,arp:.06,lead:0,kick:.07,hat:.04,ch:.05,lp:4500},
              boss:{dr:.10,pad:.085,arp:.05,lead:.06,kick:.11,hat:.05,ch:.10,lp:6500},
              lowhp:{dr:.045,pad:.03,arp:.03,lead:0,kick:0,hat:0,ch:.01,lp:700},
              victory:{dr:.07,pad:.08,arp:.05,lead:.09,kick:0,hat:0,ch:.12,lp:2000},
              gameover:{dr:.06,pad:.06,arp:0,lead:0,kick:0,hat:0,ch:.03,lp:200} };
  let curMix=MIX.menu;
  function deg(d,oct){ const i=((d%7)+7)%7, s=SCALE[i]+12*(oct+Math.floor(d/7)); return ROOT*Math.pow(2,s/12); }
  function init(){ if(started)return; started=true;
    try{ ctx=SFX.getCtx?SFX.getCtx():null; if(!ctx)return; comp=SFX.getComp(); master=SFX.getMaster();
      mg=ctx.createGain(); mg.gain.value=0;
      bedLP=ctx.createBiquadFilter(); bedLP.type='lowpass'; bedLP.frequency.value=1100;
      delay=ctx.createDelay(0.6); delay.delayTime.value=0.34; dfb=ctx.createGain(); dfb.gain.value=0.34;
      dlp=ctx.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=2200;
      delay.connect(dlp); dlp.connect(dfb); dfb.connect(delay); dlp.connect(bedLP);
      bedLP.connect(mg); mg.connect(comp);
      // дрон: триангл root + детюн + суб-синус октавой ниже
      for(let i=0;i<2;i++){ const o=ctx.createOscillator(); o.type=i===0?'triangle':'sawtooth'; o.detune.value=i===0?-6:6; const g=ctx.createGain(); g.gain.value=0; o.connect(g); g.connect(bedLP); o.start(); drone.push({o,g}); }
      const sub=ctx.createOscillator(); sub.type='sine'; const sg=ctx.createGain(); sg.gain.value=0; sub.connect(sg); sg.connect(bedLP); sub.start(); drone.push({o:sub,g:sg,sub:true});
      // пэд: 3 голоса (триада октавой выше)
      for(let i=0;i<3;i++){ const o=ctx.createOscillator(); o.type='triangle'; o.detune.value=(i-1)*4; const g=ctx.createGain(); g.gain.value=0; o.connect(g); g.connect(bedLP); o.start(); pad.push({o,g}); }
      // ✦ Ангельский хор: пила → формантные bandpass («ааа») + вибрато + тяжёлый reverb-send (собор)
      for(let i=0;i<3;i++){ const o=ctx.createOscillator(); o.type='sawtooth'; o.detune.value=(i-1)*8;
        const bp1=ctx.createBiquadFilter(); bp1.type='bandpass'; bp1.frequency.value=700; bp1.Q.value=7;
        const bp2=ctx.createBiquadFilter(); bp2.type='bandpass'; bp2.frequency.value=1150; bp2.Q.value=9;
        const g=ctx.createGain(); g.gain.value=0; o.connect(bp1); o.connect(bp2); bp1.connect(g); bp2.connect(g);
        g.connect(bedLP); const wg=ctx.createGain(); wg.gain.value=0.85; g.connect(wg); wg.connect(delay);
        const vib=ctx.createOscillator(); vib.type='sine'; vib.frequency.value=4.6+i*0.4; const vg=ctx.createGain(); vg.gain.value=5; vib.connect(vg); vg.connect(o.detune); vib.start();
        o.start(); choir.push({o,g}); }
      // shimmer — высокий «небесный» голос (синус двумя октавами выше)
      { const o=ctx.createOscillator(); o.type='sine'; const g=ctx.createGain(); g.gain.value=0; o.connect(g); g.connect(bedLP); const wg=ctx.createGain(); wg.gain.value=0.9; g.connect(wg); wg.connect(delay); o.start(); choir.push({o,g,shimmer:true}); }
      // пещерный бэд (тихий коричневатый шум)
      const len=ctx.sampleRate*2, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0); let last=0;
      for(let i=0;i<len;i++){ last=(last+(Math.random()*2-1)*0.02)/1.02; d[i]=last*3; }
      cave=ctx.createBufferSource(); cave.buffer=b; cave.loop=true; const cf=ctx.createBiquadFilter(); cf.type='lowpass'; cf.frequency.value=300; caveG=ctx.createGain(); caveG.gain.value=0; cave.connect(cf); cf.connect(caveG); caveG.connect(mg); cave.start();
      retune(0);
    }catch(e){ ctx=null; }
  }
  function spb(){ return 60/bpm; }
  function retune(b){ if(!ctx)return; const ch=prog[b%4], t=ctx.currentTime;
    // дрон на root (oct 0) + суб октавой ниже
    drone.forEach((v,i)=>{ const f=v.sub?deg(ch[0],-1):deg(ch[0],0); v.o.frequency.setTargetAtTime(f,t,0.25); });
    // пэд: триада октавой выше, плавный переход
    pad.forEach((v,i)=>{ const f=deg(ch[i%3],1); v.o.frequency.setTargetAtTime(f,t,0.3); });
    // хор: триада 2 октавы выше (ангельский регистр), shimmer — ещё октавой выше
    choir.forEach((v,i)=>{ const f=v.shimmer?deg(ch[0],3):deg(ch[i%3],2); v.o.frequency.setTargetAtTime(f,t,0.4); });
  }
  function applyMix(m){ if(!ctx)return; const t=ctx.currentTime, k=lowHp?MIX.lowhp:m;
    drone.forEach((v,i)=>v.g.gain.setTargetAtTime((v.sub?k.dr*0.8:k.dr)*duck,t,1.2));
    pad.forEach(v=>v.g.gain.setTargetAtTime(k.pad*duck,t,1.2));
    choir.forEach(v=>v.g.gain.setTargetAtTime((v.shimmer?(k.ch||0)*0.6:(k.ch||0))*duck,t,1.6));   // хор вплывает медленно (эпично)
    bedLP.frequency.setTargetAtTime(k.lp,t,0.8);
    if(caveG)caveG.gain.setTargetAtTime(running&&state!=='menu'?0.012:0.004,t,1.5);
  }
  // транзиентные голоса
  function vGain(node,t,vol,dur){ const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); node.connect(g); return g; }
  function kick(t,vol){ if(!ctx)return; const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(45,t+0.12); const g=vGain(o,t,vol,0.18); g.connect(mg); o.start(t); o.stop(t+0.22); }
  function hat(t,vol){ if(!ctx)return; const len=ctx.sampleRate*0.04, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000; s.connect(hp); const g=vGain(hp,t,vol,0.03); g.connect(mg); s.start(t); s.stop(t+0.06); }
  function arp(hz,t,vol){ if(!ctx)return; const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=hz; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1300; o.connect(lp); const g=vGain(lp,t,vol,0.32); g.connect(bedLP); const wg=ctx.createGain(); wg.gain.value=0.5; g.connect(wg); wg.connect(delay); o.start(t); o.stop(t+0.4); }
  function lead(hz,t,dur,vol,saw){ if(!ctx)return; const o=ctx.createOscillator(); o.type=saw?'sawtooth':'triangle'; o.frequency.value=hz; const lv=ctx.createOscillator(); lv.type='sine'; lv.frequency.value=5; const lg=ctx.createGain(); lg.gain.value=hz*0.003; lv.connect(lg); lg.connect(o.frequency); lv.start(t); lv.stop(t+dur+0.1); const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=saw?2200:3200; o.connect(lp); const g=vGain(lp,t,vol,dur); g.connect(bedLP); const wg=ctx.createGain(); wg.gain.value=0.6; g.connect(wg); wg.connect(delay); o.start(t); o.stop(t+dur+0.1); }
  function heartbeat(t){ if(!ctx)return; [[70,0],[55,0.08]].forEach(([f,off])=>{ const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180; o.connect(lp); const g=vGain(lp,t+off,0.05,0.16); g.connect(mg); o.start(t+off); o.stop(t+off+0.2); }); }
  const MOTIF=[{d:4,o:1,b:1},{d:0,o:1,b:1},{d:2,o:1,b:0.5},{d:1,o:1,b:0.5},{d:0,o:1,b:1},{d:6,o:0,b:1},{d:0,o:1,b:2}];
  function playMotif(t0,frag,aug){ if(!ctx)return; let t=t0; const notes=frag?MOTIF.slice(0,3):MOTIF; const mul=aug?2:1;
    for(const n of notes){ const dur=n.b*spb()*mul; lead(deg(n.d,n.o+(aug?-1:0)),t,Math.min(dur*0.95,2.2),aug?0.07:0.08,aug); t+=dur; } }
  function scheduleStep(s,t){ const m=lowHp?MIX.lowhp:curMix, ch=prog[bar%4];
    // ударные
    if(!lowHp){
      if(m.kick>0){ if(state==='combat'&&(s===0||s===8))kick(t,m.kick); else if(state==='boss'&&(s===0||s===4||s===8||s===12||s===14))kick(t,m.kick); }
      if(m.hat>0){ if(state==='combat'&&s%2===0)hat(t,m.hat); else if(state==='boss'&&Math.random()>0.2)hat(t,m.hat*(s%4===2?1.3:1)); }
    }
    // арпеджио
    if(m.arp>0){ let play=false; if(state==='calm'&&(s===0||s===8))play=true; else if(state==='combat'&&s%4===0)play=true; else if(state==='boss'&&(s===0||s===6||s===12))play=true; else if(state==='victory'&&s%4===0)play=true;
      if(play){ const idx=(s/2)|0; const dgs=lowHp?[0,1]:ch; const dd=dgs[idx%dgs.length]; arp(deg(dd,lowHp?1:2),t,m.arp); } }
  }
  function onBar(b){ retune(b);
    if(b===0){ if(state==='menu'||state==='victory')playMotif(nextT,false,false);
      else if(state==='calm'&&Math.random()<0.5)playMotif(nextT,true,false);
      else if(state==='boss'&&Math.random()<0.4)playMotif(nextT,false,true); } }
  function scheduler(){ if(!ctx||muted||!running)return; const SA=0.12; bpm+=(bpmTarget-bpm)*0.05;
    while(nextT<ctx.currentTime+SA){ scheduleStep(step,nextT); nextT+=spb()/4; step=(step+1)%16; if(step%4===0)beat=(beat+1)%4; if(step===0){bar=(bar+1)%4; onBar(bar);} }
    if(lowHp&&ctx.currentTime>=hbNext){ heartbeat(ctx.currentTime+0.02); hbNext=ctx.currentTime+hbInt; }
  }
  function setMusicState(s){ if(!ctx||s===state)return; const wasBoss=(state==='boss');
    state=s; curMix=MIX[s]||MIX.menu;
    bpmTarget = s==='menu'?64 : s==='calm'?72 : s==='combat'?108 : s==='boss'?138 : s==='victory'?80 : s==='gameover'?50 : 96;
    if(s==='boss'){ SCALE=PHR; prog=PROG_PHR; if(!wasBoss)riser(true); }
    else if(s==='victory'){ SCALE=AEO; prog=[[0,2,4],[5,0,2],[2,4,6],[0,2,4]]; }   // bar4 ≈ D-мажор-подъём через root-октаву
    else { SCALE=AEO; prog=PROG_AEO; }
    applyMix(curMix);
  }
  function riser(boss){ if(!ctx||muted)return; const t=ctx.currentTime;
    const len=ctx.sampleRate*2, b=ctx.createBuffer(1,len,ctx.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=b; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(200,t); lp.frequency.exponentialRampToValueAtTime(1200,t+2); const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.05,t+1.6); g.gain.exponentialRampToValueAtTime(0.0001,t+2.2); s.connect(lp); lp.connect(g); g.connect(mg); s.start(t); s.stop(t+2.3);
    if(boss){ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(deg(0,0),t); o.frequency.exponentialRampToValueAtTime(deg(4,-1),t+1.2); const og=vGain(o,t,0.07,1.4); og.connect(bedLP); const wg=ctx.createGain(); wg.gain.value=0.6; og.connect(wg); wg.connect(delay); o.start(t); o.stop(t+1.5); }
  }
  function setEnabled(on){ muted=!on; if(!ctx)return; mg.gain.setTargetAtTime(on?targetMix:0.0001, ctx.currentTime, 0.3); if(on&&ctx.state==='suspended')ctx.resume(); }
  return {
    ensure(){ init(); if(!ctx)return; running=true; if(ctx.state==='suspended')ctx.resume(); if(!schedTimer)schedTimer=setInterval(scheduler,25); muted=!(SFX.isOn&&SFX.isOn()); if(!muted){ nextT=ctx.currentTime+0.1; mg.gain.setTargetAtTime(targetMix,ctx.currentTime,1.0); } },
    setEnabled, setMusicState,
    tick(enemies,player,st){ if(!ctx||muted)return;
      if(st!=='play'){ setMusicState('menu'); return; }
      let bossAlive=false, nd=99999;
      for(const e of enemies){ if(e.dead)continue; if(e.t&&(e.t.boss||e.t.elite)||e.typeId==='cursed')bossAlive=true; if(player){const dd=dist(e,player); if(dd<nd)nd=dd;} }
      const cnt=enemies.filter(e=>!e.dead).length;
      const prox=Math.max(0,Math.min(1,(250-nd)/250));
      const ci=Math.max(0,Math.min(1, cnt/8*0.6 + prox*0.4));
      const frac=player&&player.maxHp?player.hp/player.maxHp:1;
      if(!lowHp&&frac<=0.25)lowHp=true; else if(lowHp&&frac>0.30)lowHp=false;
      const ns = bossAlive?'boss' : ci>0.30?'combat' : 'calm';
      if(ns!==state) setMusicState(ns); else applyMix(curMix);
      if(lowHp){ hbInt=0.55+0.45*Math.max(0,Math.min(1,frac/0.30)); }
    },
    onBoss(){ if(!ctx)return; setMusicState('boss'); },
    onCalm(){ if(!ctx)return; if(state!=='boss')setMusicState('calm'); },
    onGameOver(){ if(!ctx)return; setMusicState('gameover'); const t=ctx.currentTime; drone.forEach(v=>v.o.frequency.exponentialRampToValueAtTime(Math.max(20,v.o.frequency.value*0.94),t+2.5)); },
    onVictory(){ if(!ctx)return; setMusicState('victory'); },
    onThreatRise(){ if(!ctx||muted)return; const t=ctx.currentTime; [deg(0,0),deg(2,0)].forEach((f,i)=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=f; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; o.connect(lp); const g=vGain(lp,t+i*0.5,0.04,0.5); g.connect(bedLP); o.start(t+i*0.5); o.stop(t+i*0.5+0.6); }); },
    duckForLevelup(){ duck=0.5; applyMix(curMix); setTimeout(()=>{duck=1; applyMix(curMix);},1500); },
    isReady(){ return !!ctx; }
  };
})();

// ── Мобильное управление (тач): джойстик движения + прицел/огонь + кнопки умений ──
const TOUCH = { enabled:(('ontouchstart' in window)||(navigator.maxTouchPoints>0)), active:false, idMap:{},
  move:{active:false,ox:0,oy:0,nx:0,ny:0,mag:0}, aim:{active:false,ox:0,oy:0,nx:0,ny:0,mag:0,fire:false}, btn:{q:false,e:false,r:false,x:false} };
const TOUCH_BTN={ r:{x:700,y:462,rad:27,col:'#cc3399'}, q:{x:756,y:432,rad:27,col:'#3399ff'}, e:{x:756,y:492,rad:27,col:'#33cccc'}, x:{x:700,y:522,rad:31,col:'#aa44ff'} };
function _txy(t){ const r=canvas.getBoundingClientRect(); return { x:(t.clientX-r.left)*(canvas.width/r.width), y:(t.clientY-r.top)*(canvas.height/r.height) }; }
function _abilAt(x,y){ for(const k in TOUCH_BTN){ const b=TOUCH_BTN[k]; if(Math.hypot(x-b.x,y-b.y)<=b.rad+8) return k; } return null; }
function _joy(j,p){ const R=58; let vx=p.x-j.ox, vy=p.y-j.oy, m=Math.hypot(vx,vy); if(m>R){ vx=vx/m*R; vy=vy/m*R; m=R; } j.nx=vx/R; j.ny=vy/R; j.mag=m/R; }
canvas.addEventListener('touchstart', e=>{ if(typeof SFX!=='undefined')SFX.ensure(); if(typeof MUSIC!=='undefined')MUSIC.ensure(); TOUCH.active=true;
  if(state!=='play'){ const p=_txy(e.changedTouches[0]); mouse.x=p.x; mouse.y=p.y; return; }   // в меню — пусть сработает синтетический click
  for(const t of e.changedTouches){ const p=_txy(t); const ab=_abilAt(p.x,p.y);
    if(ab){ TOUCH.btn[ab]=true; TOUCH.idMap[t.identifier]=ab; }
    else if(p.x<400){ TOUCH.move.active=true; TOUCH.move.ox=p.x; TOUCH.move.oy=p.y; _joy(TOUCH.move,p); TOUCH.idMap[t.identifier]='move'; }
    else { TOUCH.aim.active=true; TOUCH.aim.ox=p.x; TOUCH.aim.oy=p.y; _joy(TOUCH.aim,p); TOUCH.aim.fire=true; TOUCH.idMap[t.identifier]='aim'; } }
  e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', e=>{ if(state!=='play')return; for(const t of e.changedTouches){ const role=TOUCH.idMap[t.identifier]; if(!role)continue; const p=_txy(t); if(role==='move')_joy(TOUCH.move,p); else if(role==='aim'){ _joy(TOUCH.aim,p); TOUCH.aim.fire=TOUCH.aim.mag>0.25; } } e.preventDefault(); }, {passive:false});
function _touchEnd(e){ for(const t of e.changedTouches){ const role=TOUCH.idMap[t.identifier]; if(!role)continue; if(role==='move'){ TOUCH.move.active=false; TOUCH.move.nx=TOUCH.move.ny=TOUCH.move.mag=0; } else if(role==='aim'){ TOUCH.aim.active=false; TOUCH.aim.fire=false; TOUCH.aim.nx=TOUCH.aim.ny=TOUCH.aim.mag=0; } else TOUCH.btn[role]=false; delete TOUCH.idMap[t.identifier]; } }
canvas.addEventListener('touchend', e=>{ _touchEnd(e); if(state==='play')e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchcancel', _touchEnd);

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const normA = a => { while (a > Math.PI) a -= Math.PI*2; while (a < -Math.PI) a += Math.PI*2; return a; };
function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' '); let line = '';
  for (const w of words) { const t = line + w + ' '; if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line.trim(), cx, y); y += lh; line = w + ' '; } else line = t; }
  if (line.trim()) ctx.fillText(line.trim(), cx, y);
}

function zeroPerks(){return{DMG:0,HP:0,CRIT:0,AS:0,CD:0,SPD:0,XP:0,LS:0,LUCK:0,ARMOR:0,PICKUP:0};}
function loadSave(){
  try{ meta=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){ meta=null; }
  if(!meta||meta.version!==1) meta={version:1,stats:{},ach:{},perks:zeroPerks(),classPerks:{swordsman:zeroPerks(),wizard:zeroPerks(),archer:zeroPerks()}};
  // Идея 3: золото, стэш, экипировка, разблокировки (ленивые дефолты)
  if(meta.gold==null)meta.gold=0;
  if(!Array.isArray(meta.stash))meta.stash=[];
  if(!meta.equipped)meta.equipped={head:null,body:null,legs:null,weapon:null,accessory:null};
  if(!meta.unlocks)meta.unlocks={accessory:false,skin:0,skins:[0]};
  stats=meta.stats; recomputePerks();
}
function saveSave(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(meta)); }catch(e){} }
function resetSave(){ localStorage.removeItem(SAVE_KEY); loadSave(); }
function recomputePerks(){
  const p=zeroPerks(), cp={swordsman:zeroPerks(),wizard:zeroPerks(),archer:zeroPerks()};
  for(const a of ACHIEVEMENTS){ const lvl=(meta.ach[a.id]||{}).lvl||0; if(!lvl)continue;
    const key=PERK_OF[a.rew]; let s=0; for(let i=0;i<lvl;i++) s+=REW[a.rew][i];
    if(a.cls) cp[a.cls][key]+=s; else p[key]+=s;
  }
  for(const k in p) p[k]=Math.min(p[k],PERK_CAP[k]);
  for(const c in cp) for(const k in cp[c]) cp[c][k]=Math.min(cp[c][k],PERK_CAP[k]);
  meta.perks=p; meta.classPerks=cp;
}
function applyMeta(pl){
  if(!meta||!meta.perks)return;
  const g=meta.perks, c=(meta.classPerks&&meta.classPerks[pl.classId])||zeroPerks();
  const v=k=>(g[k]||0)+(c[k]||0);
  pl.maxHp+=v('HP'); pl.hp=pl.maxHp;
  pl.dmgM*=1+v('DMG'); pl.atkCdM*=1-v('AS');
  pl.qCdM*=1-v('CD'); pl.eCdM*=1-v('CD'); pl.rCdM*=1-v('CD'); pl.xCdM*=1-v('CD');
  pl.critBonus+=v('CRIT'); pl.spd*=1+v('SPD'); pl.xpMult+=v('XP');
  pl.lifesteal+=v('LS'); pl.dmgReduction+=v('ARMOR'); pl.pickupR+=v('PICKUP'); pl.luck+=v('LUCK');
}
function achToast(a,lvl){ achToasts.push({txt:`${a.icon} ${a.name} — ур.${lvl}`,perk:PERK_LABEL[PERK_OF[a.rew]],t:3.4}); if(achToasts.length>5)achToasts.shift(); }
function checkAch(metric){
  const list=ACH_BY_METRIC[metric]; if(!list)return; let changed=false;
  for(const a of list){
    const rec=meta.ach[a.id]||(meta.ach[a.id]={lvl:0});
    while(rec.lvl<5 && (stats[metric]||0)>=a.band[rec.lvl]){ rec.lvl++; achToast(a,rec.lvl); changed=true; }
  }
  if(changed){
    recomputePerks();
    const cnt=ACHIEVEMENTS.reduce((s,a)=>s+(((meta.ach[a.id]||{}).lvl||0)>0?1:0),0);
    if((stats.achievements_unlocked||0)!==cnt && metric!=='achievements_unlocked'){ stats.achievements_unlocked=cnt; checkAch('achievements_unlocked'); }
  }
}
function track(metric,amt=1){ if(!stats)return; stats[metric]=(stats[metric]||0)+amt; checkAch(metric); }
function trackMax(metric,val){ if(!stats)return; if((stats[metric]||0)<val){ stats[metric]=val; checkAch(metric); } }
function comboKill(){ if(!runStats)return; const now=performance.now(); runStats.combo.push(now); while(runStats.combo.length&&now-runStats.combo[0]>5000)runStats.combo.shift(); if(runStats.combo.length>=10){ track('combo_10_in_5s'); runStats.combo.length=0; } }
function endRun(){ if(!stats)return; track('score_total',score); trackMax('longest_run',Math.floor(runStats?runStats.time:0)); endRunLoot(); saveSave(); }
function profileLevel(){ return ACHIEVEMENTS.reduce((s,a)=>s+(((meta.ach[a.id]||{}).lvl||0)),0); }

function drawEnemyShape(e,fill){
  const r=e.r, sh=E_SHAPE[e.typeId]||'circle';
  ctx.beginPath();
  if(sh==='square') ctx.rect(e.x-r*0.82,e.y-r*0.82,r*1.64,r*1.64);
  else if(sh==='tear') ctx.ellipse(e.x,e.y,r*0.8,r*1.12,0,0,Math.PI*2);
  else if(sh==='wide') ctx.ellipse(e.x,e.y+r*0.2,r*1.12,r*0.78,0,0,Math.PI*2);
  else if(sh==='diamond'){ctx.moveTo(e.x,e.y-r);ctx.lineTo(e.x+r,e.y);ctx.lineTo(e.x,e.y+r);ctx.lineTo(e.x-r,e.y);ctx.closePath();}

  ctx.fillStyle=fill; ctx.fill();

}

function mirror(ctx,cx,cy,r,t){const[tx]=tremor(t,rage()?1.4:0.4,rage());ctx.save();ctx.translate(cx+tx,cy);const sh=Math.sin(t*3)*0.5+0.5;const grad=ctx.createLinearGradient(-r,-r,r,r);grad.addColorStop(0,mix('#bcd4ff','#ffbff0',sh));grad.addColorStop(0.5,'#ffffff');grad.addColorStop(1,mix('#9ffbe6','#cdb6ff',sh));ctx.fillStyle=grad;ctx.strokeStyle=rgba('#ffffff',0.7);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-r*0.4,-r*0.2);ctx.lineTo(r*0.4,-r*0.2);ctx.lineTo(r*0.3,r*0.7);ctx.lineTo(-r*0.3,r*0.7);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,-r*0.5,r*0.28,0,TAU);ctx.fill();ctx.stroke();ctx.globalAlpha=0.5;ctx.fillStyle='#ffffff';for(let i=0;i<5;i++){const a=i*1.26+t*0.3;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*0.2,Math.sin(a)*r*0.2);ctx.lineTo(Math.cos(a+0.4)*r*0.7,Math.sin(a+0.4)*r*0.6);ctx.lineTo(Math.cos(a-0.2)*r*0.6,Math.sin(a-0.2)*r*0.5);ctx.closePath();ctx.fill();}ctx.globalAlpha=1;const ec=mix('#55aaff','#ff6655',sh);eye(ctx,-r*0.12,-r*0.52,r*0.06,ec,t,true);eye(ctx,r*0.12,-r*0.52,r*0.06,ec,t,true);if(isAtk()){const px=r*0.6+((t*2)%1)*r*1.2;ctx.save();ctx.shadowColor=ec;ctx.shadowBlur=10;ctx.fillStyle=ec;ctx.beginPath();ctx.arc(px,0,r*0.12,0,TAU);ctx.fill();ctx.restore();}ctx.restore();}
function voidavatar(ctx,cx,cy,r,t){const[tx,ty]=tremor(t,rage()?1.6:0.6,rage());ctx.save();ctx.translate(cx+tx,cy+ty);for(let i=0;i<3;i++){ctx.save();ctx.rotate(t*(0.6+i*0.3)+i);ctx.strokeStyle=rgba(i?'#7a2ad0':'#c060ff',0.5-i*0.12);ctx.lineWidth=r*(0.18-i*0.04);ctx.beginPath();ctx.ellipse(0,0,r*(1.1-i*0.18),r*(0.7-i*0.12),0,0.3,TAU-0.3);ctx.stroke();ctx.restore();}ctx.save();ctx.shadowColor='#a040ff';ctx.shadowBlur=r*0.7*pulse(t,0.6,1.4);ctx.fillStyle='#050008';ctx.beginPath();ctx.arc(0,0,r*0.62,0,TAU);ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#b050ff';ctx.stroke();ctx.restore();for(let i=0;i<6;i++){const a=t*1.5+i,dd=1-((t*0.5+i*0.16)%1);ctx.fillStyle=rgba('#ffffff',dd*0.8);ctx.beginPath();ctx.arc(Math.cos(a)*r*1.1*dd,Math.sin(a)*r*0.8*dd,1.5,0,TAU);ctx.fill();}const ge=tint('#d080ff');ctx.save();ctx.shadowColor=ge;ctx.shadowBlur=r*0.6;ctx.fillStyle=ge;ctx.beginPath();ctx.arc(0,0,r*0.16*(isAtk()?1.5:1)*pulse(t,0.8,1.2),0,TAU);ctx.fill();ctx.restore();ctx.restore();}
function crystalgolem(ctx,cx,cy,r,t){const[tx,ty]=tremor(t,rage()?1.6:0.4,rage());ctx.save();ctx.translate(cx+tx,cy+ty);const c=tint('#7fd8ff');const facets=[[0,-1],[0.7,-0.4],[0.6,0.7],[-0.6,0.7],[-0.7,-0.4]];ctx.fillStyle=rgba('#5ab8e0',0.85);ctx.strokeStyle=tint('#cdf2ff');ctx.lineWidth=2;ctx.beginPath();facets.forEach((p,i)=>{const x=p[0]*r,y=p[1]*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle=rgba('#cdf2ff',0.5);ctx.lineWidth=1;facets.forEach(p=>{ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(p[0]*r,p[1]*r);ctx.stroke();});ctx.fillStyle=rgba('#9fe6ff',0.8);[[-0.8,0.2],[0.8,0.2],[0,-1.2]].forEach(p=>{ctx.beginPath();ctx.moveTo(p[0]*r,p[1]*r);ctx.lineTo(p[0]*r*1.3,p[1]*r*1.2);ctx.lineTo(p[0]*r*0.7,p[1]*r*0.8);ctx.closePath();ctx.fill();});ctx.save();ctx.shadowColor=c;ctx.shadowBlur=r*0.7*pulse(t,0.5,1.4);ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,r*0.22,0,TAU);ctx.fill();ctx.restore();if(isAtk()){ctx.strokeStyle=rgba('#ffffff',0.6+0.4*Math.sin(t*20));ctx.lineWidth=3;ctx.beginPath();facets.forEach((p,i)=>{const x=p[0]*r*1.12,y=p[1]*r*1.12;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.stroke();}ctx.restore();}
function reaper(ctx,cx,cy,r,t){const[tx,ty]=tremor(t,rage()?1.8:0.5,rage());const hover=Math.sin(t*1.8)*r*0.08;ctx.save();ctx.translate(cx+tx,cy+hover+ty);ctx.fillStyle=rgba('#6a2aa0',0.08+0.08*pulse(t,0.3,1));ctx.beginPath();ctx.arc(0,0,r*1.3,0,TAU);ctx.fill();ctx.fillStyle=tint('#1c1428');ctx.beginPath();ctx.moveTo(-r*0.55,r*1.0);ctx.quadraticCurveTo(-r*0.7,-r*0.5,0,-r*0.95);ctx.quadraticCurveTo(r*0.7,-r*0.5,r*0.55,r*1.0);const seg=6;for(let i=seg;i>=0;i--){const px=-r*0.55+i*(r*1.1/seg);ctx.lineTo(px,r*1.0+Math.sin(t*4+i)*r*0.08-(i%2?r*0.18:0));}ctx.closePath();ctx.fill();ctx.fillStyle='#000004';ctx.beginPath();ctx.ellipse(0,-r*0.45,r*0.3,r*0.4,0,0,TAU);ctx.fill();const ge=tint('#b84aff');ctx.save();ctx.shadowColor=ge;ctx.shadowBlur=r*0.6*pulse(t,0.6,1.3);ctx.fillStyle=ge;ctx.beginPath();ctx.arc(-r*0.1,-r*0.5,r*0.06,0,TAU);ctx.arc(r*0.1,-r*0.5,r*0.06,0,TAU);ctx.fill();ctx.restore();const raise=isAtk()?-0.9:0;ctx.save();ctx.translate(r*0.7,r*0.1);ctx.rotate(raise);ctx.strokeStyle='#3a2a1a';ctx.lineWidth=r*0.08;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,r*0.8);ctx.lineTo(0,-r*0.9);ctx.stroke();ctx.fillStyle=tint('#d8dde6');ctx.beginPath();ctx.moveTo(0,-r*0.9);ctx.quadraticCurveTo(-r*0.8,-r*1.1,-r*0.9,-r*0.5);ctx.quadraticCurveTo(-r*0.4,-r*0.7,0,-r*0.75);ctx.closePath();ctx.fill();ctx.lineCap='butt';ctx.restore();if(isAtk()){ctx.strokeStyle=rgba('#c060ff',0.6);ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r*1.1,-0.5,1.2);ctx.stroke();}ctx.restore();}

function fxP(parts,x,y,o){const p=new Particle(x,y,o.vx||0,o.vy||0,o.col||'#fff',o.life||1,o.size||3);p.maxLife=o.life||1;if(o.kind)p.kind=o.kind;if(o.grav)p.grav=o.grav;if(o.drag!=null)p.drag=o.drag;if(o.vr)p.vr=o.vr;if(o.grow)p.grow=o.grow;if(o.vsize)p.vsize=o.vsize;if(o.lw)p.lw=o.lw;if(o.a0!=null)p.a0=o.a0;if(o.glow)p.glow=o.glow;parts.push(p);}

function dBones(parts,x,y,r,dc){for(let i=0;i<11;i++){const a=rnd(0,TAU),sp=rnd(50,180);fxP(parts,x+rnd(-r*0.3,r*0.3),y+rnd(-r*0.3,r*0.3),{kind:'shard',vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rnd(30,90),grav:420,drag:0.98,col:Math.random()<0.5?dc[0]:dc[1],size:rnd(2.5,5),life:rnd(0.7,1.1),vr:rnd(-10,10)});}for(let i=0;i<5;i++)fxP(parts,x+rnd(-r*0.4,r*0.4),y,{kind:'smoke',vx:rnd(-15,15),vy:-rnd(10,30),grow:16,col:dc[1],size:rnd(3,6),life:1.0,a0:0.25,drag:0.99});for(let i=0;i<2;i++)fxP(parts,x+rnd(-r*0.3,r*0.3),y-r*0.2,{vx:rnd(-30,30),vy:-rnd(20,50),grav:200,col:dc[2]||'#ff5a28',size:2.5,life:0.5,glow:true});}

function forgeSelItem(){ if(!forgeSel||!meta)return null; return forgeSel.loc==='stash'?meta.stash[forgeSel.idx]:meta.equipped[forgeSel.slot]; }
function forgeMove(){ if(!forgeSel||!meta)return;
  if(forgeSel.loc==='stash'){ const it=meta.stash[forgeSel.idx]; if(!it)return; const old=meta.equipped[it.slot]; meta.equipped[it.slot]=it; meta.stash.splice(forgeSel.idx,1); if(old)meta.stash.push(old); forgeSel=null; saveSave(); }
  else { const sk=forgeSel.slot, it=meta.equipped[sk]; if(it&&meta.stash.length<24){ meta.stash.push(it); meta.equipped[sk]=null; } forgeSel=null; saveSave(); } }
function rollRarityW(w){ let tot=w.reduce((a,b)=>a+b,0),x=Math.random()*tot; for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return i;} return 0; }
function rollRarity(luck){   // DEV (тест) — текущие веса с удачей; PROD — редкий Божественный
  if(DEV){ const w=RARITY.map((r,i)=>i===0?r.w:r.w*(1+(luck||0)*2)); return rollRarityW(w); }
  return rollRarityW(PROD_RWEIGHT);
}
function rollRarityBoss(){ return DEV?rollRarity(8):rollRarityW(BOSS_RWEIGHT); }   // боссы: высокий шанс редкого лута
function genAffixes(slotKey,rarity,ilvl){
  const rar=RARITY[rarity],pool=SLOTS[slotKey].affixes.slice();
  const n=Math.min(rar.affixes,pool.length),chosen=[];
  for(let i=0;i<n;i++)chosen.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  const baseSpd=165;
  return chosen.map(af=>{ let v;
    if(af.int) v=Math.max(1,Math.round(af.base*rar.budget*AFFIX_SCALE));
    else if(af.ofSpd) v=Math.round(af.base*rar.budget*baseSpd*(0.85+Math.random()*0.3)*AFFIX_SCALE);
    else v=Math.round(af.base*rar.budget*(0.85+Math.random()*0.3)*(1+0.015*(ilvl||0))*AFFIX_SCALE*1000)/1000;
    return {stat:af.stat,val:v,label:af.label,pct:af.ofSpd?0:af.pct,neg:af.neg};
  });
}
function itemScore(it){ let s=it.rarity*3; it.affixes.forEach(a=>{const b=SLOTS[it.slot].affixes.find(x=>x.stat===a.stat); if(b)s+=a.val/b.base;}); return s+(it.sharpen||0)*2; }
function rollItem(slotKey,ilvl,luck){ const ri=rollRarity(luck); const it={slot:slotKey,rarity:ri,affixes:genAffixes(slotKey,ri,ilvl),ilvl:ilvl||0,sharpen:0}; it.score=itemScore(it); return it; }
function itemName(it){return RARITY[it.rarity].n+' · '+SLOTS[it.slot].name;}
function applyStat(p,stat,v){ switch(stat){
  case 'dmg':p.dmgM+=v;break; case 'as':p.atkCdM=Math.max(0.2,p.atkCdM-v);break;
  case 'cd':p.qCdM=Math.max(0.2,p.qCdM-v);p.eCdM=Math.max(0.2,p.eCdM-v);p.rCdM=Math.max(0.2,p.rCdM-v);break;
  case 'xcd':p.xCdM=Math.max(0.2,p.xCdM-v);break;
  case 'crit':p.critBonus+=v;break; case 'xp':p.xpMult+=v;break; case 'pickup':p.pickupR+=v;break;
  case 'pierce':p.pierce+=v;break; case 'boss':p.bossDmgM+=v;break;
  case 'hp':p.maxHp+=v;if(v>0)p.hp+=v;break; case 'armor':p.dmgReduction=Math.min(0.55,p.dmgReduction+v);break;
  case 'ls':p.lifesteal+=v;break; case 'shield':p.shieldPct+=v;break; case 'regen':p.hpRegen+=v;break;
  case 'spd':p.spd+=v;break; case 'dodge':p.dodge=Math.min(0.45,p.dodge+v);break; case 'dash':p.dashDist+=v;break; case 'inv':p.invMult+=v;break;
  case 'freeze':p.onHitFreeze+=v;break; case 'burn':p.onHitBurn+=v;break; case 'luck':p.luck+=v;break;
}}
function applyItem(p,it,sign){ if(!it)return; const m=1+0.1*(it.sharpen||0); for(const a of it.affixes)applyStat(p,a.stat,a.val*m*sign); }
function equipItem(p,it){ const cur=p.equipped[it.slot]; if(cur)applyItem(p,cur,-1); applyItem(p,it,1); p.equipped[it.slot]=it; }
function pickupDrop(p,it){ track('items_picked'); const cur=p.equipped[it.slot];
  if(!cur||it.score>cur.score){ equipItem(p,it); lootToast(it,true); } else lootToast(it,false); }
function lootToast(it,equipped){ achToasts.push({txt:itemName(it),perk:equipped?'✓ экипировано':'хуже текущего',t:3.0,col:RARITY[it.rarity].col}); if(achToasts.length>5)achToasts.shift(); }

function addGold(n,x,y){ if(!meta)return; n=Math.round(n*(DEV?3:1)); meta.gold=(meta.gold||0)+n; if(typeof SFX!=='undefined')SFX.play('gold');
  if(typeof FloatText!=='undefined'&&typeof floats!=='undefined'){ const fx=(x==null&&player)?player.x:x, fy=(y==null&&player)?player.y-44:y; if(fx!=null)floats.push(new FloatText(fx,fy,'+'+n+' 🪙','#ffd24a',13)); } }
function addToStash(it){ if(!meta)return; if(meta.stash.length>=24){ let li=0; for(let i=1;i<meta.stash.length;i++) if((meta.stash[i].score||0)<(meta.stash[li].score||0)) li=i; if((it.score||0)>(meta.stash[li].score||0)) meta.stash[li]=it; } else meta.stash.push(it); }
function endRunLoot(){ if(!player||!meta)return; const eq=Object.values(meta.equipped); for(const sk in player.equipped){ const it=player.equipped[sk]; if(it&&!eq.includes(it)&&!meta.stash.includes(it)) addToStash(it); } }
function forgeCostReroll(it){ return 20*(it.rarity+1); }
function forgeCostRarity(it){ return it.rarity>=5?0:60*Math.pow(2,it.rarity); }
function forgeCostSharpen(it){ return 30*((it.sharpen||0)+1); }
function forgeReroll(it){ const c=forgeCostReroll(it); if(meta.gold<c)return; meta.gold-=c; it.affixes=genAffixes(it.slot,it.rarity,it.ilvl); it.score=itemScore(it); saveSave(); }
function forgeRarity(it){ if(it.rarity>=5)return; const c=forgeCostRarity(it); if(meta.gold<c)return; meta.gold-=c; it.rarity++; it.affixes=genAffixes(it.slot,it.rarity,it.ilvl); it.score=itemScore(it); saveSave(); }
function forgeSharpen(it){ const c=forgeCostSharpen(it); if(meta.gold<c)return; meta.gold-=c; it.sharpen=(it.sharpen||0)+1; it.score=itemScore(it); saveSave(); }
class Drop{
  constructor(x,y,item){this.x=x;this.y=y;this.item=item;this.life=20;this.pulse=Math.random()*6;this.dead=false;}
  update(dt,player){this.life-=dt;this.pulse+=dt*4;if(this.life<=0){this.dead=true;return;}
    const d=dist(this,player), pr=player.r+16+(player.pickupR||0), mag=pr+95;
    if(d<pr){pickupDrop(player,this.item);this.dead=true;return;}
    if(d<mag){const a=Math.atan2(player.y-this.y,player.x-this.x),sp=Math.min(300,(mag-d)*4.5);this.x+=Math.cos(a)*sp*dt;this.y+=Math.sin(a)*sp*dt;}}   // магнит лута: тянется к герою
  draw(){const r=RARITY[this.item.rarity],s=1+Math.sin(this.pulse)*0.2;ctx.globalAlpha=clamp(this.life*0.5,0,1);
    if(this.item.rarity>=2){const ba=clamp(this.life*0.4,0,0.5)*(0.72+0.28*Math.sin(this.pulse*1.3));ctx.save();const bg=ctx.createLinearGradient(this.x,this.y-42,this.x,this.y+4);bg.addColorStop(0,_rgba(r.col,0));bg.addColorStop(1,_rgba(r.col,ba));ctx.fillStyle=bg;ctx.fillRect(this.x-3.5,this.y-42,7,46);ctx.restore();}   // луч редкости
    ctx.shadowColor=r.col;ctx.shadowBlur=this.item.rarity>=3?18:10;ctx.fillStyle=r.col;
    ctx.save();ctx.translate(this.x,this.y);ctx.rotate(Math.PI/4);ctx.fillRect(-6*s,-6*s,12*s,12*s);ctx.restore();
    ctx.shadowBlur=0;ctx.fillStyle='#000';ctx.font='10px Segoe UI';ctx.textAlign='center';ctx.fillText(SLOTS[this.item.slot].icon,this.x,this.y+3);ctx.textAlign='left';ctx.globalAlpha=1;}
}

    e:(p,projs,parts)=>{ const dist2=190,dx=Math.cos(p.angle),dy=Math.sin(p.angle); const nx=clamp(p.x+dx*dist2,p.r+20,worldW-20-p.r),ny=clamp(p.y+dy*dist2,p.r+20,worldH-20-p.r); const dmg=p._dmg(p.c.dmg*1.6); const hset=new Set(); for(let s=0;s<=12;s++){ const cx=p.x+(nx-p.x)*s/12,cy=p.y+(ny-p.y)*s/12; enemies.forEach(e=>{ if(!e.dead&&!hset.has(e)&&dist({x:cx,y:cy},e)<e.r+24){ e.hit(dmg,parts,'e','roll'); score+=Math.floor(dmg); if(p.lifesteal>0)p.heal(Math.floor(dmg*p.lifesteal)); hset.add(e); } }); } for(let i=0;i<7;i++){const f=i/7;dashGhosts.push({x:p.x+(nx-p.x)*f,y:p.y+(ny-p.y)*f,angle:p.angle,cls:p.classId,life:0.28,max:0.28});} p.x=nx;p.y=ny;p.invTimer=Math.max(p.invTimer,0.25); },

// Ally-owned зоны архетипов (яд/лава-DoT, вортекс-притяжение, рут) — бьют ВРАГОВ (в отличие от groundFX,
// которые бьют игрока). Реюз enemy.poison/poisonT и enemy.stunT — без новых полей на Enemy.
let hazards=[];
function spawnHazard(x,y,r,life,opts){ hazards.push(Object.assign({x,y,r,life,max:life,arm:0},opts||{})); }

// Дружественный призыв (духи/голем/питомец) — реюз для Призывателя (маг) и Ловчего (лучник).
// Урон только через существующий e.hit(...); минионы не получают урон (временные, живут по таймеру life).
class Minion {
  constructor(x,y,dmg,r,color,kind,duration){
    this.x=x;this.y=y;this.dmg=dmg;this.r=r;this.color=color;this.kind=kind||'spirit';
    this.life=duration;this.dead=false;this.atkTimer=Math.random()*0.4;
    this.atkCd=kind==='golem'?1.3:0.85; this.spd=kind==='golem'?85:150;
    this.range=kind==='golem'?36:(kind==='beast'?32:230);
    this.ranged=!(kind==='golem'||kind==='beast');
    this.bob=Math.random()*6.28;
  }
  update(dt){
    this.life-=dt; if(this.life<=0){this.dead=true;return;}
    this.bob+=dt*4; if(this.atkTimer>0)this.atkTimer-=dt;
    let best=null,bd=1e9;
    for(const e of enemies){ if(e.dead)continue; const dd=(e.x-this.x)*(e.x-this.x)+(e.y-this.y)*(e.y-this.y); if(dd<bd){bd=dd;best=e;} }
    if(best && bd<520*520){
      const d=Math.sqrt(bd), a=Math.atan2(best.y-this.y,best.x-this.x);
      if(d>this.range*0.75){ this.x+=Math.cos(a)*this.spd*dt; this.y+=Math.sin(a)*this.spd*dt; }
      if(d<this.range && this.atkTimer<=0){
        this.atkTimer=this.atkCd;
        if(this.ranged){ const pr=new Proj(this.x,this.y,a,360,this.dmg,this.color,6,false,0); pr.src='minion'; projs.push(pr); }
        else { best.hit(this.dmg,parts,'minion',false); score+=Math.floor(this.dmg); for(let i=0;i<4;i++)parts.push(new Particle(this.x,this.y,(Math.random()-.5)*100,(Math.random()-.5)*100,this.color,0.3,2)); }
      }
    } else if(player){ const pd=dist(this,player); if(pd>110){const a=Math.atan2(player.y-this.y,player.x-this.x); this.x+=Math.cos(a)*this.spd*0.7*dt; this.y+=Math.sin(a)*this.spd*0.7*dt;} }
  }
  draw(){
    const bobY=Math.sin(this.bob)*2, fade=this.life>0.3?1:clamp(this.life/0.3,0.15,1);
    ctx.save(); ctx.shadowColor=this.color; ctx.shadowBlur=10; ctx.globalAlpha=fade;
    ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y+bobY,this.r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=fade; ctx.fillStyle='rgba(255,255,255,0.65)'; ctx.beginPath(); ctx.arc(this.x-this.r*0.3,this.y+bobY-this.r*0.3,this.r*0.35,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.restore();
  }
}
let minions=[];

// Генерик-хелперы урона архетипов (AoE-круг / конус вперёд) — реюз e.hit/score/lifesteal/rings/particles,
// как у существующих базовых умений (frost nova, fury arc и т.д.), чтобы не плодить параллельную логику.
function archAoe(p,parts,x,y,r,dmg,src,opts){
  opts=opts||{}; let hits=0;
  enemies.forEach(e=>{ if(e.dead)return; const dx=e.x-x,dy=e.y-y,d=Math.hypot(dx,dy); if(d<r){ e.hit(dmg,parts,src,'roll'); score+=Math.floor(dmg); hits++;
    if(p.lifesteal>0)p.heal(Math.floor(dmg*p.lifesteal*(opts.vampM||1)));
    if(opts.stun>0)e.stunT=Math.max(e.stunT||0,opts.stun);
    if(opts.slow>0)e.slow=Math.max(e.slow,opts.slow);
    if(opts.knockback>0){ const a=Math.atan2(dy,dx)||Math.random()*6.28; e.x+=Math.cos(a)*opts.knockback; e.y+=Math.sin(a)*opts.knockback; }
  } });
  const col=opts.color||'#ff6644';
  rings.push(new Ring(x,y,col,r)); rings.push(new Ring(x,y,'#ffffff',r*0.55));   // двойное кольцо: цвет архетипа + белая вспышка ядра
  for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,s=80+Math.random()*160;parts.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,col,0.55,3+Math.random()*2));}
  for(let i=0;i<7;i++){const a=Math.random()*Math.PI*2,s=180+Math.random()*140;parts.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,'#ffffff',0.3,2+Math.random()*2));}
  addShake(Math.min(5,r*0.032));
  if(r>=150){ if(typeof SFX!=='undefined')SFX.play('explosion'); if(r>=190)hitStopFor(0.05); }   // тяжёлые AoE — звук взрыва + микро-хитстоп
  return hits;
}
function archCone(p,parts,range,arcHalf,dmg,src,opts){
  opts=opts||{}; let hits=0;
  enemies.forEach(e=>{ if(e.dead)return; const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy); if(d<range&&Math.abs(normA(Math.atan2(dy,dx)-p.angle))<arcHalf){ e.hit(dmg,parts,src,'roll'); score+=Math.floor(dmg); hits++;
    if(p.lifesteal>0)p.heal(Math.floor(dmg*p.lifesteal*(opts.vampM||1)));
    if(opts.stun>0)e.stunT=Math.max(e.stunT||0,opts.stun);
    if(opts.knockback>0){ const a=Math.atan2(dy,dx); e.x+=Math.cos(a)*opts.knockback; e.y+=Math.sin(a)*opts.knockback; }
  } });
  const col=opts.color||'#ffcc44';
  for(let i=0;i<14;i++){const a=p.angle+(Math.random()-.5)*arcHalf*2;parts.push(new Particle(p.x+Math.cos(a)*range*0.5,p.y+Math.sin(a)*range*0.5,Math.cos(a)*220+(Math.random()-.5)*80,Math.sin(a)*220+(Math.random()-.5)*80,col,0.45,3));}
  for(let i=0;i<6;i++){const a=p.angle+(Math.random()-.5)*arcHalf*1.4;parts.push(new Particle(p.x+Math.cos(a)*range*0.6,p.y+Math.sin(a)*range*0.6,Math.cos(a)*300+(Math.random()-.5)*90,Math.sin(a)*300+(Math.random()-.5)*90,'#ffffff',0.3,2));}
  if(hits>0)rings.push(new Ring(p.x+Math.cos(p.angle)*range*0.55,p.y+Math.sin(p.angle)*range*0.55,col,Math.max(40,range*0.5)));   // кольцо-искра при попадании
  addShake(hits>0?2:1.2);
  return hits;
}

// ── Particle ───────────────────────────────────────────────────────────────
class Particle {
  constructor(x, y, vx, vy, color, life, size = 3, opts) { Object.assign(this, { x, y, vx, vy, color, life, maxLife: life, size }); if(opts) Object.assign(this, opts); }
  update(dt) { this.x += this.vx*dt; this.y += this.vy*dt; const d=(this.drag!=null)?this.drag:0.93; this.vx*=d; this.vy*=d; if(this.grav)this.vy+=this.grav*dt; if(this.kind==='smoke')this.size+=(this.grow||10)*dt; else if(this.kind==='ring')this.size+=(this.vsize||140)*dt; if(this.vr)this.rot=(this.rot||0)+this.vr*dt; this.life -= dt; }
  draw() { const a=clamp(this.life/this.maxLife,0,1)*(this.a0!=null?this.a0:1); ctx.globalAlpha=a; if(this.glow){ctx.shadowColor=this.color;ctx.shadowBlur=this.size*2.2;} const k=this.kind;
    if(k==='ring'){ctx.strokeStyle=this.color;ctx.lineWidth=this.lw||3;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.stroke();}
    else if(k==='spark'){ctx.strokeStyle=this.color;ctx.lineWidth=this.size;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x-this.vx*0.04,this.y-this.vy*0.04);ctx.stroke();ctx.lineCap='butt';}
    else if(k==='shard'){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot||0);ctx.fillStyle=this.color;ctx.beginPath();ctx.moveTo(-this.size,this.size*0.9);ctx.lineTo(this.size,this.size*0.3);ctx.lineTo(0,-this.size);ctx.closePath();ctx.fill();ctx.restore();}
    else {ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();}
    if(this.glow)ctx.shadowBlur=0; ctx.globalAlpha=1; }
}

class Ring {
  constructor(x, y, color, maxR = 165) { this.x=x; this.y=y; this.r=10; this.maxR=maxR; this.life=0.7; this.maxLife=0.7; this.color=color; }
  update(dt) { this.r += (this.maxR-10)/this.maxLife*dt; this.life -= dt; }
  draw() { ctx.globalAlpha = clamp(this.life/this.maxLife,0,1)*0.85; ctx.strokeStyle=this.color; ctx.lineWidth=4; ctx.shadowColor=this.color; ctx.shadowBlur=14; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0; ctx.globalAlpha=1; }
}

// ── Projectile ─────────────────────────────────────────────────────────────
class Proj {
  constructor(x, y, angle, spd, dmg, color, size, isEnemy=false, pierce=0, explode=false, explodeR=70, doubleExplode=false) {
    this.x=x; this.y=y; this.vx=Math.cos(angle)*spd; this.vy=Math.sin(angle)*spd;
    this.dmg=dmg; this.color=color; this.size=size;
    this.isEnemy=isEnemy; this.dead=false; this.pierce=pierce; this.explode=explode; this.explodeR=explodeR; this.doubleExplode=doubleExplode;
    this.hit=new Set(); this.trail=[];
    this.sticky=false; this.stuck=false; this.stuckTimer=0; this.stuckAngle=0;
    this.fireTrail=false; this.bouncy=false; this.bounceCount=0; this.homing=false;
    this.maxDist=0; this.traveled=0;   // F4: детонация по пройденной дистанции (метеоры волшебника)
    this.slowDur=0;                    // замедление при взрыве (апгрейд Метеора)
    this.src='atk';                    // Идея 1: источник урона (для kills_by_*)
    if(!isEnemy) track('projectiles_fired');
  }
  update(dt, parts=[]) {
    if(this.stuck){this.stuckTimer-=dt;if(this.stuckTimer<=0)this.dead=true;return;}
    this.trail.push({x:this.x,y:this.y}); if(this.trail.length>9) this.trail.shift();
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    // Лучник: самонаведение — мягко доворачиваем к ближайшему врагу
    if(this.homing&&!this.isEnemy&&typeof enemies!=='undefined'&&enemies.length){
      let best=null,bd=1e9; for(const e of enemies){if(e.dead)continue;const dd=(e.x-this.x)*(e.x-this.x)+(e.y-this.y)*(e.y-this.y);if(dd<bd){bd=dd;best=e;}}
      if(best&&bd<360*360){const sp=Math.hypot(this.vx,this.vy),ca=Math.atan2(this.vy,this.vx);let da=Math.atan2(best.y-this.y,best.x-this.x)-ca;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;const na=ca+clamp(da,-0.13,0.13);this.vx=Math.cos(na)*sp;this.vy=Math.sin(na)*sp;}
    }
    const L=22,T=22,R=worldW-22,B=worldH-22;   // F5: границы стен мира
    // F4: детонация по пройденной дистанции (метеоры волшебника)
    if(this.maxDist>0){
      this.traveled+=Math.hypot(this.vx,this.vy)*dt;
      if(this.traveled>=this.maxDist){
        if(this.explode){explodeAt(this.x,this.y,this.dmg*0.7,parts,this.explodeR,this.slowDur,this.src);rings.push(new Ring(this.x,this.y,'#ff6600',this.explodeR*0.6));}
        this.dead=true;return;
      }
    }
    // sticky-стрела (лучник без bouncy)
    if(this.sticky&&!this.isEnemy&&(this.x<=L||this.x>=R||this.y<=T||this.y>=B)){
      this.stuck=true;this.stuckTimer=5;this.stuckAngle=Math.atan2(this.vy,this.vx);
      this.x=clamp(this.x,L,R);this.y=clamp(this.y,T,B);return;
    }
    // F4: bouncy — максимум 2 отскока, на 3-м контакте со стеной стрела застревает
    if(this.bouncy&&!this.isEnemy){
      const atWall=this.x<=L||this.x>=R||this.y<=T||this.y>=B;
      if(atWall){
        if(this.bounceCount>=2){
          this.stuck=true;this.stuckTimer=5;this.stuckAngle=Math.atan2(this.vy,this.vx);
          this.x=clamp(this.x,L,R);this.y=clamp(this.y,T,B);return;
        }
        this.bounceCount++; track('arrows_bounced');
        if(this.x<=L){this.vx=Math.abs(this.vx);this.x=L+1;}
        else if(this.x>=R){this.vx=-Math.abs(this.vx);this.x=R-1;}
        if(this.y<=T){this.vy=Math.abs(this.vy);this.y=T+1;}
        else if(this.y>=B){this.vy=-Math.abs(this.vy);this.y=B-1;}
      }
    }
    // взрыв огненного шара волшебника о стену
    if(this.explode&&!this.isEnemy&&(this.x<=L||this.x>=R||this.y<=T||this.y>=B)){
      this.x=clamp(this.x,L,R);this.y=clamp(this.y,T,B);
      explodeAt(this.x,this.y,this.dmg*0.7,parts,this.explodeR,this.slowDur,this.src);
      rings.push(new Ring(this.x,this.y,'#ff6600',this.explodeR*0.6));
      this.dead=true;return;
    }
    if(this.x<0||this.x>worldW||this.y<0||this.y>worldH) this.dead=true;
  }
  draw() {
    if(this.stuck){
      const fade=clamp(this.stuckTimer/5,0,1),sa=this.stuckAngle,len=13;
      ctx.globalAlpha=fade;ctx.shadowColor=this.color;ctx.shadowBlur=8;
      ctx.strokeStyle=this.color;ctx.lineWidth=2.5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(this.x-Math.cos(sa)*len,this.y-Math.sin(sa)*len);ctx.lineTo(this.x,this.y);ctx.stroke();
      const tx=this.x-Math.cos(sa)*len,ty=this.y-Math.sin(sa)*len;
      ctx.strokeStyle='rgba(180,255,140,0.7)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(tx+Math.cos(sa+0.5)*5,ty+Math.sin(sa+0.5)*5);ctx.moveTo(tx,ty);ctx.lineTo(tx+Math.cos(sa-0.5)*5,ty+Math.sin(sa-0.5)*5);ctx.stroke();
      ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.lineCap='butt';return;
    }
    if(this.fireTrail){
      const ftc=['#ff2200','#ff6600','#ffbb00'];
      for(let i=0;i<this.trail.length;i++){const f=i/this.trail.length;ctx.globalAlpha=f*0.7;ctx.fillStyle=ftc[Math.floor(f*ftc.length)];ctx.shadowColor='#ff4400';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(this.trail[i].x,this.trail[i].y,this.size*1.4*f,0,Math.PI*2);ctx.fill();}
    } else {
      for(let i=0;i<this.trail.length;i++){const f=i/this.trail.length;ctx.globalAlpha=f*0.45;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.trail[i].x,this.trail[i].y,this.size*f*1.05,0,Math.PI*2);ctx.fill();}
    }
    ctx.globalAlpha=1; ctx.shadowColor=this.color; ctx.shadowBlur=12; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  }
}

// ── HealthOrb ──────────────────────────────────────────────────────────────
class HealthOrb {
  constructor(x,y){this.x=x;this.y=y;this.life=9;this.pulse=0;this.dead=false;}
  update(dt,player){this.life-=dt;this.pulse+=dt*5;if(this.life<=0){this.dead=true;return;}if(dist(this,player)<player.r+16+(player.pickupR||0)){player.heal(20);this.dead=true;track('orbs_collected');}}

class BladeWave {
  constructor(x,y,angle,dmg,hitR=38){

    this.vx=Math.cos(angle)*480;this.vy=Math.sin(angle)*480;

      if(!tgt)return;
      const ang=Math.atan2(tgt.y-this.y,tgt.x-this.x);
      const ep=this.passiveTier>=3?1:0;
      for(let i=0;i<this.passiveTier;i++){const a=ang+(i===0?0:(i%2===0?1:-1)*0.08*Math.ceil(i/2));const ap=new Proj(this.x,this.y,a,580,this._dmg(this.c.dmg*1.8),'#ffcc00',7,false,this.pierce+ep);ap.src='passive';projs.push(ap);}
      for(let i=0;i<10;i++){const a=ang+(Math.random()-.5)*0.3;parts.push(new Particle(this.x,this.y,Math.cos(a)*300,Math.sin(a)*300,'#ffcc00',0.3,3));}
    }
  }

  takeDamage(dmg) {
    if(this.invTimer>0) return;
    if(this.dodge>0&&Math.random()<this.dodge){this.invTimer=0.2;for(let i=0;i<6;i++){const a=Math.random()*Math.PI*2;parts.push(new Particle(this.x,this.y,Math.cos(a)*140,Math.sin(a)*140,'#ffffff',0.3,2));}return;}  // Идея 2: уклонение
    if(this.dmgReduction>0) dmg=Math.max(1,Math.round(dmg*(1-this.dmgReduction)));
    if(this.shieldHp<=0 && this.hp-dmg>0 && this.hp-dmg<this.maxHp*0.1) track('low_hp_survived');
    if(this.shieldHp>0){
      this.shieldHp=Math.max(0,this.shieldHp-dmg); this.invTimer=0.25;
      if(this.shieldHp<=0){
          this.shieldMax=0;for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2;parts.push(new Particle(this.x,this.y,Math.cos(a)*180,Math.sin(a)*180,'#4488ff',0.6,3));}   // взрыв щита — только по таймеру (не при пробитии), см. player.update
      }
      return;
    }
    this.hp=Math.max(0,this.hp-dmg); this.invTimer=0.5*(1+this.invMult);
    if(typeof floats!=='undefined')floats.push(new FloatText(this.x,this.y-22,'-'+Math.round(dmg),'#ff5555',14)); addShake(5); if(typeof SFX!=='undefined')SFX.play('hurt');
    if(typeof dmgFlash!=='undefined')dmgFlash=Math.min(0.42,dmgFlash+0.28);   // красный флэш получения урона
    if(runStats){runStats.killsSinceDmg=0;runStats.dmgThisWave=true;}
    if(this.hp<=0) this.dead=true;
  }

  draw() {
    const col = this.arch ? this.arch.color : ((meta&&meta.unlocks&&meta.unlocks.skin&&SKINS[meta.unlocks.skin])||this.c.color);   // архетип перекрашивает героя в свой цвет (Идея 3: косметика-скин — до архетипа)
    if(this.invTimer>0 && Math.floor(this.invTimer*10)%2===0) return;
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(this.x,this.y+16,14,5,0,0,Math.PI*2); ctx.fill();
    if(this.shieldHp>0){const sf=this.shieldHp/this.shieldMax,sa=Date.now()/400;ctx.globalAlpha=0.5+Math.sin(sa)*0.18;ctx.strokeStyle='#6699ff';ctx.lineWidth=4;ctx.shadowColor='#88aaff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(this.x,this.y,this.r+11,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1;const bw2=44,bx2=this.x-bw2/2,by2=this.y-this.r-23;ctx.fillStyle='#001133';ctx.fillRect(bx2,by2,bw2,3);ctx.fillStyle='#4488ff';ctx.fillRect(bx2,by2,bw2*sf,3);}
    if(this.eagleCharges>0){ctx.shadowColor='#ffee44';ctx.shadowBlur=28;ctx.strokeStyle='rgba(255,238,68,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.r+8,0,Math.PI*2);ctx.stroke();}
    // Гуманоидный облик героя (редизайн 2026-06-19) — фигура+оружие+анимация; фолбэк = круг
    try{ drawHeroBody(ctx, this, col, Date.now()/1000); }
    catch(_e){ ctx.shadowColor=col; ctx.shadowBlur=14; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); }
    ctx.shadowBlur=0;
    if(this.stunT>0){ const sa=Date.now()/120; ctx.strokeStyle='#ffee44'; ctx.lineWidth=2.5; ctx.globalAlpha=0.55+Math.sin(Date.now()/90)*0.3; ctx.beginPath(); ctx.arc(this.x,this.y,this.r+9,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; ctx.fillStyle='#ffee44'; ctx.font='bold 11px Segoe UI'; ctx.textAlign='center'; for(let i=0;i<4;i++){ const a=sa+i/4*Math.PI*2; ctx.fillText('⚡', this.x+Math.cos(a)*(this.r+15), this.y-this.r-7+Math.sin(a)*5); } ctx.textAlign='left'; }   // визуал оглушения (поверх фигуры)

    const bw=44,bh=5,bx=this.x-bw/2,by=this.y-this.r-15;
    ctx.fillStyle='#330000';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=this.hp>this.maxHp*0.5?'#00cc44':this.hp>this.maxHp*0.25?'#ffaa00':'#ff2200';
    ctx.fillRect(bx,by,bw*(this.hp/this.maxHp),bh);
    ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);

    if(this.qTimer>0){ctx.strokeStyle='rgba(200,180,255,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.r+6,-Math.PI/2,-Math.PI/2+(1-this.qTimer/(this.c.qCd*this.qCdM))*Math.PI*2);ctx.stroke();}
  }
}

class Enemy {
  constructor(typeId, x, y, hpMult=1, dmgScale=1) {
    const t=ET[typeId]; this.typeId=typeId; this.t=t;
    const _M=(typeof MODS!=='undefined')?MODS:{spd:1,hp:1,dmg:1};   // вехи: глобальные модификаторы монстров
    const scaledHp=Math.round(t.hp*hpMult*(_M.hp||1));
    this.x=x;this.y=y;this.hp=scaledHp;this.maxHp=scaledHp;this.r=t.r;this.spd=t.spd*(_M.spd||1);
    this.dmg=Math.round(t.dmg*dmgScale*(_M.dmg||1));   // F3: урон растёт по волнам + вехи
    this.atkTimer=Math.random()*t.atkCd; this.dead=false; this.xp=Math.max(t.xp, Math.round(scaledHp*0.09)); this.flash=0;  // #2: опыт растёт с ХП (боссы/Проклятые дают больше)
    this.slow=0; this.wobble=Math.random()*Math.PI*2;
    this.poison=0; this.poisonT=0;   // лучник: яд (DoT)
    this.phase=1; this.bossTimer=3; this.dmgMult=1;
    this.roam=false; this.wx=x; this.wy=y; this.aggroR=430;   // F5: роуминг в открытом мире
    this.gen=0;                                                // поколение (слизень делится)
    this.specTimer=1.2+Math.random()*2.2;                      // таймер спецспособностей
    this.chState='idle'; this.chT=0; this.chVx=0; this.chVy=0; // состояние рывка (носорог)
    this.born=(typeof performance!=='undefined')?performance.now():0; this.summoned=false; // Идея 1: трекинг
    this.bA=2.5+Math.random()*2; this.bB=4+Math.random()*2; this.bC=8; this.bD=20; this.eShield=(typeof MODS!=='undefined'&&MODS.shield&&!t.boss)?Math.round(this.maxHp*0.12):0; this.boltT=0; this.didSplit=false; this.invuln=false; // боссы (идея 5) + веха «обереги»
    this.face=Math.random()*Math.PI*2; this.swingT=0; this.reflectCd=0; this.baseSpd=this.spd; this.baseDmg=this.dmg; this.mirrorCol=(typeof player!=='undefined'&&player&&player.c)?player.c.color:'#dd66dd'; this.stunT=0;   // элиты + оглушение
    this.tgT=0; this.tgMax=0.6; this.tgR=0; this.tgDmg=0; this.tgChill=0; this.tgShake=0;   // телеграф тяжёлой AoE-атаки (windup)
    this.spawnT=0; this._ambT=Math.random()*0.6;   // редизайн облика: материализация спавна + эмбиент-частицы
    this.flinchX=0; this.flinchY=0;   // визуальная отдача при попадании (не влияет на позицию/ИИ)
  }
  hit(dmg, parts, src='atk', crit=false) {
    if(this.invuln){ for(let i=0;i<3;i++)parts.push(new Particle(this.x,this.y,(Math.random()-.5)*100,(Math.random()-.5)*100,'#aaffcc',0.3,2)); return; }   // Лич: щит-неуязвимость
    if(typeof player!=='undefined'&&player){   // Идея 2: оружейные модификаторы
      if(player.bossDmgM>0&&(this.t.boss||this.typeId==='cursed'))dmg*=1+player.bossDmgM;
      if(player.onHitBurn>0&&Math.random()<player.onHitBurn)dmg*=1.5;
      if(player.onHitFreeze>0&&Math.random()<player.onHitFreeze)this.slow=Math.max(this.slow,1.2);
      if(player.arrowPoison>0){this.poison=Math.max(this.poison, player.c.dmg*player.dmgM*player.arrowPoison);this.poisonT=3;}  // лучник: яд при попадании
      if(this.t.frontshield){ const fa=Math.atan2(player.y-this.y,player.x-this.x); if(Math.abs(normA(fa-this.face))<Math.PI/2){ dmg*=0.18; for(let i=0;i<3;i++)parts.push(new Particle(this.x+Math.cos(this.face)*this.r,this.y+Math.sin(this.face)*this.r,(Math.random()-.5)*90,(Math.random()-.5)*90,'#ccccff',0.3,2)); } }   // Осквернённый рыцарь: блок по фронту
      if(this.t.reflect&&dist(this,player)>92&&this.reflectCd<=0){ this.reflectCd=0.45; player.takeDamage(Math.round(dmg*0.3)); for(let i=0;i<4;i++)parts.push(new Particle(this.x,this.y,(Math.random()-.5)*150,(Math.random()-.5)*150,'#88ddff',0.3,2)); }   // Кристаллический голем: отражает дальний урон
      if(player.voidT>0) dmg*=0.6;   // Аватар Бездны: герой в зоне тьмы бьёт слабее
    }
    let isCrit = (crit===true);
    if(crit==='roll' && typeof player!=='undefined' && player && Math.random()<(player.c.critChance+player.critBonus)) isCrit=true;
    if(isCrit && crit!==true){ dmg*=2.5; track('crit_hits'); }   // умения тоже могут крит.
    if(this.eShield>0){ const ab=Math.min(this.eShield,dmg); this.eShield-=ab; dmg-=ab; for(let i=0;i<3;i++)parts.push(new Particle(this.x,this.y,(Math.random()-.5)*120,(Math.random()-.5)*120,'#88ccff',0.3,2)); if(dmg<=0)return; }   // Голем-Владыка: щит поглощает урон
    this.hp-=dmg; this.flash=0.14;
    if(typeof player!=='undefined'&&player){ const _a=Math.atan2(this.y-player.y,this.x-player.x), _kb=this.t.boss?2.5:(this.t.elite?4.5:7.5); this.flinchX=Math.cos(_a)*_kb; this.flinchY=Math.sin(_a)*_kb; }   // визуальная отдача от источника
    track('total_dmg_dealt', Math.floor(dmg)); if(typeof runStats!=='undefined'&&runStats)runStats.dmg=(runStats.dmg||0)+Math.floor(dmg);
    if(typeof floats!=='undefined' && (src==='q'||src==='e'||src==='r'||src==='x'||src==='passive'||isCrit)){ floats.push(new FloatText(this.x+(Math.random()-.5)*10,this.y-12,(isCrit?'✦':'')+Math.round(dmg),isCrit?'#ffffff':'#ffd060',isCrit?16:11)); }   // #2: цифры урона умений (+крит)
    if(typeof SFX!=='undefined'){ if(isCrit)SFX.play('crit'); else SFX.play('hit'); }
    for(let i=0;i<5;i++) parts.push(new Particle(this.x,this.y,(Math.random()-.5)*180,(Math.random()-.5)*180,'#ffaaaa',0.35,2));
    if(this.hp<=0){this.hp=0;this.dead=true;try{MFX.death(this.typeId,this.x,this.y,this.r,parts,this.t.color);}catch(_e){for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2,s=110+Math.random()*160;parts.push(new Particle(this.x,this.y,Math.cos(a)*s,Math.sin(a)*s,this.t.color,0.8,3+Math.random()*3));}}
      // Идея 1: трекинг убийства
      track('kills_total'); track('kills_'+this.typeId);
      if(typeof runStats!=='undefined'&&runStats){ runStats.kills=(runStats.kills||0)+1; if(this.t.boss)runStats.bossKills=(runStats.bossKills||0)+1; }   // #3: счётчики забега
      if(typeof SFX!=='undefined')SFX.play('enemyDie');
      if(typeof player!=='undefined'&&player){ track('kills_as_'+player.classId); if(player.shieldHp>0)track('kills_while_shielded'); }
      if(this.slow>0) track('kills_on_frozen');
      if(this.summoned) track('summoner_minions_killed');
      if(this.t.splitter&&this.gen>=1) track('splitter_spawn_kills');
      if(src==='q'||src==='e'||src==='r'||src==='x'||src==='passive') track('kills_by_'+src);
      if(this.typeId==='troll'&&this.born&&performance.now()-this.born<30000) track('troll_fast_kills');
      if(this.typeId==='cursed'&&runStats){ runStats.cursed=(runStats.cursed||0)+1; trackMax('cursed_in_one_run',runStats.cursed); }
      if(runStats){ runStats.killsSinceDmg=(runStats.killsSinceDmg||0)+1; trackMax('nohit_kill_streak',runStats.killsSinceDmg); }
      comboKill();
      // Идея 2: дроп лута (18.7% на каждый из 4 слотов)
      if(this.t.boss){addShake(12);hitStopFor(0.1);track('kills_boss');   // золото — только за вехи (см. milestoneReached)
        if(typeof drops!=='undefined'&&drops.length<60){const sk=slotKeys()[Math.floor(Math.random()*slotKeys().length)];const ri=rollRarityBoss();const it={slot:sk,rarity:ri,affixes:genAffixes(sk,ri,Math.max(wave,1)),ilvl:Math.max(wave,1),sharpen:0};it.score=itemScore(it);drops.push(new Drop(this.x,this.y,it));}}   // идея 5: награда босса (золото+лут, Божественный ~1.5%)
      else if(this.typeId==='cursed'){addShake(10);hitStopFor(0.08);}
      if(typeof player!=='undefined'&&player&&drops.length<60){for(const sk of slotKeys()){if(Math.random()<devDropChance())drops.push(new Drop(this.x+(Math.random()-.5)*22,this.y+(Math.random()-.5)*22,rollItem(sk,Math.max(wave,1),devLuck(player))));}}
      // Чумной носитель: облако заразы при смерти
      if(this.t.plague&&typeof groundFX!=='undefined'){groundFX.push({x:this.x,y:this.y,r:90,life:5,max:5,kind:'poison'});rings.push(new Ring(this.x,this.y,'#88cc33',90));}
      // веха «Взрывная кровь»: чафф взрывается при смерти
      if(typeof MODS!=='undefined'&&MODS.volatile&&!this.t.boss&&!this.t.bomber){rings.push(new Ring(this.x,this.y,'#cc66ff',72));if(typeof player!=='undefined'&&player&&dist(this,player)<72)player.takeDamage(Math.round(this.dmg*0.7));for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2;parts.push(new Particle(this.x,this.y,Math.cos(a)*140,Math.sin(a)*140,'#cc66ff',0.5,3));}}
      // Взрывун: взрыв по игроку при смерти

let MODS={spd:1,hp:1,dmg:1,shield:false,volatile:false,dense:false,regen:false}, mTier=0;

  {n:'⚡ Ускорение',f:m=>{m.spd*=1.12;}},

function milestoneReached(tier,x,y){ if(tier<=mTier)return; mTier=tier;

  let label; if(tier<=MILE_LADDER.length){ MILE_LADDER[tier-1].f(MODS); label=MILE_LADDER[tier-1].n; }
  else { MODS.spd*=1.05; MODS.hp*=1.12; MODS.dmg*=1.10; label='🔺 Эскалация'; }
  announce={show:true,timer:3.2,text:`⚠ ВЕХА ${tier} · +${gold}🪙`,sub:label+' — монстры усилены'};
  if(typeof SFX!=='undefined')SFX.play('boss'); if(typeof MUSIC!=='undefined'&&MUSIC.onThreatRise)MUSIC.onThreatRise();
}
const ELITES=['corruptknight','plaguebearer','berserker','mirror','voidavatar','crystalgolem','reaper'];   // элиты (ХП уровня Проклятого)
function buildWave(n) {
  if(n%10===0){return [{id:'golemlord',cnt:1},{id:'goblin',cnt:Math.floor(n*.4)},{id:'skeleton',cnt:Math.floor(n*.3)},...(n>=20?[{id:'cursed',cnt:1}]:[])];}   // мега-босс Голем-Владыка на каждой 10-й волне (только 1)
  if(n%5===0){const BOSSES=['troll','lich','titan','frostlord'];const bid=BOSSES[Math.floor(n/5-1)%4];return [{id:bid,cnt:1},{id:'goblin',cnt:n},{id:'skeleton',cnt:Math.floor(n/2)},...(n>=15?[{id:'golem',cnt:1}]:[]),...(n>=20?[{id:'cursed',cnt:1}]:[])];}
  if(n===1) return [{id:'goblin',cnt:5}];
  if(n<=3)  return [{id:'goblin',cnt:3+n*2},...(n>=3?[{id:'splitter',cnt:2}]:[])];
  if(n<=5)  return [{id:'goblin',cnt:2+n},{id:'skeleton',cnt:n-1},{id:'banshee',cnt:2},...(n>=4?[{id:'bomber',cnt:2},{id:'charger',cnt:1}]:[])];
  if(n<=8)  return [{id:'goblin',cnt:3+Math.floor(n*.4)},{id:'skeleton',cnt:Math.floor(n*.5)},{id:'darkmage',cnt:Math.floor(n*.25)},{id:'banshee',cnt:2},{id:'wraith',cnt:1},{id:'charger',cnt:2},{id:'spitter',cnt:1}];
  return [{id:'goblin',cnt:3+Math.floor(n*.4)},{id:'skeleton',cnt:Math.floor(n*.45)},{id:'darkmage',cnt:Math.floor(n*.2)},{id:'banshee',cnt:Math.floor(n*.2)},{id:'wraith',cnt:Math.floor(n*.12)},{id:'charger',cnt:Math.floor(n*.12)},{id:'splitter',cnt:Math.floor(n*.12)},{id:'bomber',cnt:Math.floor(n*.1)},{id:'spitter',cnt:Math.floor(n*.1)},{id:'healer',cnt:1},{id:'phantom',cnt:Math.floor(n*.08)},...(n>=12?[{id:'golem',cnt:Math.floor(n*.1)},{id:'summoner',cnt:1}]:[]),...(n>=8?Array.from({length:Math.min(4,1+Math.floor((n-8)/4))},(_,k)=>({id:ELITES[(n+k*2)%7],cnt:1})):[])];   // плотность ↑ + элиты с 8-й волны, 1→4 растёт
}
const SP=[{x:55,y:50},{x:745,y:50},{x:55,y:550},{x:745,y:550},{x:400,y:38},{x:400,y:562},{x:38,y:300},{x:762,y:300}];
function spawnWave(n){const hpMult=1+0.08*(n-1);const dmgScale=Math.min(3.2,Math.pow(1.045,n-1));const dm=(typeof MODS!=='undefined'&&MODS.dense)?1.4:1;const list=[];let si=0;buildWave(n).forEach(d=>{const cnt=Math.round(d.cnt*(d.id==='golemlord'||ET[d.id].boss?1:dm));for(let i=0;i<cnt;i++){const s=SP[si%SP.length];list.push(new Enemy(d.id,s.x+(Math.random()-.5)*38,s.y+(Math.random()-.5)*38,hpMult,dmgScale));si++;}});return list;}

// ── F5: спавн в открытом мире — монстры роумят по карте, угроза растёт со временем ──
function pickOwEnemy(){
  const w=wave,pool=[['goblin',5],['skeleton',w>=2?4:2]];
  if(w>=2)pool.push(['splitter',3],['bomber',2]);
  if(w>=3)pool.push(['banshee',3],['darkmage',2],['charger',2]);
  if(w>=4)pool.push(['wraith',2],['golem',2],['spitter',2]);
  if(w>=5)pool.push(['cursed',1],['phantom',2],['healer',1]);     // F7: Проклятые с 5-й волны угрозы
  if(w>=6)pool.push(['troll',1],['summoner',1]);
  if(w>=5)pool.push(['corruptknight',2],['plaguebearer',2],['berserker',2],['mirror',2],['voidavatar',2],['crystalgolem',2],['reaper',2]);   // элиты-роумеры (чаще)
  if(w>=8)pool.push(['lich',1],['titan',1],['frostlord',1]);   // боссы-роумеры на высокой угрозе (редко)
  const total=pool.reduce((s,p)=>s+p[1],0);let r=Math.random()*total;
  for(const[id,wt]of pool){r-=wt;if(r<=0)return id;}
  return 'goblin';
}
function spawnRoamer(){

  const a=Math.random()*Math.PI*2, rd=480+Math.random()*320;
  const x=clamp(player.x+Math.cos(a)*rd,40,worldW-40), y=clamp(player.y+Math.sin(a)*rd,40,worldH-40);
  const hpMult=1+0.08*(wave-1),dmgScale=Math.min(3.2,Math.pow(1.045,wave-1));
  const e=new Enemy(pickOwEnemy(),x,y,hpMult,dmgScale);
  e.roam=true;e.wx=x;e.wy=y;
  enemies.push(e);
}
function owSpawnTick(dt){
  owThreatT+=dt;
  if(owThreatT>=22){owThreatT=0;wave++;trackMax('max_threat_ow',wave);if(wave===15)track('ow_threat_peaks');if(wave%5===0){milestoneReached(wave/5,player?player.x:400,player?player.y:140);}else{announce={show:true,timer:2.2,text:`⚠ Угроза возросла (ур. ${wave})`,sub:'Врагов больше, и они сильнее'};}if(typeof MUSIC!=='undefined')MUSIC.onThreatRise();
    if(wave%7===0&&!enemies.some(e=>e.typeId==='golemlord')){const a=Math.random()*Math.PI*2,rd=560;const gx=clamp(player.x+Math.cos(a)*rd,40,worldW-40),gy=clamp(player.y+Math.sin(a)*rd,40,worldH-40);const gl=new Enemy('golemlord',gx,gy,1+0.08*(wave-1),Math.pow(1.032,wave-1));gl.roam=true;gl.wx=gx;gl.wy=gy;enemies.push(gl);announce={show:true,timer:2.6,text:'👑 ГОЛЕМ-ВЛАДЫКА ПРОБУДИЛСЯ',sub:'Адский главарь вышел на охоту'};if(typeof SFX!=='undefined')SFX.play('boss');}   // мега-босс на угрозе 7/14/21… (только 1 на карте)
  }
  const cap=Math.min(240,54+wave*13);   // item5: плотность ↑ (кап 240; при просадке fps вернуть 220)
  owSpawnT-=dt;
  if(owSpawnT<=0&&enemies.length<cap){
    owSpawnT=Math.max(0.45,1.9-wave*0.11);
    const batch=(1+Math.floor(Math.random()*2)+Math.floor(wave/3))*3;
    for(let i=0;i<batch&&enemies.length<cap;i++)spawnRoamer();
  }
}

function triggerArchetypeSelect(){

function triggerLevelup(){
  if(player.level>=15 && !player.archetype){ triggerArchetypeSelect(); return; }   // архетипы: 15 ур. — обязательный выбор вместо обычной карточки
  if(state==='levelup'||state==='archsel'){levelupQueue++;return;}
  const tree = player.arch ? ARCH_UPGRADE_POOL : SKILL_TREES[player.classId];   // после архетипа — генерик-пул (репитабл), до — базовое дерево класса
  let avail = player.arch ? tree : tree.filter(u=>!player.takenSkills.has(u.id)&&(!u.req||player.takenSkills.has(u.req)));
  if(!player.arch && avail.length===0) avail=ARCH_UPGRADE_POOL.filter(u=>!u.archOnly);   // «верен классу»: дерево исчерпано → генерик-пул (без арх-специфичных карт)

}

function bgFX(B,t){

function drawTorch(x,y){

function drawThreatArrows(){
  if(gameMode!=='openworld'||!player||typeof enemies==='undefined')return;
  ctx.save();
  for(const e of enemies){ if(e.dead||!(e.t.boss||e.t.elite))continue;
    const sx=e.x-camX, sy=e.y-camY, m=24;
    if(sx>=m&&sx<=800-m&&sy>=m&&sy<=600-m)continue;   // уже на экране
    const ax=clamp(sx,m,800-m), ay=clamp(sy,m,600-m), a=Math.atan2(sy-300,sx-400);
    const col=(typeof E_ROLECOL!=='undefined'&&typeof E_ROLE!=='undefined')?(E_ROLECOL[E_ROLE[e.typeId]]||e.t.color):e.t.color;
    const sz=e.t.boss?16:12;
    ctx.save(); ctx.translate(ax,ay); ctx.rotate(a);
    ctx.shadowColor=col; ctx.shadowBlur=12; ctx.fillStyle=col; ctx.globalAlpha=0.8+0.2*Math.sin(Date.now()/200);
    ctx.beginPath(); ctx.moveTo(sz,0); ctx.lineTo(-sz*0.55,-sz*0.6); ctx.lineTo(-sz*0.55,sz*0.6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1; ctx.restore();
}
