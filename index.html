<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AVALO">
<meta name="theme-color" content="#050508">
<title>AVALO — Action RPG</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; }
body { background: #050508; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none; }
/* редизайн 2026-06-19: широкий экран 16:9 (внутреннее разрешение 1280×720); мобильная адаптация 2026-07-05 */
canvas { display: block; border: 2px solid #2a2535; box-shadow: 0 0 40px rgba(100,50,200,0.3); width: min(96vw, 160vh); height: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; touch-action: none; }
#ctrl { color: #666; font-size: clamp(9px, 1.4vh, 13px); margin-top: 8px; letter-spacing: 0.4px; text-align: center; }
/* Мобильный / тач-экран: канвас letterbox'ится на весь вьюпорт, десктоп-подсказка скрыта */
@media (pointer: coarse), (max-width: 820px) {
  #ctrl { display: none; }
  canvas { border: none; box-shadow: none; width: min(100vw, 177.7vh); width: min(100dvw, 177.7dvh); }
}
/* Портрет на телефоне: игра ОСТАЁТСЯ видимой (letterbox по ширине); подсказка — компактный НЕблокирующий
   нижний баннер. НЕ прячем канвас (иначе при блокировке автоповорота телефон навсегда застревал на плашке). */
#rotate { display: none; position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 30; padding: 8px 10px; background: rgba(14,10,24,0.92); border: 1px solid #3a3454; border-radius: 8px; align-items: center; gap: 10px; }
#rotate .ico { font-size: 22px; animation: rot 2.4s ease-in-out infinite; }
#rotate .txt { font-size: 11.5px; color: #b39cff; line-height: 1.35; flex: 1; }
#rotate .fs { font-size: 12px; font-weight: bold; color: #0a0814; background: #ffcc44; border: none; border-radius: 6px; padding: 8px 10px; white-space: nowrap; }
@keyframes rot { 0%,45% { transform: rotate(0deg); } 60%,100% { transform: rotate(-90deg); } }
@media (pointer: coarse) and (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div id="rotate"><span class="ico">📱</span><span class="txt">Поверни в ландшафт для полного экрана. Играть можно и так.</span><button class="fs" id="rotfs">⛶ Во весь экран</button></div>
<div id="ctrl">WASD — движение &nbsp;|&nbsp; ЛКМ — атака &nbsp;|&nbsp; Q / E / R — умения &nbsp;|&nbsp; X — X-способность (Lv10) &nbsp;|&nbsp; P — пауза &nbsp;|&nbsp; M — звук &nbsp;|&nbsp; 📱 тач: левый стик — движение, правый — прицел/огонь, кнопки умений справа</div>
<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
// ── Мобильный фуллскрин + автоповорот (2026-07-05): по первому касанию прячем адресную строку и
//    поворачиваем в ландшафт (Android). iOS не поддерживает — там игра просто остаётся играбельной. ──
(function(){ let fsDone=false;
  function lockLandscape(){ try{ if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){}); }catch(e){} }
  function goFullscreen(){ const el=document.documentElement, rq=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen; if(rq){ try{ const p=rq.call(el); if(p&&p.then)p.then(lockLandscape,lockLandscape); else setTimeout(lockLandscape,60); }catch(e){ lockLandscape(); } } else lockLandscape(); }
  function firstGesture(){ if(fsDone)return; fsDone=true; if(window.matchMedia&&matchMedia('(pointer: coarse)').matches)goFullscreen(); }
  window.addEventListener('touchend',firstGesture,{passive:true});
  window.addEventListener('mousedown',firstGesture);
  const b=document.getElementById('rotfs'); if(b)b.addEventListener('click',function(e){ e.stopPropagation(); fsDone=true; goFullscreen(); });
})();
// ── Редизайн 2026-06-19: широкий экран ──────────────────────────────────────
// VW×VH — канвас (1280×720). Все МЕНЮ-экраны остаются свёрстанными в 800×600 и
// рендерятся через UI-слой (uiBegin/uiEnd) по центру с масштабом UI_S; мышь для
// них конвертируется на входе — хит-боксы кликов не меняются.
const VW=1280, VH=720;
// ── Адаптивная графика (2026-07-08): на тач-устройствах меньше пикселей рендера + без теней + кап частиц ──
// Координаты игры всегда в VW×VH; бэкинг-стор канваса меньше (RQ), базовый transform в loop() масштабирует.
const IS_TOUCH = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);
let RQ = IS_TOUCH ? 0.8 : 1;                    // масштаб бэкинг-стора рендера (0.8 = 64% пикселей)
const PART_CAP = IS_TOUCH ? 140 : 500;          // жёсткий кап числа частиц
function applyRenderScale(){ canvas.width = Math.round(VW*RQ); canvas.height = Math.round(VH*RQ); }
applyRenderScale();
if(IS_TOUCH){ try{ Object.defineProperty(ctx,'shadowBlur',{configurable:true,get:function(){return 0;},set:function(){}}); }catch(e){} }   // shadowBlur в 5–10× дороже на моб. GPU — глушим (глоу пропадает, читаемость остаётся)
const UI_S=Math.min(VW/800,VH/600), UI_OX=Math.round((VW-800*UI_S)/2), UI_OY=Math.round((VH-600*UI_S)/2);
function uiState(){ return state==='menu'||state==='select'||state==='achievements'||state==='forge'||state==='bestiary'||state==='levelup'||state==='archsel'||state==='gameover'||state==='victory'||state==='skilltree'||state==='trials'||state==='event'; }
function uiBegin(){ ctx.save(); ctx.translate(UI_OX,UI_OY); ctx.scale(UI_S,UI_S); }
function uiEnd(){ ctx.restore(); }
function uiGutters(){ ctx.fillStyle='#050508'; ctx.fillRect(0,0,VW,VH); if(typeof drawPxGutters==='function')drawPxGutters(); }
const MENU_BG=new Image(); MENU_BG.src='assets/menu_splash.jpg';   // сплэш главного меню (арт из ChatGPT)

// ── Input ──────────────────────────────────────────────────────────────────
const keys = {};
const mouse = { x: 400, y: 300, down: false, clicked: false };
canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = (e.clientX - r.left)/r.width*VW; mouse.y = (e.clientY - r.top)/r.height*VH; if(uiState()){ mouse.x=(mouse.x-UI_OX)/UI_S; mouse.y=(mouse.y-UI_OY)/UI_S; } });   // координаты всегда в VW×VH (не в бэкинг-пикселях)
canvas.addEventListener('mousedown', () => { if(typeof SFX!=='undefined')SFX.ensure(); if(typeof MUSIC!=='undefined')MUSIC.ensure(); mouse.down = true; mouse.clicked = true; });
canvas.addEventListener('mouseup', () => { mouse.down = false; });
document.addEventListener('keydown', e => { if(typeof SFX!=='undefined')SFX.ensure(); if(typeof MUSIC!=='undefined')MUSIC.ensure(); keys[e.key.toLowerCase()] = true; if(e.key==='Escape'&&state==='play'&&!paused&&typeof TUT!=='undefined'&&TUT&&!TUT.done){tutSkip();} else if ('pP'.includes(e.key) || e.key === 'Escape') togglePause(); if((e.key==='i'||e.key==='I'||e.key==='ш'||e.key==='Ш')&&state==='play')showInv=!showInv;
  if(e.key==='m'||e.key==='M'||e.key==='ь'||e.key==='Ь'){ if(typeof SFX!=='undefined')SFX.toggle(); }
  if(DEV&&state==='play'){ if(e.key==='-')devXp=Math.max(2,devXp-2); else if(e.key==='=')devXp+=2; else if(e.key==='[')devDrop=Math.max(1,devDrop-1); else if(e.key===']')devDrop+=1; XP_RATE=devXp; }
  if(gameMode==='testroom'&&state==='play'){   // 🧪 горячие клавиши тренировки
    if(e.key==='k'||e.key==='K'||e.key==='л'||e.key==='Л'){ state='select'; }   // сменить класс/архетип
    else if(e.key==='l'||e.key==='L'||e.key==='д'||e.key==='Д'){ player.level++; player.maxHp+=5; player.hp=Math.min(player.maxHp,player.hp+5); player.xpNext=xpForLevel(player.level); triggerLevelup(); }   // +1 уровень → карточка апгрейда
    else if(e.key==='u'||e.key==='U'||e.key==='г'||e.key==='Г'){   // взять ВСЕ апгрейды разом
      let n=0;
      if(player.arch){ ARCH_UPGRADE_POOL.forEach(u=>{u.apply(player);n++;}); (player.arch.upgrades||[]).forEach(u=>{ if(!player.takenSkills.has(u.id)){u.apply(player);player.takenSkills.add(u.id);n++;} }); }
      else { let av; while((av=SKILL_TREES[player.classId].filter(u=>!player.takenSkills.has(u.id)&&(!u.req||player.takenSkills.has(u.req)))).length){ av.forEach(u=>{u.apply(player);player.takenSkills.add(u.id);n++;}); } }
      achToasts.push({txt:'🧪 Применено апгрейдов: '+n,perk:player.arch?'полный сет пула (×1)':'всё дерево класса',t:3,col:'#88dd88'}); if(achToasts.length>5)achToasts.shift();
    }
    else if(e.key==='Tab'){ trInfo=!trInfo; }   // инфо-панель умений
  }
  e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ── Звук (Web Audio, синтез, негромкий; без ассетов) ─────────────────────────
const SFX = (function(){
  let ctx=null, master=null, comp=null, enabled=true, started=false; const last={};
  function init(){ if(started)return; started=true; try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; ctx=new AC(); comp=ctx.createDynamicsCompressor(); master=ctx.createGain(); master.gain.value=0.4; comp.connect(master); master.connect(ctx.destination); enabled=!(typeof meta!=='undefined'&&meta&&meta.muted); }catch(e){ ctx=null; } }
  function resume(){ if(ctx&&ctx.state==='suspended')ctx.resume(); }
  function gate(k,ms){ const n=(typeof performance!=='undefined')?performance.now():Date.now(); if(last[k]&&n-last[k]<ms)return false; last[k]=n; return true; }
  function env(node,t,vol,dur){ const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); node.connect(g); g.connect(comp); }
  function tone(type,f1,f2,vol,dur,lp){ if(!ctx||!enabled)return; const t=ctx.currentTime; const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f1,t); if(f2!=null)o.frequency.exponentialRampToValueAtTime(Math.max(1,f2),t+dur); let n=o; if(lp){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;o.connect(f);n=f;} env(n,t,vol,dur); o.start(t); o.stop(t+dur+0.03); }
  function noise(vol,dur,lp){ if(!ctx||!enabled)return; const t=ctx.currentTime,len=Math.max(1,Math.floor(ctx.sampleRate*dur)); const b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||1000; s.connect(f); env(f,t,vol,dur); s.start(t); s.stop(t+dur+0.02); }
  function chord(fs,vol,dur){ fs.forEach((f,i)=>setTimeout(()=>tone('sine',f,f,vol,dur,4000),i*70)); }
  const BOSS_F={troll:105,lich:88,titan:72,frostlord:96,golemlord:58};   // базовая высота рёва по боссу (мега-босс — самый низкий)
  const map={
    swing:()=>{ if(gate('swing',55))noise(0.04,0.09,1500); },
    shot:()=>{ if(gate('shot',40))tone('sine',680,300,0.04,0.08,3000); },
    hit:()=>{ if(gate('hit',45))noise(0.03,0.05,1000); },
    crit:()=>{ if(gate('crit',55))tone('triangle',880,1300,0.055,0.13,5000); },
    enemyDie:()=>{ if(gate('die',55))tone('triangle',240,90,0.05,0.13,2000); },
    hurt:()=>{ if(gate('hurt',110))tone('sine',200,90,0.09,0.18,1200); },
    q:()=>tone('triangle',520,760,0.055,0.16,3500),
    e:()=>tone('sine',440,660,0.055,0.18,3000),
    r:()=>tone('sawtooth',180,520,0.04,0.22,1400),
    x:()=>{ tone('sine',150,90,0.07,0.34,800); noise(0.045,0.24,520); },
    levelup:()=>chord([523,659,784,1047],0.055,0.3),
    pickup:()=>tone('triangle',880,1320,0.045,0.1,4000),
    gold:()=>{ if(gate('gold',60))tone('square',1200,1600,0.028,0.07,5000); },
    wave:()=>chord([392,494,587],0.05,0.25),
    boss:()=>{ if(!gate('boss',700))return; tone('sawtooth',110,70,0.07,0.6,600); tone('sine',55,42,0.06,0.7,300); },   // троттлинг: массовые стаки берсерк-баффа не спамят рёв
    explosion:()=>{ if(gate('expl',55)){ noise(0.065,0.22,700); tone('sine',120,50,0.055,0.25,400); } },
    ui:()=>{ if(gate('ui',40))tone('sine',520,520,0.04,0.05,3000); },
    // ── голоса питомцев (Minion): троттлинг-gate спасает от спама при массовом призыве ──
    petWolf:()=>{ if(!gate('petWolf',700)||!ctx)return; const t=ctx.currentTime;   // вой: нисходящее глиссандо синуса + вибрато-LFO
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(560,t); o.frequency.exponentialRampToValueAtTime(240,t+0.75);
      const lfo=ctx.createOscillator(),lg=ctx.createGain(); lfo.frequency.value=5.5; lg.gain.value=14; lfo.connect(lg); lg.connect(o.frequency);
      const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1800; o.connect(f);
      env(f,t,0.11,0.8); o.start(t); o.stop(t+0.85); lfo.start(t); lfo.stop(t+0.85); },
    petFox:()=>{ if(gate('petFox',500)){ tone('triangle',1250,950,0.10,0.07,4500); setTimeout(()=>tone('triangle',1350,1000,0.09,0.06,4500),90); } },   // тявк: короткий писк ×2
    petBear:()=>{ if(gate('petBear',800)){ tone('sawtooth',110,55,0.14,0.5,480); noise(0.08,0.35,420); } },   // рык: низкая пила + шум
    petFalcon:()=>{ if(gate('petFalcon',600))for(let i=0;i<3;i++)setTimeout(()=>tone('sine',1700+i*220,2400+i*220,0.09,0.055,3800),i*70); },   // клёкот: 3 быстрых чирпа вверх
    petSpirit:()=>{ if(!gate('petSpirit',600)||!ctx)return; const t=ctx.currentTime,dur=0.5,len=Math.max(1,Math.floor(ctx.sampleRate*dur));   // шёпот: свист из шума (bandpass-свип)
      const b=ctx.createBuffer(1,len,ctx.sampleRate),d=b.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const s=ctx.createBufferSource(); s.buffer=b; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.Q.value=14;
      f.frequency.setValueAtTime(850,t); f.frequency.exponentialRampToValueAtTime(1700,t+dur);
      s.connect(f); env(f,t,0.10,dur); s.start(t); s.stop(t+dur+0.02); },
    petGolem:()=>{ if(gate('petGolem',700)){ tone('sine',95,38,0.16,0.28,300); noise(0.07,0.14,260); } },   // топот: глухой низкий удар
    // ── боссы: рёв на спавн (высота по typeId) и аккорд+рёв на смену фазы ──
    bossRoar:(id)=>{ if(!gate('bossRoar',900))return; const F=BOSS_F[id]||95;   // грозный рёв: пила вниз + суб-бас + рокот
      tone('sawtooth',F*1.7,F*0.7,0.16,0.9,700); tone('sine',F*0.6,F*0.4,0.12,1.0,320); noise(0.08,0.5,400); },
    bossPhase:(id)=>{ if(!gate('bossPhase',800))return; const F=BOSS_F[id]||95;   // смена фазы: минорная триада + рёв
      chord([F*1.5,F*1.78,F*2.24],0.11,0.5); tone('sawtooth',F*1.6,F*0.75,0.14,0.7,650); noise(0.06,0.4,500); }
  };
  return { init, resume, ensure(){ init(); resume(); }, play(n,a){ if(!enabled||!ctx)return; const f=map[n]; if(f)f(a); },
    getCtx(){return ctx;}, getComp(){return comp;}, getMaster(){return master;},   // музыка переиспользует тот же граф
    toggle(){ enabled=!enabled; if(typeof meta!=='undefined'&&meta){ meta.muted=!enabled; if(typeof saveSave==='function')saveSave(); } if(enabled)resume(); if(typeof MUSIC!=='undefined')MUSIC.setEnabled(enabled); return enabled; }, isOn(){ return enabled; } };
})();

// ── Музыка (адаптивная, процедурная Web Audio; переиспользует граф SFX; без ассетов) ──
const MUSIC=(function(){
  let ctx=null,comp=null,master=null,mg=null,bedLP=null,delay=null,dlp=null,dfb=null,cave=null,caveG=null;
  let started=false,muted=false,running=false,schedTimer=null;
  const AEO=[0,2,3,5,7,8,10], PHR=[0,1,3,5,7,8,10]; let SCALE=AEO; const ROOT=73.42;   // D2
  // прогрессии: [rootDeg, thirdDeg, fifthDeg] по тактам
  const PROG_AEO=[[0,2,4],[5,0,2],[2,4,6],[6,1,3]];   // Dm – VI – III – VII
  const PROG_PHR=[[0,2,4],[1,3,5],[0,2,4],[4,6,1]];   // Dm – bII – Dm – v (dread)
  let prog=PROG_AEO, victoryBar3=false;
  let state='menu', bpm=64, bpmTarget=64, targetMix=0.12;
  let nextT=0, step=0, beat=0, bar=0;
  let lowHp=false, hbNext=0, hbInt=1.0, duck=1;
  const drone=[], pad=[], choir=[];
  // целевые громкости слоёв по состояниям (ch = ангельский хор)
  // bs = бас-пульс · bl = колокольчики · lu = лютня-менестрель (затишье) · rf = боевой рифф-остинато (бой)
  const MIX={ menu:{dr:.05,pad:.04,arp:0,lead:.08,kick:0,hat:0,ch:.045,bs:0,bl:.05,lu:.06,rf:0,lp:600},
              calm:{dr:.06,pad:.07,arp:.03,lead:.05,kick:0,hat:0,ch:.025,bs:.02,bl:.05,lu:.085,rf:0,lp:1100},
              combat:{dr:.09,pad:.085,arp:.05,lead:0,kick:.07,hat:.04,ch:.06,bs:.07,bl:0,lu:0,rf:.075,lp:4500},
              boss:{dr:.10,pad:.085,arp:.04,lead:.06,kick:.11,hat:.05,ch:.10,bs:.09,bl:0,lu:0,rf:.09,lp:6500},
              lowhp:{dr:.045,pad:.03,arp:.03,lead:0,kick:0,hat:0,ch:.01,bs:0,bl:0,lu:.03,rf:0,lp:700},
              victory:{dr:.07,pad:.08,arp:.05,lead:.09,kick:0,hat:0,ch:.12,bs:.03,bl:.07,lu:.09,rf:0,lp:2000},
              gameover:{dr:.06,pad:.06,arp:0,lead:0,kick:0,hat:0,ch:.03,bs:0,bl:.02,lu:.03,rf:0,lp:200} };
  let curMix=MIX.menu;
  function deg(d,oct){ const i=((d%7)+7)%7, s=SCALE[i]+12*(oct+Math.floor(d/7)); return ROOT*Math.pow(2,s/12); }
  function init(){ if(started)return; started=true;
    try{ ctx=SFX.getCtx?SFX.getCtx():null; if(!ctx)return; comp=SFX.getComp(); master=SFX.getMaster();
      mg=ctx.createGain(); mg.gain.value=0;
      bedLP=ctx.createBiquadFilter(); bedLP.type='lowpass'; bedLP.frequency.value=1100;
      delay=ctx.createDelay(0.6); delay.delayTime.value=0.34; dfb=ctx.createGain(); dfb.gain.value=0.34;
      dlp=ctx.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=2200;
      delay.connect(dlp); dlp.connect(dfb); dfb.connect(delay); dlp.connect(bedLP);
      bedLP.connect(mg); mg.connect(comp);
      // дрон: триангл root + детюн + суб-синус октавой ниже
      for(let i=0;i<2;i++){ const o=ctx.createOscillator(); o.type=i===0?'triangle':'sawtooth'; o.detune.value=i===0?-6:6; const g=ctx.createGain(); g.gain.value=0; o.connect(g); g.connect(bedLP); o.start(); drone.push({o,g}); }
      const sub=ctx.createOscillator(); sub.type='sine'; const sg=ctx.createGain(); sg.gain.value=0; sub.connect(sg); sg.connect(bedLP); sub.start(); drone.push({o:sub,g:sg,sub:true});
      // пэд: 3 голоса (триада октавой выше)
      for(let i=0;i<3;i++){ const o=ctx.createOscillator(); o.type='triangle'; o.detune.value=(i-1)*4; const g=ctx.createGain(); g.gain.value=0; o.connect(g); g.connect(bedLP); o.start(); pad.push({o,g}); }

})();

// ── Мобильное управление (тач): джойстик движения + прицел/огонь + кнопки умений ──
const TOUCH = { enabled:(('ontouchstart' in window)||(navigator.maxTouchPoints>0)), active:false, idMap:{},
  move:{active:false,ox:0,oy:0,nx:0,ny:0,mag:0}, aim:{active:false,ox:0,oy:0,nx:0,ny:0,mag:0,fire:false}, btn:{q:false,e:false,r:false,x:false} };
// мобильные кнопки умений: правый-нижний угол широкого экрана, крупнее (тап-таргеты ≥60px)
const TOUCH_BTN={ r:{x:1130,y:552,rad:34,col:'#cc3399'}, q:{x:1204,y:514,rad:34,col:'#3399ff'}, e:{x:1204,y:590,rad:34,col:'#33cccc'}, x:{x:1130,y:632,rad:38,col:'#aa44ff'} };
function _txy(t){ const r=canvas.getBoundingClientRect(); return { x:(t.clientX-r.left)/r.width*VW, y:(t.clientY-r.top)/r.height*VH }; }   // тач-координаты в VW×VH (не в бэкинг-пикселях)
function _abilAt(x,y){ for(const k in TOUCH_BTN){ const b=TOUCH_BTN[k]; if(Math.hypot(x-b.x,y-b.y)<=b.rad+8) return k; } return null; }
function _joy(j,p){ const R=58; let vx=p.x-j.ox, vy=p.y-j.oy, m=Math.hypot(vx,vy); if(m>R){ vx=vx/m*R; vy=vy/m*R; m=R; } j.nx=vx/R; j.ny=vy/R; j.mag=m/R; }
canvas.addEventListener('touchstart', e=>{ if(typeof SFX!=='undefined')SFX.ensure(); if(typeof MUSIC!=='undefined')MUSIC.ensure(); TOUCH.active=true;
  if(state!=='play'){ const p=_txy(e.changedTouches[0]); mouse.x=p.x; mouse.y=p.y; if(uiState()){ mouse.x=(mouse.x-UI_OX)/UI_S; mouse.y=(mouse.y-UI_OY)/UI_S; } return; }   // в меню — пусть сработает синтетический click (координаты в UI-слое)
  for(const t of e.changedTouches){ const p=_txy(t); const ab=_abilAt(p.x,p.y);
    if(ab){ TOUCH.btn[ab]=true; TOUCH.idMap[t.identifier]=ab; }
    else if(p.x<400){ TOUCH.move.active=true; TOUCH.move.ox=p.x; TOUCH.move.oy=p.y; _joy(TOUCH.move,p); TOUCH.idMap[t.identifier]='move'; }
    else { TOUCH.aim.active=true; TOUCH.aim.ox=p.x; TOUCH.aim.oy=p.y; _joy(TOUCH.aim,p); TOUCH.aim.fire=true; TOUCH.idMap[t.identifier]='aim'; } }
  e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', e=>{ if(state!=='play')return; for(const t of e.changedTouches){ const role=TOUCH.idMap[t.identifier]; if(!role)continue; const p=_txy(t); if(role==='move')_joy(TOUCH.move,p); else if(role==='aim'){ _joy(TOUCH.aim,p); TOUCH.aim.fire=TOUCH.aim.mag>0.25; } } e.preventDefault(); }, {passive:false});
function _touchEnd(e){ for(const t of e.changedTouches){ const role=TOUCH.idMap[t.identifier]; if(!role)continue; if(role==='move'){ TOUCH.move.active=false; TOUCH.move.nx=TOUCH.move.ny=TOUCH.move.mag=0; } else if(role==='aim'){ TOUCH.aim.active=false; TOUCH.aim.fire=false; TOUCH.aim.nx=TOUCH.aim.ny=TOUCH.aim.mag=0; } else TOUCH.btn[role]=false; delete TOUCH.idMap[t.identifier]; } }
canvas.addEventListener('touchend', e=>{ _touchEnd(e); if(state==='play')e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchcancel', _touchEnd);

function wrapText(text, cx, y, maxW, lh) {
  const words = text.split(' '); let line = '';
  for (const w of words) { const t = line + w + ' '; if (ctx.measureText(t).width > maxW && line) { ctx.fillText(line.trim(), cx, y); y += lh; line = w + ' '; } else line = t; }

}

function recomputePerks(){
  const p=zeroPerks(), cp={swordsman:zeroPerks(),wizard:zeroPerks(),archer:zeroPerks()};
  for(const a of ACHIEVEMENTS){ const lvl=(meta.ach[a.id]||{}).lvl||0; if(!lvl)continue;
    const key=PERK_OF[a.rew]; let s=0; for(let i=0;i<lvl;i++) s+=REW[a.rew][i];
    if(a.cls) cp[a.cls][key]+=s; else p[key]+=s;
  }
  for(const k in p) p[k]=Math.min(p[k],PERK_CAP[k]);
  for(const c in cp) for(const k in cp[c]) cp[c][k]=Math.min(cp[c][k],PERK_CAP[k]);
  meta.perks=p; meta.classPerks=cp;
}
function applyMeta(pl){
  if(!meta||!meta.perks)return;
  const g=meta.perks, c=(meta.classPerks&&meta.classPerks[pl.classId])||zeroPerks();
  const v=k=>(g[k]||0)+(c[k]||0);
  pl.maxHp+=v('HP'); pl.hp=pl.maxHp;
  pl.dmgM*=1+v('DMG'); pl.atkCdM*=1-v('AS');
  pl.qCdM*=1-v('CD'); pl.eCdM*=1-v('CD'); pl.rCdM*=1-v('CD'); pl.xCdM*=1-v('CD');
  pl.critBonus+=v('CRIT'); pl.spd*=1+v('SPD'); pl.xpMult+=v('XP');
  pl.lifesteal+=v('LS'); pl.dmgReduction+=v('ARMOR'); pl.pickupR+=v('PICKUP'); pl.luck+=v('LUCK');
}
function achToast(a,lvl){ achToasts.push({txt:`${a.icon} ${a.name} — ур.${lvl}`,perk:PERK_LABEL[PERK_OF[a.rew]],t:3.4}); if(achToasts.length>5)achToasts.shift(); }
function checkAch(metric){
  const list=ACH_BY_METRIC[metric]; if(!list)return; let changed=false;
  for(const a of list){
    const rec=meta.ach[a.id]||(meta.ach[a.id]={lvl:0});
    while(rec.lvl<5 && (stats[metric]||0)>=a.band[rec.lvl]){ rec.lvl++; achToast(a,rec.lvl); changed=true; }
  }
  if(changed){
    recomputePerks();
    const cnt=ACHIEVEMENTS.reduce((s,a)=>s+(((meta.ach[a.id]||{}).lvl||0)>0?1:0),0);
    if((stats.achievements_unlocked||0)!==cnt && metric!=='achievements_unlocked'){ stats.achievements_unlocked=cnt; checkAch('achievements_unlocked'); }
  }
}
function track(metric,amt=1){ if(!stats)return; if(typeof gameMode!=='undefined'&&gameMode==='testroom')return; stats[metric]=(stats[metric]||0)+amt; checkAch(metric); }   // фикс ревью: тренировка не фармит достижения/метрики
function trackMax(metric,val){ if(!stats)return; if(typeof gameMode!=='undefined'&&gameMode==='testroom')return; if((stats[metric]||0)<val){ stats[metric]=val; checkAch(metric); } }
function comboKill(){ if(!runStats)return; const now=performance.now(); runStats.combo.push(now); while(runStats.combo.length&&now-runStats.combo[0]>5000)runStats.combo.shift(); if(runStats.combo.length>(runStats.maxCombo||0))runStats.maxCombo=runStats.combo.length; if(runStats.combo.length>=10){ track('combo_10_in_5s'); runStats.combo.length=0; } }   // 📊 фича 6: лучшее комбо

// 3 ежедневных + 1 недельное задание. Ротация детерминированная: seed = локальная дата
// (недельное — дата понедельника). Прогресс = дельта meta.stats за забег: снапшот в
// initGame (trialSnap), зачёт в endRun (applyTrialProgress). Награды: золото + заряд удачи.
let trialSnap=null;   // снапшот stats на старте забега
function trialDayKey(d){ d=d||new Date(); const z=v=>(v<10?'0':'')+v; return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function trialWeekKey(){ const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return trialDayKey(d); }   // понедельник текущей недели
function trialRng(seed){ let h=2166136261>>>0; for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}
  return function(){ h+=0x6D2B79F5; let t=Math.imul(h^h>>>15,1|h); t^=t+Math.imul(t^t>>>7,61|t); return ((t^t>>>14)>>>0)/4294967296; }; }

// Ротация: перегенерация списков при смене дня/недели (дёшево — сравнение строк, зовётся из меню каждый кадр)
function trialsRefresh(){
  if(!meta)return; if(!meta.trials)meta.trials={date:'',list:[],week:'',weekly:null};
  const T=meta.trials, dk=trialDayKey();
  if(T.date!==dk){ const rng=trialRng('D'+dk), pool=TRIAL_POOL.slice();
    for(let i=pool.length-1;i>0;i--){ const j=(rng()*(i+1))|0, tmp=pool[i]; pool[i]=pool[j]; pool[j]=tmp; }   // сид-шафл
    T.date=dk; T.list=pool.slice(0,3).map(t=>({id:t.id,goal:t.goal,progress:0,claimed:false})); saveSave(); }
  const wk=trialWeekKey();
  if(T.week!==wk){ const rng=trialRng('W'+wk), t=TRIAL_WEEKLY[(rng()*TRIAL_WEEKLY.length)|0];
    T.week=wk; T.weekly={id:t.id,goal:t.goal,progress:0,claimed:false}; saveSave(); }
}
function trialsHasClaim(){ if(!meta||!meta.trials)return false; trialsRefresh();
  const done=r=>r&&!r.claimed&&r.progress>=r.goal; return meta.trials.list.some(done)||done(meta.trials.weekly); }
// Зачёт прогресса в конце забега (вызов из endRun; тренировка не считается)
function applyTrialProgress(){
  const snap=trialSnap; trialSnap=null;
  if(!meta||!meta.trials||!snap||gameMode==='testroom')return;
  trialsRefresh();
  const d=m=>Math.max(0,(stats[m]||0)-(snap[m]||0));
  const c={mode:gameMode,wave:wave,time:runStats?runStats.time:0};
  let newly=false;
  const upd=rec=>{ if(!rec||rec.claimed)return; const t=TRIAL_BY_ID[rec.id]; if(!t)return;
    const was=rec.progress, v=Math.max(0,Math.floor(t.prog(d,c)||0));
    rec.progress=Math.min(rec.goal, t.max?Math.max(rec.progress,v):rec.progress+v);
    if(was<rec.goal&&rec.progress>=rec.goal)newly=true; };
  meta.trials.list.forEach(upd); upd(meta.trials.weekly);
  if(newly&&typeof SFX!=='undefined')SFX.play('levelup');   // фанфара «испытание выполнено»
}

function itemCol(it){ return it&&it.unique?UNIQUE_COL:(it?RARITY[it.rarity].col:'#3a3a52'); }
function makeUnique(u,ilvl){ const it={slot:u.slot,rarity:5,affixes:u.affixes.map(a=>Object.assign({},a)),ilvl:ilvl||1,sharpen:0,unique:u.id,name:u.name,lore:u.lore}; it.score=itemScore(it); return it; }
function hasUnique(id){ const chk=it=>!!(it&&it.unique===id);
  if(meta){ if(meta.stash.some(chk))return true; for(const k in meta.equipped)if(chk(meta.equipped[k]))return true; }
  if(typeof player!=='undefined'&&player&&player.equipped)for(const k in player.equipped)if(chk(player.equipped[k]))return true;
  if(typeof drops!=='undefined'&&drops.some(d=>chk(d.item)))return true;
  return false; }
function rollUniqueDrop(bossId,x,y){   // вызов из Enemy.hit при смерти босса (18% / golemlord 35%), без дублей; заряд удачи испытаний ×1.5
  let ch=bossId==='golemlord'?0.35:0.18; if(typeof player!=='undefined'&&player&&player.luck>0)ch*=1.5; if(Math.random()>=ch)return false;
  const pool=UNIQUES.filter(u=>u.boss===bossId&&!hasUnique(u.id)&&(u.slot!=='accessory'||(meta&&meta.unlocks&&meta.unlocks.accessory)));
  if(!pool.length)return false;
  const u=pool[Math.floor(Math.random()*pool.length)];
  drops.push(new Drop(x,y,makeUnique(u,Math.max(wave,1))));
  achToasts.push({txt:'⭐ '+u.name,perk:'УНИКАЛЬНЫЙ ПРЕДМЕТ — подбери!',t:4,col:UNIQUE_COL}); if(achToasts.length>5)achToasts.shift();
  if(typeof SFX!=='undefined')SFX.play('boss');
  return true; }

// ── БЛОК B: детальные иконки предметов по грейду (2026-07-04) ────────────────
// Процедурные пиксель-иконки экипировки (единый PX-стиль). Детализация растёт с редкостью:
// r0 серый контур · r1 цветная окантовка+заклёпки · r2 +блик · r3 орнамент+самоцвет ·
// r4 двойная рамка+свечение+2 камня · r5 ореол+лучи+искры+золотые узоры (анимация по t) ·
// уник — оранжевое пламя по контуру + ⭐ (плюс слои r4). Контракт:
// drawItemIcon(g,x,y,size,it,t): g=ctx, (x,y)=центр, size=габарит (дизайн-сетка 32×32,
// лучи/пламя/⭐ выходят на ~15-25%), it={slot,rarity,unique?}, t=Date.now()/1000.
// Перф: НОЛЬ radial-градиентов; свечение r4+ = один shadow-проход на иконку.
// Уважает globalAlpha вызывающего (фейд дропа / призрак пустого слота) — умножает, не затирает.
const ICO_GRAY={hi:'#cacad4',base:'#90909e',dk:'#5c5c6a',ln:'#36363f'};
const ICO_PAL={
  head:{hi:'#dfe6f2',base:'#a8b2c6',dk:'#67718a',ln:'#3a4052'},
  body:{hi:'#dfe6f2',base:'#a8b2c6',dk:'#67718a',ln:'#3a4052'},
  weapon:{hi:'#f2f6ff',base:'#b8c2d6',dk:'#6e7890',ln:'#3a4052'},
  legs:{hi:'#c98f55',base:'#96613a',dk:'#5f3d24',ln:'#33200f'},
  accessory:{hi:'#ffe89a',base:'#dcb040',dk:'#8f6e1e',ln:'#4d3a0e'},
};
const ICO_GOLD='#e8c04a';
function drawItemIcon(g,x,y,size,it,t){
  if(!it||!SLOTS[it.slot])return; t=t||0;
  const dl=it.unique?6:Math.max(0,Math.min(5,it.rarity||0)), rcol=itemCol(it), u=size/32, A=g.globalAlpha, sl=it.slot;
  const P=dl===0?ICO_GRAY:(ICO_PAL[sl]||ICO_GRAY), edge=dl>=1?rcol:P.ln;   // контур: серый → цвет редкости
  g.save(); g.translate(Math.round(x),Math.round(y));
  const R=(px,py,w,h,col)=>{g.fillStyle=col;g.fillRect(px*u,py*u,w*u,h*u);};   // рект в юнитах сетки
  const gem=(gx,gy,s,col)=>{R(gx-s,gy-s*0.55,s*2,s*1.1,col);R(gx-s*0.55,gy-s,s*1.1,s*2,col);R(gx-s*0.4,gy-s*0.4,s*0.8,s*0.8,'#fff');};   // самоцвет-ромб с бликом
  const frame=(hs,th,al)=>{g.globalAlpha=A*al;g.fillStyle=rcol;   // пиксель-рамка со срезанными углами (в границах size)
    g.fillRect((-hs+3)*u,-hs*u,(hs*2-6)*u,th*u);g.fillRect((-hs+3)*u,(hs-th)*u,(hs*2-6)*u,th*u);
    g.fillRect(-hs*u,(-hs+3)*u,th*u,(hs*2-6)*u);g.fillRect((hs-th)*u,(-hs+3)*u,th*u,(hs*2-6)*u);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([qx,qy])=>g.fillRect((qx*(hs-2.8)-th*0.8)*u,(qy*(hs-2.8)-th*0.8)*u,th*1.6*u,th*1.6*u));
    g.globalAlpha=A;};
  // r4+: мягкое свечение — единственный shadow-проход на иконку (без градиентов)
  if(dl>=4){g.save();g.shadowColor=rcol;g.shadowBlur=size*(dl>=5?0.5:0.3);g.globalAlpha=A*0.32;g.fillStyle=rcol;g.beginPath();g.arc(0,0,size*0.33,0,Math.PI*2);g.fill();g.restore();}
  // r5: ореол-кольцо + вращающиеся лучи (плоские треугольники)
  if(dl===5){g.save();g.rotate(t*0.5);g.fillStyle=rcol;g.globalAlpha=A*(0.28+0.12*Math.sin(t*3));
    for(let i=0;i<8;i++){g.rotate(Math.PI/4);g.beginPath();g.moveTo(0,-size*0.30);g.lineTo(1.4*u,-size*0.68);g.lineTo(-1.4*u,-size*0.68);g.closePath();g.fill();}
    g.restore();g.globalAlpha=A*0.35;g.lineWidth=u;g.strokeStyle=rcol;g.beginPath();g.arc(0,0,size*0.55,0,Math.PI*2);g.stroke();g.globalAlpha=A;}
  if(dl>=4){frame(15.4,1.1,0.9);frame(13.2,0.8,0.45);}   // двойная рамка (внешняя ярче)
  // ── форма по слоту (дизайн-сетка 32×32, центр 0,0) ──
  if(sl==='head'){   // шлем: гребень + купол + забрало с прорезями + нащёчники
    R(-1.5,-15.5,3,6,dl>=5?'#ffe14d':(dl>=3?rcol:P.dk));   // гребень (3+: цвет редкости, 5: золото)
    R(-10,-7,20,12,edge);R(-8,-10,16,3,edge);   // контур купола
    R(-9,-6,18,10,P.base);R(-7,-9,14,2,P.base);R(-8,-6,4,8,P.hi);R(5,-6,3,9,P.dk);
    R(-8,-2,16,2.6,P.ln);R(-7,-1.6,4,1.8,'#0a0c12');R(1,-1.6,4,1.8,'#0a0c12');   // забрало
    R(-10,1,5,8,edge);R(5,1,5,8,edge);R(-9,1,4,7,P.dk);R(5,1,4,7,P.dk);R(-3,2,6,5,'#141824');   // нащёчники + проём лица
    if(dl>=1){R(-9,-5,1.6,1.6,rcol);R(7.4,-5,1.6,1.6,rcol);R(-8.6,6.4,1.6,1.6,rcol);R(7,6.4,1.6,1.6,rcol);}   // заклёпки
    if(dl>=2)R(-6,-8.3,7,1.2,'#fff');   // блик купола

    if(dl>=4){gem(-7,4.5,1.5,rcol);gem(7,4.5,1.5,rcol);}   // 2 камня на нащёчниках
  } else if(sl==='body'){   // кираса: наплечники + нагрудник + центральное ребро
    R(-14,-8,7,6,edge);R(7,-8,7,6,edge);R(-13,-7,5,4,P.base);R(8,-7,5,4,P.base);R(-13,-7,5,1.4,P.hi);R(8,-7,5,1.4,P.hi);
    R(-9,-9,18,17,edge);R(-7,7,14,5,edge);R(-8,-8,16,15,P.base);R(-6,7,12,4,P.base);
    R(-8,-8,4,15,P.hi);R(4,-8,4,15,P.dk);R(-4,-9,8,2.2,'#10141e');   // горловина

    if(dl>=2)R(-7,-7,6,1.2,'#fff');
    if(dl>=3){R(-6,-3.5,12,1.2,dl>=5?'#ffe14d':rcol);gem(0,-1,2.2,rcol);}   // орнамент + камень в груди
    if(dl>=4){gem(-10.5,-5,1.6,rcol);gem(10.5,-5,1.6,rcol);}   // камни в наплечниках
  } else if(sl==='legs'){   // сапог: голенище + носок + пряжка + каблук
    R(-6,-13,11,17,edge);R(-6,2,16,8,edge);R(-5,-12,9,15,P.base);R(-5,3,14,6,P.base);
    R(-5,-12,3,15,P.hi);R(1,-12,3,15,P.dk);R(6,4,3,4,P.hi);
    R(-6,-14,11,3,dl>=5?'#ffe14d':(dl>=3?rcol:P.dk));   // отворот
    R(-6,8,6,2,P.ln);R(-5,9,14,1.2,P.ln);   // каблук + подошва
    R(-1,-3,5,5,ICO_GOLD);R(0,-2,3,3,'#2a1c08');R(0.7,-1.3,1.6,1.6,ICO_GOLD);   // пряжка
    if(dl>=1){R(-4,-11,1.6,1.6,rcol);R(2,-11,1.6,1.6,rcol);}
    if(dl>=2)R(-4,-9,6,1.1,'#fff');
    if(dl>=3){R(-5,-6.5,9,1.1,rcol);gem(1.5,-0.5,1.6,rcol);}   // орнамент + камень в пряжке
    if(dl>=4){gem(-1.5,5.8,1.5,rcol);gem(5,5.8,1.5,rcol);}
  } else if(sl==='weapon'){   // меч остриём вверх: клинок с долом + гарда + рукоять + навершие
    R(-2.5,-15,5,19,edge);R(-1.6,-14,3.2,17,P.base);R(-1.6,-14,1.2,17,P.hi);R(-0.5,-16.2,1,2.4,P.hi);
    R(-0.35,-12,0.7,13,dl>=3?rcol:P.dk);   // дол (3+: рунический, цвет редкости)
    R(-7,3,14,3,edge);R(-6,3.5,12,2,dl>=5?'#ffe14d':ICO_GOLD);   // гарда
    R(-1.6,5.5,3.2,6.5,'#4a3020');R(-1.6,6.8,3.2,1,'#2a1a10');R(-1.6,9,3.2,1,'#2a1a10');   // рукоять с обмоткой
    R(-2.5,12,5,3.5,ICO_GOLD);   // навершие
    if(dl>=1){R(-5.4,3.9,1.4,1.4,rcol);R(4,3.9,1.4,1.4,rcol);}   // заклёпки гарды
    if(dl>=2)R(0.4,-14,0.9,6,'#fff');   // блик клинка
    if(dl>=3)gem(0,13.7,1.7,rcol);   // камень в навершии

  if(pr.split>0){ const base=Math.atan2(pr.vy,pr.vx); const n=pr.split; for(let i=0;i<n;i++){ const a=base+(i-(n-1)/2)*0.5; const c=new Proj(pr.x,pr.y,a,300,pr.dmg*0.5,'#ff7733',10,false,0,true,45); c.maxDist=160; c.src=pr.src; c.fireTrail=true; projs.push(c); } }
}

// Дружественный призыв (духи/голем/питомец) — реюз для Призывателя (маг) и Ловчего (лучник).
// Урон только через существующий e.hit(...); минионы не получают урон (временные, живут по таймеру life).
class Minion {
  constructor(x,y,dmg,r,color,kind,duration){
    this.x=x;this.y=y;this.dmg=dmg;this.r=r;this.color=color;this.kind=kind||'spirit';
    if(this.kind==='beast')this.kind='wolf';   // легаси-алиас
    const K={spirit:{cd:0.85,spd:150,rng:230,ranged:true},golem:{cd:1.3,spd:85,rng:38},bear:{cd:1.15,spd:105,rng:44},wolf:{cd:0.8,spd:175,rng:34},fox:{cd:0.65,spd:205,rng:30},falcon:{cd:0.55,spd:245,rng:28}}[this.kind]||{cd:0.85,spd:150,rng:34};
    this.atkCd=K.cd; this.spd=K.spd; this.range=K.rng; this.ranged=!!K.ranged;
    this.life=duration;this.dead=false;this.atkTimer=Math.random()*0.4;
    this.bob=Math.random()*6.28; this.dir=0;
    const _pk={spirit:'petSpirit',golem:'petGolem',wolf:'petWolf',fox:'petFox',bear:'petBear',falcon:'petFalcon'}[this.kind];   // голос питомца при призыве (троттлинг в SFX: 12 духов = 1 звук)
    if(_pk&&typeof SFX!=='undefined')SFX.play(_pk);
  }
  update(dt){
    this.life-=dt;
    if(this.life<=0){ this.dead=true;
      if(typeof player!=='undefined'&&player&&player.au&&player.au.suBoom){ explodeAt(this.x,this.y,this.dmg*1.5,parts,60,0,'passive'); parts.push(new Particle(this.x,this.y,0,0,this.color,0.16,40,{kind:'flash'})); }   // au_su1: жертвенный взрыв

    if(this.siege){ this.siegeT=(this.siegeT||1.6)-dt; if(this.siegeT<=0){ this.siegeT=1.6; let bt=null,btd=1e9; for(const e of enemies){ if(e.dead)continue; const dd=(e.x-this.x)*(e.x-this.x)+(e.y-this.y)*(e.y-this.y); if(dd<btd){btd=dd;bt=e;} } if(bt&&btd<420*420&&typeof player!=='undefined'&&player){ explodeAt(bt.x,bt.y,player._dmg(player.c.dmg*1.3),parts,70,0,'r'); rings.push(new Ring(bt.x,bt.y,'#ff9944',70)); } } }   // au_su16: осадный голем — залп-мортира

    if(best && bd<520*520){
      const d=Math.sqrt(bd), a=Math.atan2(best.y-this.y,best.x-this.x);
      this.dir=a;
      if(d>this.range*0.75){ this.x+=Math.cos(a)*this.spd*dt; this.y+=Math.sin(a)*this.spd*dt; }
      if(d<this.range && this.atkTimer<=0){
        this.atkTimer=this.atkCd;
        if(this.ranged){ const pr=new Proj(this.x,this.y,a,360,this.dmg,this.color,6,false,0); pr.src='minion'; projs.push(pr); }
        else { best.hit(this.dmg,parts,'minion',false); score+=Math.floor(this.dmg); for(let i=0;i<4;i++)parts.push(new Particle(this.x,this.y,(Math.random()-.5)*100,(Math.random()-.5)*100,this.color,0.3,2));
          if(typeof player!=='undefined'&&player&&player.au&&player.au.suShock){ const kb=Math.atan2(best.y-this.y,best.x-this.x); best.x=clamp(best.x+Math.cos(kb)*22,best.r+20,worldW-20-best.r); best.y=clamp(best.y+Math.sin(kb)*22,best.r+20,worldH-20-best.r); rings.push(new Ring(this.x,this.y,this.color,52)); } }   // au_su2: ударная волна (с клэмпом)
        if(typeof player!=='undefined'&&player&&player.au&&player.au.suSoul){ player.heal(2); if(Math.random()<0.3)parts.push(new Particle(player.x,player.y-14,(Math.random()-.5)*30,-40,'#88ffb0',0.5,2,{glow:true})); }   // au_su3: связь душ

    } else if(player){ const pd=dist(this,player); if(pd>110){const a=Math.atan2(player.y-this.y,player.x-this.x); this.x+=Math.cos(a)*this.spd*0.7*dt; this.y+=Math.sin(a)*this.spd*0.7*dt;} }
  }
  draw(){

      ctx.fillRect(-this.r*1.38,-this.r*0.5,this.r*0.42,this.r*1.05); ctx.fillRect(this.r*0.96,-this.r*0.5,this.r*0.42,this.r*1.05);

      ctx.fillStyle='#aaffcc'; ctx.fillRect(-2,-this.r*0.6,4,4); ctx.fillRect(-this.r*0.68,this.r*0.15,3,3); ctx.fillRect(this.r*0.5,this.r*0.15,3,3);
      ctx.fillStyle='#fff'; ctx.fillRect(-this.r*0.48,-this.r*0.68,3,3); ctx.fillRect(this.r*0.24,-this.r*0.68,3,3);

      for(let i=0;i<this.rainCount;i++){const a=(i/this.rainCount)*Math.PI*2;const rp=new Proj(this.x,this.y,a,480,this._dmg(this.c.dmg*this.rainDmgM),'#88ff44',5,false,this.pierce);rp.src='r';if(this.rainExplode){rp.explode=true;rp.explodeR=55;}if(this.homing)rp.homing=true;if(this.bouncy)rp.bouncy=true;else rp.sticky=true;projs.push(rp);}
      if(this.rainPoison){ spawnHazard(this.x,this.y,150,4,{dps:this._dmg(this.c.dmg*0.4),color:'#77cc33',arm:0.3}); rings.push(new Ring(this.x,this.y,'#77cc33',150)); }   // ar6: ядовитый дождь
      if(this.rainVortex){ spawnHazard(this.x,this.y,170,1.2,{pull:180,color:'#c8ffd9'}); }   // ar7: воронка стягивает к герою
      for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2;parts.push(new Particle(this.x+Math.cos(a)*22,this.y+Math.sin(a)*22,Math.cos(a)*100,Math.sin(a)*100,'#88ff44',0.4,2));}

  xAbility(projs, parts) {
    if(this.arch){ if(this.xTimer>0||this.level<20)return; this.xTimer=this.arch.xCd*this.xCdM; track('casts_x'); if(typeof SFX!=='undefined')SFX.play('x'); this.castAnim=0.5; this.castCol=this.arch.color; spawnCastRune(this.castCol,1.5); this._pcx=this.x; this._pcy=this.y; this.arch.x(this,projs,parts); archPostCast(this,'x',projs,parts); return; }   // архетип: X открывается на 20 ур.
    if(this.xTimer>0||this.level<10) return;
    this.xTimer=this.c.xCd*this.xCdM; track('casts_x'); if(typeof SFX!=='undefined')SFX.play('x');
    this.castAnim=0.5; this.castCol=this.classId==='swordsman'?'#88aaff':this.classId==='wizard'?'#ff5522':'#ffaa00'; spawnCastRune(this.castCol,1.5);   // облик: вспышка умения + рунный круг
    if(this.classId==='swordsman'){
      this.shieldMax=Math.floor(this.maxHp*this.shieldPct); this.shieldHp=this.shieldMax; this.shieldTimer=8;
      explodeAt(this.x,this.y,this._dmg(this.c.dmg*6.0),parts,220,0,'x',1.0);   // ульта бьёт: нова гнева (баланс: 2.2→6.0, r220, стан 1с — доля X была 0.5%)
      parts.push(new Particle(this.x,this.y,0,0,'#88aaff',0.32,56,{kind:'pillar'})); skyFlashT=Math.max(skyFlashT,0.13); addShake(5);
      rings.push(new Ring(this.x,this.y,'#4488ff',65)); rings.push(new Ring(this.x,this.y,'#88aaff',50));
      for(let i=0;i<20;i++){const a=(i/20)*Math.PI*2;parts.push(new Particle(this.x+Math.cos(a)*30,this.y+Math.sin(a)*30,Math.cos(a)*80,Math.sin(a)*80,'#88aaff',0.8,3));}
    } else if(this.classId==='wizard'){
      // F4: метеоры рождаются у героя и летят в направлении прицела на разных дистанциях; радиус +15% за уровень (от Lv10)
      const er=Math.round(this.meteorR*(1+0.15*Math.max(0,this.level-10)));
      for(let i=0;i<this.meteorCount;i++){
        const a=this.angle+(Math.random()-0.5)*0.5;
        const md=70+(i/this.meteorCount)*430+Math.random()*45;
        const mp=new Proj(this.x,this.y,a,360,this._dmg(this.c.dmg*5.0),'#ff4400',18,false,0,true,er);   // баланс: 3.6→5.0 (детонация по maxDist даёт 0.7×)
        mp.maxDist=md; mp.src='x'; track('meteors_cast');
        if(this.meteorFireTrail)mp.fireTrail=true;
        projs.push(mp);
      }

      for(let i=0;i<24;i++){const a=this.angle+(Math.random()-.5)*0.8;parts.push(new Particle(this.x,this.y,Math.cos(a)*220,Math.sin(a)*220,'#ff6600',0.65,5));}
    } else {
      for(let i=-this.xVolley;i<=this.xVolley;i++){const a=this.angle+i*0.2;const xp=new Proj(this.x,this.y,a,560,this._dmg(this.c.dmg*4.5),'#ffaa00',8,false,3,true,85);xp.src='x';if(this.homing)xp.homing=true;if(this.bouncy)xp.bouncy=true;else xp.sticky=true;projs.push(xp);}   // баланс: 3.6→4.5, пробитие 2→3 (6.0/p4 перекачивал AoE — взрыв на каждом пробитии)
      skyFlashT=Math.max(skyFlashT,0.12);
      for(let i=0;i<18;i++){const a=this.angle+(Math.random()-.5)*0.8;parts.push(new Particle(this.x,this.y,Math.cos(a)*320,Math.sin(a)*320,'#ffaa00',0.5,4));}
    }
  }

  triggerPassive(projs, parts) {
    if(this.arch&&this.arch.passive){ this.arch.passive(this,projs,parts); return; }   // архетип: своя пассивка каждый 3-й удар ЛКМ (классовая ниже не вызывается)
    if(this.classId==='swordsman'){
      const base=this.c.atkR*3*(this.passiveTier>=3?1.7:1);
      const cnt=this.passiveTier>=3?3:this.passiveTier>=2?2:1;
      enemies.forEach(e=>{if(!e.dead&&dist(this,e)<base+e.r){const d=this._dmg(this.c.dmg*1.1);e.hit(d,parts,'passive','roll');score+=Math.floor(d);if(this.lifesteal>0)this.heal(Math.floor(d*this.lifesteal));
        if(this.passHarvest&&e.dead){ this.heal(3); const ha=Math.atan2(e.y-this.y,e.x-this.x)||0; const hb=new BladeWave(e.x,e.y,ha,this._dmg(this.c.dmg*0.8),40); hb.src='passive'; bladeWaves.push(hb); parts.push(new Particle(e.x,e.y,0,0,'#88ccff',0.18,34,{kind:'flash'})); }   // s_pass6: жатва — волна клинка из убитого
      }});
      for(let ri=0;ri<cnt;ri++)rings.push(new Ring(this.x,this.y,'#4499ff',base-ri*20));
      for(let i=0;i<20;i++){const a=(i/20)*Math.PI*2;parts.push(new Particle(this.x+Math.cos(a)*(base*0.55),this.y+Math.sin(a)*(base*0.55),Math.cos(a)*110,Math.sin(a)*110,'#88ccff',0.55,3));}
      if(this.passScorch)spawnHazard(this.x,this.y,base*0.7,2.5,{dps:this._dmg(this.c.dmg*0.35),color:'#ff6a33'});   // s_pass5: выжженная земля
      if(this.passEcho){ const ex=this.x,ey=this.y,eb=base; after(0.3,()=>{ enemies.forEach(e=>{ if(!e.dead&&dist({x:ex,y:ey},e)<eb+e.r){ const d=this._dmg(this.c.dmg*0.66); e.hit(d,parts,'passive','roll'); score+=Math.floor(d); } }); rings.push(new Ring(ex,ey,'#88ccff',eb*0.9)); for(let i=0;i<10;i++){const a=(i/10)*Math.PI*2;parts.push(new Particle(ex+Math.cos(a)*(eb*0.5),ey+Math.sin(a)*(eb*0.5),Math.cos(a)*90,Math.sin(a)*90,'#aaddff',0.4,3));} }); }   // s_pass4: эхо кольца
    } else if(this.classId==='wizard'){
      const tgt=enemies.filter(e=>!e.dead).sort((a,b)=>dist(this,a)-dist(this,b))[0];
      if(!tgt)return;
      const ang=Math.atan2(tgt.y-this.y,tgt.x-this.x);
      const dmgM=3.0*(this.passiveTier>=2?2.1:1);   // баланс: T1 4.5→3.0 (ранний маг не доминирует), T2+ остаётся 6.3
      const r=this.passiveTier>=2?Math.round(this.passMeteorR*1.6):this.passMeteorR;   // #7: пассивный метеор — свой радиус (баланс: T2 ×2→×1.6)
      {const pm=new Proj(this.x,this.y,ang,210,this._dmg(this.c.dmg*dmgM),'#ff4400',14,false,0,true,r,this.passiveTier>=3);pm.src='passive';pm.fireTrail=true;if(this.passSplit)pm.split=3;if(this.passLava){pm.lava=55;pm.lavaDps=Math.round(this._dmg(this.c.dmg*0.5));}track('meteors_cast');projs.push(pm);}   // огненный хвост авто-метеора; w_pass4/5: раскол + лава (реюз Proj.split/lava → projDetonateExtras)
      if(this.passTwin){ const t2=enemies.filter(e=>!e.dead&&e!==tgt).sort((a,b)=>dist(this,a)-dist(this,b))[0]; if(t2){ const a2=Math.atan2(t2.y-this.y,t2.x-this.x); const pm2=new Proj(this.x,this.y,a2,210,this._dmg(this.c.dmg*dmgM*0.75),'#ff7744',12,false,0,true,Math.round(r*0.8),this.passiveTier>=3); pm2.src='passive'; pm2.fireTrail=true; if(this.passSplit)pm2.split=3; projs.push(pm2); } }   // w_pass6: двойная комета во 2-ю цель
      for(let i=0;i<12;i++){const a=ang+(Math.random()-.5)*0.5;parts.push(new Particle(this.x,this.y,Math.cos(a)*200,Math.sin(a)*200,'#ff6600',0.45,4));}
    } else {
      const tgt=enemies.filter(e=>!e.dead).sort((a,b)=>dist(this,a)-dist(this,b))[0];
      if(!tgt)return;
      const ang=Math.atan2(tgt.y-this.y,tgt.x-this.x);
      const ep=this.passiveTier>=3?1:0;
      for(let i=0;i<this.passiveTier;i++){const a=ang+(i===0?0:(i%2===0?1:-1)*0.08*Math.ceil(i/2));const ap=new Proj(this.x,this.y,a,580,this._dmg(this.c.dmg*1.8),'#ffcc00',7,false,this.pierce+ep);ap.src='passive';if(this.passBlast){ap.explode=true;ap.explodeR=55;}if(this.passRico>0)ap.rico=this.passRico;projs.push(ap);}   // a_pass4/5: разрыв + рикошет (реюз Proj.explode/rico)
      if(this.passStorm){ this._passN=(this._passN||0)+1; if(this._passN%3===0){ for(let i=0;i<8;i++){ const a2=(i/8)*Math.PI*2; const sp=new Proj(this.x,this.y,a2,540,this._dmg(this.c.dmg*1.2),'#ffcc00',6,false,this.pierce); sp.src='passive'; if(this.passBlast){sp.explode=true;sp.explodeR=55;} projs.push(sp); } rings.push(new Ring(this.x,this.y,'#ffcc00',60)); } }   // a_pass6: каждый 3-й залп — кольцо смерти
      for(let i=0;i<10;i++){const a=ang+(Math.random()-.5)*0.3;parts.push(new Particle(this.x,this.y,Math.cos(a)*300,Math.sin(a)*300,'#ffcc00',0.3,3));}
    }
  }

  takeDamage(dmg) {
    if(this.invTimer>0) return;
    if(this.dodge>0&&Math.random()<this.dodge){this.invTimer=0.2;for(let i=0;i<6;i++){const a=Math.random()*Math.PI*2;parts.push(new Particle(this.x,this.y,Math.cos(a)*140,Math.sin(a)*140,'#ffffff',0.3,2));}return;}  // Идея 2: уклонение
    if(this.uReflect>0&&!this._refl&&typeof enemies!=='undefined'){ let ne=null,nd=180; for(const e of enemies){ if(e.dead)continue; const d=dist(this,e); if(d<nd){nd=d;ne=e;} }
      if(ne){ this._refl=true; try{ ne.hit(Math.max(1,Math.round(dmg*this.uReflect)),parts,'passive'); }finally{ this._refl=false; }
        for(let i=0;i<5;i++)parts.push(new Particle(this.x,this.y,(Math.random()-.5)*160,(Math.random()-.5)*160,UNIQUE_COL,0.3,2)); } }   // уник «Сердце Голема»: каменные шипы (гард _refl от рекурсии с кристальным големом)
    if(this.dmgInM)dmg=Math.round(dmg*this.dmgInM);   // фича 5: проклятие алтаря (+входящий урон)
    if(this.dmgReduction>0) dmg=Math.max(1,Math.round(dmg*(1-this.dmgReduction)));
    if(this.shieldHp<=0 && this.hp-dmg>0 && this.hp-dmg<this.maxHp*0.1) track('low_hp_survived');
    if(this.shieldHp>0){
      this.shieldHp=Math.max(0,this.shieldHp-dmg); this.invTimer=0.25;
      if(this.shieldHp<=0){
          this.shieldMax=0;for(let i=0;i<16;i++){const a=Math.random()*Math.PI*2;parts.push(new Particle(this.x,this.y,Math.cos(a)*180,Math.sin(a)*180,'#4488ff',0.6,3));}   // взрыв щита — только по таймеру (не при пробитии), см. player.update
      }
      return;
    }
    this.hp=Math.max(0,this.hp-dmg); this.invTimer=0.5*(1+this.invMult);
    if(typeof floats!=='undefined')floats.push(new FloatText(this.x,this.y-22,'-'+Math.round(dmg),'#ff5555',14)); addShake(5); if(typeof SFX!=='undefined')SFX.play('hurt');
    if(typeof dmgFlash!=='undefined')dmgFlash=Math.min(0.42,dmgFlash+0.28);   // красный флэш получения урона
    if(runStats){runStats.killsSinceDmg=0;runStats.dmgThisWave=true;}
    if(this.hp<=0) this.dead=true;
  }

  draw() {
    const col = this.arch ? this.arch.color : ((meta&&meta.unlocks&&meta.unlocks.skin&&SKINS[meta.unlocks.skin])||this.c.color);   // архетип перекрашивает героя в свой цвет (Идея 3: косметика-скин — до архетипа)
    if(this.invTimer>0 && Math.floor(this.invTimer*10)%2===0) return;
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(this.x,this.y+16,14,5,0,0,Math.PI*2); ctx.fill();
    if(this.shieldHp>0){const sf=this.shieldHp/this.shieldMax,sa=Date.now()/400;ctx.globalAlpha=0.5+Math.sin(sa)*0.18;ctx.strokeStyle='#6699ff';ctx.lineWidth=4;ctx.shadowColor='#88aaff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(this.x,this.y,this.r+11,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1;const bw2=44,bx2=this.x-bw2/2,by2=this.y-this.r-23;ctx.fillStyle='#001133';ctx.fillRect(bx2,by2,bw2,3);ctx.fillStyle='#4488ff';ctx.fillRect(bx2,by2,bw2*sf,3);}
    if(this.eagleCharges>0){ctx.shadowColor='#ffee44';ctx.shadowBlur=28;ctx.strokeStyle='rgba(255,238,68,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.r+8,0,Math.PI*2);ctx.stroke();}
    // Гуманоидный облик героя (редизайн 2026-06-19) — фигура+оружие+анимация; фолбэк = круг
    try{ drawHeroBody(ctx, this, col, Date.now()/1000); }
    catch(_e){ ctx.shadowColor=col; ctx.shadowBlur=14; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); }
    ctx.shadowBlur=0;
    if(this.stunT>0){ const sa=Date.now()/120; ctx.strokeStyle='#ffee44'; ctx.lineWidth=2.5; ctx.globalAlpha=0.55+Math.sin(Date.now()/90)*0.3; ctx.beginPath(); ctx.arc(this.x,this.y,this.r+9,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; ctx.fillStyle='#ffee44'; ctx.font='bold 11px Segoe UI'; ctx.textAlign='center'; for(let i=0;i<4;i++){ const a=sa+i/4*Math.PI*2; ctx.fillText('⚡', this.x+Math.cos(a)*(this.r+15), this.y-this.r-7+Math.sin(a)*5); } ctx.textAlign='left'; }   // визуал оглушения (поверх фигуры)

    const bw=44,bh=5,bx=this.x-bw/2,by=this.y-this.r-15;
    ctx.fillStyle='#330000';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=this.hp>this.maxHp*0.5?'#00cc44':this.hp>this.maxHp*0.25?'#ffaa00':'#ff2200';
    ctx.fillRect(bx,by,bw*(this.hp/this.maxHp),bh);
    ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);

    if(this.qTimer>0){ctx.strokeStyle='rgba(200,180,255,0.4)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(this.x,this.y,this.r+6,-Math.PI/2,-Math.PI/2+(1-this.qTimer/(this.c.qCd*this.qCdM))*Math.PI*2);ctx.stroke();}
  }
}

  else { MODS.spd*=1.05; MODS.hp*=1.12; MODS.dmg*=1.10; label='🔺 Эскалация'; }

  } else announce={show:true,timer:3.2,text:`⚠ ВЕХА ${tier} · +${gold}🪙`,sub:label+' — монстры усилены'};

const ELITES=['corruptknight','plaguebearer','berserker','mirror','voidavatar','crystalgolem','reaper'];   // элиты (ХП уровня Проклятого)
function buildWave(n) {
  if(n%15===0){return [{id:'golemlord',cnt:1},{id:'goblin',cnt:Math.floor(n*.4)},{id:'skeleton',cnt:Math.floor(n*.3)},...(n>=20?[{id:'cursed',cnt:1}]:[])];}   // мега-босс Голем-Владыка дебютирует на 15-й волне, дальше каждая 15-я (только 1)
  if(n%5===0){const BOSSES=['troll','lich','titan','frostlord'];const bid=BOSSES[Math.floor(n/5-1)%4];return [{id:bid,cnt:1},{id:'goblin',cnt:n},{id:'skeleton',cnt:Math.floor(n/2)},...(n>=15?[{id:'golem',cnt:1}]:[]),...(n>=20?[{id:'cursed',cnt:1}]:[])];}   // обычные боссы: 5, 10, 20, 25…
  if(n===1) return [{id:'goblin',cnt:5}];
  if(n<=3)  return [{id:'goblin',cnt:3+n*2},...(n>=3?[{id:'splitter',cnt:2}]:[])];
  if(n<=5)  return [{id:'goblin',cnt:2+n},{id:'skeleton',cnt:n-1},{id:'banshee',cnt:2},...(n>=4?[{id:'bomber',cnt:2},{id:'charger',cnt:1}]:[])];
  if(n<=8)  return [{id:'goblin',cnt:3+Math.floor(n*.4)},{id:'skeleton',cnt:Math.floor(n*.5)},{id:'darkmage',cnt:Math.floor(n*.25)},{id:'banshee',cnt:2},{id:'wraith',cnt:1},{id:'charger',cnt:2},{id:'spitter',cnt:1}];
  return [{id:'goblin',cnt:3+Math.floor(n*.4)},{id:'skeleton',cnt:Math.floor(n*.45)},{id:'darkmage',cnt:Math.floor(n*.2)},{id:'banshee',cnt:Math.floor(n*.2)},{id:'wraith',cnt:Math.floor(n*.12)},{id:'charger',cnt:Math.floor(n*.12)},{id:'splitter',cnt:Math.floor(n*.12)},{id:'bomber',cnt:Math.floor(n*.1)},{id:'spitter',cnt:Math.floor(n*.1)},{id:'healer',cnt:1},{id:'phantom',cnt:Math.floor(n*.08)},...(n>=12?[{id:'golem',cnt:Math.floor(n*.1)},{id:'summoner',cnt:1}]:[]),...(n>=8?Array.from({length:Math.min(4,1+Math.floor((n-8)/4))},(_,k)=>({id:ELITES[(n+k*2)%7],cnt:1})):[])];   // плотность ↑ + элиты с 8-й волны, 1→4 растёт
}
// Хаотичный спавн: случайная точка у случайной грани арены (сильный джиттер), не ближе 300 к герою
function spawnPos(){
  for(let tr=0;tr<24;tr++){ const edge=Math.floor(Math.random()*4); let x,y;
    if(edge===0){ x=44+Math.random()*(worldW-88); y=38+Math.random()*120; }
    else if(edge===1){ x=44+Math.random()*(worldW-88); y=worldH-38-Math.random()*120; }
    else if(edge===2){ x=38+Math.random()*120; y=44+Math.random()*(worldH-88); }
    else { x=worldW-38-Math.random()*120; y=44+Math.random()*(worldH-88); }
    if(!player||dist({x,y},player)>300) return {x,y};
  }
  return {x:44,y:44};
}
// уровни аркады: заметный рост ОЗ (+25%/ур.) и урона (+12%/ур.) поверх волнового
function spawnWave(n){const _lvl=Math.floor((n-1)/5);const hpMult=(1+0.08*(n-1))*Math.pow(1.25,_lvl);const dmgScale=Math.min(4.2,Math.pow(1.045,n-1)*Math.pow(1.12,_lvl));const dm=(typeof MODS!=='undefined'&&MODS.dense)?1.4:1;const list=[];buildWave(n).forEach(d=>{const cnt=Math.round(d.cnt*(d.id==='golemlord'||ET[d.id].boss?1:dm));for(let i=0;i<cnt;i++){const s=spawnPos();list.push(new Enemy(d.id,s.x+(Math.random()-.5)*30,s.y+(Math.random()-.5)*30,hpMult,dmgScale));}});return list;}

function pickOwEnemy(){

  if(w>=2)pool.push(['splitter',3],['bomber',2]);
  if(w>=3)pool.push(['banshee',3],['darkmage',2],['charger',2]);
  if(w>=4)pool.push(['wraith',2],['golem',2],['spitter',2]);
  if(w>=5)pool.push(['cursed',1],['phantom',2],['healer',1]);     // F7: Проклятые с 5-й волны угрозы
  if(w>=6)pool.push(['troll',1],['summoner',1]);
  if(w>=5)pool.push(['corruptknight',2],['plaguebearer',2],['berserker',2],['mirror',2],['voidavatar',2],['crystalgolem',2],['reaper',2]);   // элиты-роумеры (чаще)
  if(w>=8)pool.push(['lich',1],['titan',1],['frostlord',1]);   // боссы-роумеры на высокой угрозе (редко)
  const total=pool.reduce((s,p)=>s+p[1],0);let r=Math.random()*total;

  return 'goblin';
}

function triggerArchetypeSelect(){
  if(state==='levelup'||state==='archsel'||state==='event'){levelupQueue++;return;}
  state='archsel'; if(typeof SFX!=='undefined')SFX.play('levelup'); if(typeof MUSIC!=='undefined')MUSIC.duckForLevelup();
  tipOnce('arch15','⭐ 15 уровень — путь архетипа!','Выбор заменит ЛКМ и Q/E/R новыми умениями · X — с 20 ур. · решение на весь забег');   // подсказка покажется по возвращении в бой
}
function triggerLevelup(){
  if(player.level>=15 && !player.archetype){ triggerArchetypeSelect(); return; }   // архетипы: 15 ур. — обязательный выбор вместо обычной карточки
  if(state==='levelup'||state==='archsel'||state==='event'){levelupQueue++;return;}
  // Правило: апгрейд не предлагается, пока умение не разблокировано (E:3 / R:5 / X:10; ульта архетипа — 20)
  const _slotLocked=s=>s==='e'?player.level<3:s==='r'?player.level<5:s==='x'?player.level<10:false;
  const _cardSlot=id=>{ const P=(typeof TREE_SLOT_PREFIX!=='undefined'&&TREE_SLOT_PREFIX[player.classId])||{}; for(const sl in P){ if(P[sl].some(pf=>id.indexOf(pf)===0))return sl; } return null; };
  if(player.arch){   // после архетипа: приоритет УНИКАЛЬНЫМ апгрейдам умений (до 2 карты), добор — генерик-пул
    const uniq=(player.arch.upgrades||[]).filter(u=>!player.takenSkills.has(u.id)&&!(u.slot==='x'&&player.level<20)).sort(()=>Math.random()-.5).slice(0,2);
    const gen=[...ARCH_UPGRADE_POOL].sort(()=>Math.random()-.5);
    pendingUpgrades=[...uniq,...gen].slice(0,3);
  } else {
    let avail = SKILL_TREES[player.classId].filter(u=>!player.takenSkills.has(u.id)&&(!u.req||player.takenSkills.has(u.req))&&!_slotLocked(_cardSlot(u.id)));
    if(avail.length===0) avail=ARCH_UPGRADE_POOL.filter(u=>!u.archOnly);   // «верен классу»: дерево исчерпано → генерик-пул (без арх-специфичных карт)
    pendingUpgrades=[...avail].sort(()=>Math.random()-.5).slice(0,3);
  }
  if(pendingUpgrades.length>0){ state='levelup'; if(typeof SFX!=='undefined')SFX.play('levelup'); if(typeof MUSIC!=='undefined')MUSIC.duckForLevelup(); }
}

    ctx.strokeStyle=B.neb; ctx.lineWidth=1; ctx.globalAlpha=0.5; ctx.stroke(); ctx.globalAlpha=1;

    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(px,py,26,0,Math.PI*2); ctx.fill();
  }

  castFX.forEach(cf=>{cf.life-=dt;cf.rot+=dt*2.2;}); castFX=castFX.filter(cf=>cf.life>0); if(skyFlashT>0)skyFlashT-=dt;   // рунные круги каста + скайлайт
  if(delayedFX.length){ delayedFX.forEach(d=>d.t-=dt); const _due=delayedFX.filter(d=>d.t<=0); delayedFX=delayedFX.filter(d=>d.t>0); _due.forEach(d=>{try{d.fn();}catch(_e){}}); }   // отложенные эффекты умений

  minions.forEach(m=>m.update(dt));   // архетипы: призывы (Волшебник-Призыватель, Лучник-Ловчий)
  if(hazards.length){ hazards.forEach(hz=>{ hz.life-=dt; if(hz.arm>0)hz.arm-=dt;
    if(player&&player.au&&player.au.huCreep&&hz.dps&&hz.color==='#77cc33'){ let _b=null,_bd=1e9; for(const e of enemies){ if(e.dead)continue; const dd=(e.x-hz.x)*(e.x-hz.x)+(e.y-hz.y)*(e.y-hz.y); if(dd<_bd){_bd=dd;_b=e;} } if(_b&&_bd>900){ const a=Math.atan2(_b.y-hz.y,_b.x-hz.x); hz.x+=Math.cos(a)*45*dt; hz.y+=Math.sin(a)*45*dt; } }   // au_hu1: ползучий яд

    if(hz.dps&&Math.random()<0.12)parts.push(new Particle(hz.x+(Math.random()-.5)*hz.r*1.3,hz.y+(Math.random()-.5)*hz.r*1.3,(Math.random()-.5)*20,-30-Math.random()*30,hz.color||'#f80',0.5,2,{glow:true}));   // тлеющие угли/испарения зон

// ── Loop ───────────────────────────────────────────────────────────────────
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,0.05);lastT=ts;
  ctx.setTransform(RQ,0,0,RQ,0,0);   // базовый transform кадра = масштаб рендера (всё рисуется в VW×VH, ложится в RQ-бэкинг)
  ctx.clearRect(0,0,VW,VH);
  if     (state==='menu')     {uiGutters();uiBegin();drawMenu();uiEnd();}
  else if(state==='achievements') {uiGutters();uiBegin();drawAchievements();uiEnd();}
  else if(state==='forge')    {uiGutters();uiBegin();drawForge();uiEnd();}
  else if(state==='bestiary') {uiGutters();uiBegin();drawBestiary();uiEnd();}
  else if(state==='skilltree'){uiGutters();uiBegin();drawSkillTree();uiEnd();}
  else if(state==='trials')   {uiGutters();uiBegin();drawTrials();uiEnd();}
  else if(state==='event')    {gameDraw();ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,VW,VH);uiBegin();drawEventChoice();uiEnd();}
  else if(state==='select')   {uiGutters();uiBegin();drawSelect();uiEnd();}
  else if(state==='play')     {gameUpdate(dt);tutUpdate(dt);gameDraw();}
  else if(state==='levelup')  {gameDraw();ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,VW,VH);uiBegin();drawLevelup();uiEnd();}
  else if(state==='archsel')  {gameDraw();ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,VW,VH);uiBegin();drawArchSel();uiEnd();}
  else if(state==='gameover') {gameDraw();ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,VW,VH);uiBegin();drawGameOver();uiEnd();}
  else if(state==='victory')  {gameDraw();ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,VW,VH);uiBegin();drawVictory();uiEnd();}
  if(typeof MUSIC!=='undefined'&&MUSIC.isReady&&MUSIC.isReady()){ if(state==='play')MUSIC.tick(enemies,player,state); else if(state!=='gameover'&&state!=='victory'&&state!=='levelup'&&state!=='archsel'&&state!=='event')MUSIC.setMusicState('menu'); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
